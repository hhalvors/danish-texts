    # Secondary literature on Heiberg (distinct from the primary `works` above).
    secondary-literature:

      - id: stewart-golden-age-texts
        author: "Jon Stewart (ed. and trans.)"
        title: "Texts from Golden Age Denmark, vols. 1–6"
        year: "2005–2011"
        venue: >
          Copenhagen: C.A. Reitzel / Museum Tusculanum Press; series ISSN
          1903-3336, now continued by Brill
        note: >
          Not secondary literature in the strict sense but the English edition of
          Heiberg's philosophical corpus, with introductions and commentary, and
          the reason translation is low priority for this author. Vol. 1,
          »Heiberg's On the Significance of Philosophy for the Present Age and
          Other Texts« (2005), also carries the »Autobiographical Fragments« with
          Heiberg's account of meeting Hegel in Berlin, and the theologians'
          replies. Vol. 2, »Heiberg's Speculative Logic and Other Texts« (2006),
          is the »Grundtræk« of 1832. Vol. 3, »Heiberg's Introductory Lecture to
          the Logic Course and Other Texts« (2007), includes Martensen's review
          and the answers by Sibbern, Nielsen and Kierkegaard. Vol. 4,
          »Heiberg's Contingency Regarded from the Point of View of Logic and
          Other Texts« (2008), has the 1825 contingency essay, the 1827
          »Nemesis« sequel, and articles from »Kjøbenhavns flyvende Post«
          1825–43. Vol. 5, »Mynster's 'Rationalism, Supernaturalism' and the
          Debate about Mediation« (2009). Vol. 6, »Heiberg's Perseus and Other
          Texts« (2011) — the only complete Perseus in any language that is
          readily obtainable, given that the Danish original is not digitised.
          Vol. 7 is Sibbern's »Bemærkninger og Undersøgelser«, cited under
          Sibbern above. Details from the series editor's own catalogue page;
          not held.
