        year: "1858–1875"
        venue: "Håndskriftsamlingen, Det Kgl. Bibliotek: Additamenta 414 kvart"
        note: >
          Brøchner's manuscript Nachlass: nine unpublished lecture courses from
          the Copenhagen chair, bound as a single archival unit. Provenance
          Københavns Universitetsbibliotek, incorporated into KB 1938; indexed
          in Krarup II, 6. NOT digitised — the unit is a reading-room loan
          (»skal bestilles«) at Den Sorte Diamant, so digitisation here means
          first obtaining images (order a reproduction, or photograph on site),
          and only then transcription — of handwriting, not print, so the usual
          OCR-based batch pipeline will not apply as-is. The item titles in the
          sections below follow the KB record, including its misprints in item
          (i) (»Philsophies« for »Philosophies«, »pg« for »og«). The contents
          span his whole professorship, from the 1858–59 lectures on modern
          philosophy and Christianity to the spring 1875 course on the points
          of difference between philosophy and theology, given in the year of
          his death. The three philosophisk Propædeutik courses (items b, g, h)
          are the introductory genre through which Brøchner reached students —
          the lectures the bio above credits with turning Høffding — and a
          student transcript of the 1869–70 Propædeutik cycle survives
          separately as NKS 4788 kvart (U. F. K. Carøe), listed under Rasmus
          Nielsen's manuscripts in this catalog: a possible control text, in a
          fair hand, for whichever course is taken up first.
