  - id: heegaard
    name: "Sophus Heegaard"
    dates: "1835–1884"
    bio: >
      Poul Sophus Vilhelm Heegaard took his theology degree in 1858 and the
      doctorate in philosophy in 1860, with a dissertation on Herbart, and
      lectured as a Privatdozent from that year. He began as a disciple of
      Rasmus Nielsen: his »Indledning til den rationelle Ethik« (1866) works
      within Nielsen's position, and Brandes reviewed it as a book with no
      standpoint of its own. In the summer of 1866 a short notice in
      Berlingske Tidende, saying that further study might oblige him to change
      direction, offended Nielsen, and an exchange followed. Martensen, who
      thought it well that Heegaard be at a distance from Nielsen for a time,
      arranged support for a study journey through France, Italy and Germany
      (1866–67), and on his return Heegaard published »Professor R. Nielsens
      Lære om Tro og Viden« (1867), a critique of the doctrine from within, by
      its former adherent. He became extraordinary docent in 1870 and, on
      Brøchner's death in 1875, professor — the chair Kristian Kroman later
      took over. Dansk Biografisk Leksikon notes the influence of F. A. Lange
      on his later thought. He is in this collection as the disciple who
      turned Nielsen's doctrine against itself in 1867, a year before
      Brøchner's »Problemet om Tro og Viden«.
    works:

      - id: nielsens-laere-tro-viden
        title: "Professor R. Nielsens Lære om Tro og Viden: en kritisk Afhandling"
        year: "1867"
        venue: "Den Gyldendalske Boghandel (F. Hegel), Copenhagen"
        note: >
          A critique of Nielsen's doctrine of faith and knowledge by a former
          disciple, written after the break of 1866 under an epigraph from
          Nielsen's own »Philosophisk Propædeutik«: a philosophy in open
          contradiction with „den sunde Forstand“ is false. Four parts and an
          Efterskrift; the last part reckons in a table how small a fraction
          of its announced system »Grundideernes Logik« has so far delivered.
          Brandes welcomed it: »Kritiken er ligesaa dygtig som alvorlig«
          (Samlede Skrifter XIII, p. 107).
        sections:
          - title: "Complete work (98 pp.)"
            status: complete
            links:
              - label: "Transcription"
                url: "https://hhalvors.github.io/danish-texts/texts/heegaard/nielsens-laere-tro-viden/transcription.pdf"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/11030800293A-bw.pdf"
          - title: "Complete work — translation"
            status: to-do
            links: []

      - id: rationelle-ethik
        title: "Indledning til den rationelle Ethik"
        year: "1866"
        note: >
          Written while Heegaard was still Nielsen's follower. Brandes
          reviewed it and then answered Heegaard's reply (Samlede Skrifter
          XIII, pp. 28–33 and 34–39).
        sections:
          - title: "Complete work"
            status: to-do
            links:
              - label: Google Books
                url: "https://books.google.com/books?id=Li0tAAAAYAAJ"

