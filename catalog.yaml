      - id: grundideernes-logik-kort-begreb
        title: "Grundideernes Logik i kort Begreb"
        year: "1870"
        venue: "J. H. Schubothe, Copenhagen"
        note: >
          Nielsen's own one-volume compend of the »Grundideernes Logik« system
          (1864–66), spanning the material of both volumes, including the
          natural-science Grundideer of vol. II. Published two years after
          Brøchner's »Problemet om Tro og Viden«, it names no critic, but its
          Forord presents it as »en kort og klar Fremstilling af sin
          theistiske Logik« organized around the »Knudepunkter, om hvilke den
          videnskabelige Strid mellem Pantheisme og Theisme væsenlig maa dreie
          sig« — the axis of the Brøchner exchange. The English title is »The
          Logic of the Fundamental Ideas in Brief Compass«.
        sections:
