# Danish Philosophical Texts — Catalog
#
# This file is the source of truth for the danish-texts page on hanshalvorson.com.
# It is intended to live in ~/danish-texts/catalog.yaml and be symlinked here:
#   ln -s ~/danish-texts/catalog.yaml ~/hhalvors.github.io/data/danish-texts.yaml
#
# Status values: complete | in-progress | skeleton | to-do | coming-soon | placeholder
#                | reference | none
# `none` renders NO badge (DanishTexts.hs, statusBadge). The key is still
# required — the parser fails without it — so a section that should show no
# badge says `status: none` rather than omitting it. The Bohr edition uses it:
# all 89 of its sections are in the same state, and 89 identical badges are
# only clutter.
#
# Link labels (suggested conventions):
#   Transcription, Translation, Scan, KB Scan, Wikisource,
#   Runeberg, JSTOR, Journal, PDF
#
# ON THE WORD "DANISH": Denmark and Norway were one state until 1814, so
# Holberg (b. Bergen) and Treschow (b. Drammen) belong to both traditions and
# the modern national claims are anachronistic for their lifetimes. The
# reader-facing version of this note is the second paragraph of the page
# preamble — NOT in this file, but hardcoded in the site generator:
#   ~/hhalvors.github.io/DanishTexts.hs, generateDanishTextsHTML (class
#   "dt-intro dt-note"), styled by .dt-note in css/style.css.
# Edit it there, not here, or the two will drift apart.
#
# ON THE ABSENCE OF WOMEN: the page preamble carries a third paragraph, "A note
# on the absence of women", in the same place (DanishTexts.hs,
# generateDanishTextsHTML, the second "dt-intro dt-note" paragraph). It names
# Gyllembourg, Thoresen, Fibiger and Frederiksen, who have author entries below,
# and Julie Thomsen, who appears under Brøchner's secondary literature. Keep the
# two in step if an entry is added, renamed or removed.

authors:

  - id: holberg
    name: "Ludvig Holberg"
    dates: "1684–1754"
    bio: >
      Bergen-born, Copenhagen-based playwright, historian, essayist and
      professor — the founder of modern Danish-Norwegian literature and, for
      Høffding, the founder of independent philosophical reflection in Denmark:
      »Danske Filosofer« (1909) opens with him. Holberg is no system-builder but
      a skeptic and empiricist in the Montaigne–Bayle vein, hostile to dogma and
      speculative systems, insisting that "man må først lære at tvivle førend man
      må lære at tro" (one must first learn to doubt before one can learn to
      believe). His relevance to the line running toward Bohr's "epistemological
      lesson" is one of disposition rather than doctrine: epistemic humility, the
      testing of received norms against sound reason, and — especially in »Niels
      Klim« — a sustained play with the relativity of standpoint, the recognition
      that how things appear depends on the observer's position. This
      anti-dogmatic, perspective-conscious temper is the seedbed of the critical
      Danish tradition that Høffding inherits and transmits. Further works not
      listed below include »Introduction til Naturens og Folke-Rettens Kundskab«
      (1716), the »Moralske Fabler« (1751), and the Latin autobiographical
      epistles (1728–1743).
    works:

      - id: moralske-tanker
        title: "Moralske Tanker"
        year: "1744"
        venue: "Kjøbenhavn"
        note: >
          Holberg's central philosophical work: a collection of reflective
          essays, framed as commentaries on his own epigrams, on morality,
          religion, knowledge and doubt. The clearest statement of his
          anti-systematic skepticism and the "doubt before belief" method that
          Høffding takes as the starting point of Danish philosophy.
        sections:
          - title: "Complete work"
            status: to-do
            links: []

      - id: epistler
        title: "Epistler"
        year: "1748–1754"
        venue: "Kjøbenhavn, 5 vols."
        note: >
          Over 500 essayistic letters, the mature continuation of the »Moralske
          Tanker«: doubt, tolerance, the relativity of custom, and the limits of
          human knowledge, handled case by case rather than as a system.
        sections:
          - title: "Complete work (vols. I–V)"
            status: to-do
            links: []

      - id: niels-klim
        title: "Niels Klims underjordiske Rejse (Nicolai Klimii iter subterraneum)"
        year: "1741"
        venue: "Latin original, Copenhagen/Leipzig; Danish transl. J. Baggesen 1789"
        note: >
          Satirical-philosophical subterranean voyage in Latin. Its device — a
          traveler judging human institutions from wholly other standpoints, and
          being judged in turn — is a sustained exercise in the relativity of
          viewpoint and religious/intellectual tolerance: the "epistemological
          lesson" theme (how things appear depends on the observer's position) in
          a literary key.
        sections:
          - title: "Complete work"
            status: to-do
            links: []

  - id: treschow
    name: "Niels Treschow"
    dates: "1751–1833"
    bio: >
      Norwegian-born philosopher; professor of philosophy at Copenhagen
      1803–1813, then the first professor of philosophy at the new Frederik
      University in Christiania (Oslo) from 1813. A Spinoza- and
      Leibniz-influenced monist and self-described Neoplatonist whose late
      "Identitets-system" treats the mental and the bodily — and, more broadly,
      the ideal and the real, subject and object — as two sides of one reality.
      His insistence that "in the real world only individuals exist" (universals
      being mere "Hjælpemidler til Oversyn," aids to survey, not knowledge of
      things in themselves) makes him an early source of the emphasis on
      concrete individuality that runs through nineteenth-century Danish
      philosophy. The relevance to the Bohr line is direct: Harald Høffding —
      Bohr's philosophical mentor, and himself in this catalog — discussed
      Treschow at length in »Danske Filosofer« (1909) and reprinted his essay on
      individuality in »Udvalgte Stykker af dansk filosofisk Litteratur« (1910).
      Treschow is thus the earliest figure on the Danish subject–object /
      individuality tradition that reaches Bohr's "epistemological lesson."
      The philosophical books are all listed below. Further items not
      catalogued here are the pre-1794 juvenilia and occasional pieces (»Om
      Veltalenheds Nytte« 1776, »Om offentlig Underviisning i Videnskaber«
      1785, the 1790 dissertation »De anthropomorphismo«), the 1807
      »Anatomisk-physiologiske Forelæsninger for Anthropologer«, the 1816 prize
      essay on rights and moral law, the 1817 »Politisk Catechismus«, and the
      1830 verse »Skabelsen, Mennesket og Messias«. All are digitised and
      public-domain at nb.no.
    works:

      - id: forsog-guds-tilvaerelse
        title: "Forsøg om Guds Tilværelse af theoretiske Grunde: i Anledning af den kantiske Philosophie"
        year: "1794"
        venue: "Kjøbenhavn"
        note: >
          The earlier of Treschow's two early critiques of Kant, written »i
          Anledning af den kantiske Philosophie«: a defense of theoretical
          grounds for God's existence against Kant's verdict that the
          speculative proofs fail. It is his first published engagement with
          the critical philosophy and the starting point of the path to the
          monist »Identitets-system« of the 1831–33 »Testament«.
        sections:
          - title: "Complete work (121 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/2c0dd7daeac482c15d1c687f1fa2da73"

      - id: forelaesninger-kantiske
        title: "Forelæsninger over den Kantiske Philosophie"
        year: "1798"
        venue: "Kjøbenhavn: Gyldendals Forlag"
        note: >
          The later of Treschow's two early critiques of Kant, on a much
          larger scale (361 printed pp.): a course of lectures expounding and
          assessing the critical philosophy as a whole. A German version,
          »Vorlesungen über die Kantische Philosophie. Erster Theil« (421
          pp.), appeared the same year. With the 1794 »Forsøg« it records what
          Treschow took from Kant and what he refused, and so is the baseline
          against which the monism of the 1805 »Philosophiske Forsøg« should
          be read.
        sections:
          - title: "Complete work (361 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/6361c914e2d828cea9b021ad3c7ec77d"
              - label: "Scan, German version (nb.no)"
                url: "https://www.nb.no/items/dfb9359282ef7fbd2b581d7334617705"

      - id: kort-udkast-mennesket
        title: "Kort Udkast til Kundskab om Mennesket, eller Anthropologie til Brug for de lærde Skoler"
        year: "1803"
        venue: "Kjøbenhavn: Fr. Brummers Forlag, hos Sebastian Popp"
        note: >
          A school textbook of anthropology for the »lærde Skoler«, written in
          the year Treschow took the Copenhagen chair. It is the direct
          predecessor of the 1812 »Om den menneskelige Natur«, and shows the
          doctrine of a twofold — bodily and mental — access to the human
          being nine years earlier, pitched at schoolboys. A German version,
          »Kurzer Entwurf zu einer Lehre von der Kenntniss des Menschen, oder
          Anthropologie« (323 pp.), appeared the same year.
        sections:
          - title: "Complete work (315 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/b7196714b9d6a21bd004a7474ade3d86"
              - label: "Scan, German version (nb.no)"
                url: "https://www.nb.no/items/6d9b126674095652f347efadb020f820"

      - id: indledning-hele-philosophie
        title: "Indledning til den hele Philosophie og de vigtigste Lærebygninger af samme"
        year: "1805"
        venue: "Kjøbenhavn: Fr. Brummers Forlag, hos Z. Breum"
        note: >
          A survey introduction to philosophy as a whole and to its principal
          systems (»Lærebygninger«), issued by the same publisher in the same
          year as the »Philosophiske Forsøg« and evidently its companion. It
          anticipates the 1811 »Om Philosophiens Natur og Dele«, which does
          the same work at greater length.
        sections:
          - title: "Complete work (226 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/0c5d1d0a7e5b3e9c66cae41bd7b56421"

      - id: philosophiske-forsog
        title: "Philosophiske Forsøg"
        year: "1805"
        venue: "Kjøbenhavn"
        note: >
          The first sketch of the identity-system later expanded in the 1831–33
          »Testament«. Useful as the compact early statement of his monism.
        sections:
          - title: "Complete work (409 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/7bd6a1b194386b4c61f5ae0a0a118ff9"

      - id: enslige-ting
        title: "Gives der noget Begreb eller nogen Idee om enslige Ting? Besvaret med Hensyn til Menneskeværd og Menneskevel"
        year: "1810"
        venue: "Det Kgl. Danske Videnskabernes Selskabs Skrifter, bd. 5"
        note: >
          Short, self-contained treatise arguing that only individuals are
          real and that general concepts are »kun Hielpemidler til Oversyn, ei
          til nöiagtig Kundskab om Tingene i sig selv« (p. 240). The core
          statement of Treschow's primacy of the individual, and the theme
          most resonant with Bohr's language of the "individuality" of the
          quantum phenomenon. Signed 1807 and printed in 1810, it was
          reprinted by Høffding (1910, in excerpt) and Winsnes (1966), and
          twice on its own under its subtitle, »Menneskeværd og Menneskevel«
          (1963, 1991).
        sections:
          - title: "Complete treatise (pp. 223–254)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/enslige-ting/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/enslige-ting/translation.pdf"
              - label: Scan (archive.org)
                url: "https://archive.org/details/kongeligedanskev35kong/page/n233/mode/1up"
              - label: Scan (BHL)
                url: "https://www.biodiversitylibrary.org/item/182420"

      - id: moral-folk-stat
        title: "Moral for Folk og Stat"
        year: "1810"
        venue: "Kjøbenhavn: Fr. Brummers Forlag, hos J. F. Schultz"
        note: >
          Treschow's moral philosophy (481 printed pp.), published the same
          year as the »enslige Ting« essay. The pairing of »Folk« and »Stat«
          in the title makes it the first place to look for how far the
          primacy of the individual extends from metaphysics into ethics and
          politics, the question »Lovgivnings-Principier« then takes up at
          length. The standard bibliographies give it as two parts, 1810–11.
        sections:
          - title: "Complete work (481 pp. digitised; bibliographies give 2 parts, 1810–11)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/fc422953d5cf38b89584f2a580b19ba4"

      - id: historiens-philosophie
        title: "Elementer til Historiens Philosophie"
        year: "1811"
        venue: "Kjøbenhavn, 2 vols."
        note: >
          Treschow's developmental philosophy applied to living nature and to
          the history of the species and of nations, which pass through
          childhood, youth, maturity and age. It is the continuity strand of
          the tradition — a counterpoint to the quantum discontinuity that
          Bohr's epistemology had to accommodate. The full title is »Elementer
          til Historiens Philosophie i Forelæsninger holdne Vinteren
          1806-1807«.
        sections:
          - title: "Complete work (vols. I–II)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/169c584e1d7f73408cb7516ce36f88cc"

      - id: philosophiens-natur
        title: "Om Philosophiens Natur og Dele: en dogmatisk og historisk Indledning til denne Videnskab"
        year: "1811"
        venue: "Kjøbenhavn"
        note: >
          A metaphilosophical introduction — what philosophy is, how it
          divides into parts, and how it got that way — expanding the 1805
          »Indledning til den hele Philosophie«. It is the companion to the
          1813 »Almindelig Logik«: the 1811 book says what the parts of the
          science are, and the 1813 textbook works out one of them.
        sections:
          - title: "Complete work (281 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/28ee69ca2c1b6afbace777f29a197fe4"

      - id: menneskelige-natur
        title: "Om den menneskelige Natur i Almindelighed, især dens aandelige Sider"
        year: "1812"
        venue: "Kjøbenhavn"
        note: >
          The first psychology written in Danish, and the fullest statement of
          Treschow's double-aspect view: the mental and the bodily are the
          same thing considered as an object of the inner and of the outer
          sense. »Sandselighedens første Lov« (p. 79) binds every bodily
          motion to a mental sensation answering to it in quality and
          magnitude, yet »Forholdet mellem begge er altsaa ikke caussalt« — a
          strict parallelism that anticipates the identity system of »Om Gud«.
          On p. 168 individuality is itself »Tingenes uforanderlige
          Grundform«, which ties the book to the 1810 »enslige Ting« essay.
        sections:
          - title: "Complete work (pp. 1–486) — pp. 1–261 transcribed"
            status: in-progress
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/menneskelige-natur/transcription.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/a82027cdd4a3b9c70976c711ad2388f1"

      - id: almindelig-logik
        title: "Almindelig Logik"
        year: "1813"
        venue: "Kjøbenhavn: Fr. Brummers Forlag"
        note: >
          Treschow's textbook of logic and theory of knowledge, the
          counterpart to the 1812 psychology; §§ 26–35 supply the machinery
          that the 1810 »enslige Ting« essay presupposes but never states. §
          30 (p. 97) gives a criterion of naturalness for classifications —
          the marks of proper kinds are »væsentlige og bestandige«, those of
          improper kinds »blot tilfældige og ubestandige« — and § 35 makes
          naturalness graded rather than binary. § 31 denies that the highest
          being is a whole of which individuals are parts.
        sections:
          - title: "§§ 26–35: Ordforklaringer, Beskrivelser, and the 4th Division »Om Delinger« (pp. 91–108)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/almindelig-logik/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/almindelig-logik/translation.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/198252f351aaf7a7a436b5d193fb1226"
          - title: "Remainder of the work (§§ 1–25, 36–97+)"
            status: to-do
            links: []

      - id: lovgivnings-principier
        title: "Lovgivnings-Principier"
        year: "1820–1823"
        venue: "Christiania (Chr. Grøndahl), 3 vols."
        note: >
          The political philosophy of the Christiania years, in three volumes
          (1820, 1821, 1823), and the largest thing Treschow published apart
          from the »Testament«. With »Moral for Folk og Stat« it is where the
          primacy of the individual meets the state, and so where it can be
          tested against Brekke's relational, sociability-based reading of
          Treschow.
        sections:
          - title: "Vol. I: Religion, Sæder og Cultur (1820, 479 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/56e954f1d834a12d5ec8c0a22b141bd8"
          - title: "Vol. II: offentlig Velstand, Næringsveie, Handel, Fattigvæsenet, Penge- og Skatte-Væsenet (1821, 437 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/7de63686603a53804d5336b0af0a1cde"
          - title: "Vol. III: Justits- og Forsvarsvæsenet, Statsforfatning, Staters Forhold til hverandre (1823, 513 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/ec7a3f32ab25c5a36938f314736306a9"

      - id: philosophiske-saedelaere
        title: "Den philosophiske Sædelæres første Grunde, til Brug ved Forelæsninger"
        year: "1824"
        venue: "Christiania: Trykt hos Chr. Grøndahl"
        note: >
          The lecture textbook of moral philosophy from the Christiania chair,
          standing to »Moral for Folk og Stat« (1810) roughly as the 1813
          »Almindelig Logik« stands to the larger theoretical works. A
          textbook has to say plainly what the big books can leave implicit.
        sections:
          - title: "Complete work (247 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/2828e6ffc889485eea8f6b14ecd76c7a"

      - id: christendommens-aand
        title: "Christendommens Aand, eller Den evangeliske Lære: Frimodig og upartisk beskreven"
        year: "1828"
        venue: "Christiania: Trykt hos Chr. Grøndahl"
        note: >
          Treschow's book on Christianity, three years before the first volume
          of the »Testament« and its theological antechamber. The Christiania
          pastor W. A. Wexels published against it, and Treschow replied the
          same year with the 35-page »Anhang til Bogen om Christendommens
          Aand«, linked below — the one place where the identity system had to
          be defended as orthodoxy.
        sections:
          - title: "Complete work (287 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/355fb0b312643d317f41af10c2f30650"
          - title: "»Anhang til Bogen om Christendommens Aand«, reply to Pastor Wexels (1828, 35 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/47b546990df719ef8e002f247dce3563"

      - id: om-gud-idee-sandseverdenen
        title: "Om Gud, Idee- og Sandseverdenen samt de førstes Aabenbarelse i den sidste. Et philosophisk Testament"
        year: "1831–1833"
        venue: "Christiania (Grøndahl), 3 vols."
        note: >
          Treschow's summa, written in retirement and prefaced with an
          autobiography: the detailed statement of his monist
          »Identitets-system«, in which God is not the sum of things but a
          real individual that makes all things one. The transcribed spans of
          vol. I answer »Almindelig Logik« § 31: the unity of the ideal world
          is a relational unity of »Vexelvirkning« among Ideas (p. 220), and
          individuals compose the world of sense, not God (p. 221). Page 207
          gives the sharpest statement of the primacy of the individual
          anywhere in the corpus, and p. 206 breaks with Plato: the Ideas are
          individual, not the objects of general concepts.
        sections:
          - title: "Vol. I, extracts: the individuality of the Ideas; unity by reciprocity (pp. 202–207, 220–221)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/om-gud/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/om-gud/translation.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/744d25724c6a9bb8c825bcc9186eaef1"
          - title: "Remainder of vols. I–III"
            status: to-do
            links:
              - label: "Scan, vol. II (nb.no)"
                url: "https://www.nb.no/items/5da969cc54d78ea86c9610599c8e396c"
              - label: "Scan, vol. III (nb.no)"
                url: "https://www.nb.no/items/7a480a1be9b53a5ccd959a1938550e7c"

    # Twentieth-century scholarly editions and reprints of the primary works
    # above. None is a source of new text; they matter for citation, for the
    # editorial apparatus they carry, and because they are what a modern reader
    # is likely to have to hand.
    modern-editions:

      - id: menneskevaerd-1963
        title: "Menneskeværd og Menneskevel"
        year: "1963"
        venue: "Oslo: Johan Grundt Tanum, 57 pp."
        note: >
          Free-standing reprint of the 1810 »enslige Ting« essay, retitled by
          its subtitle — which is why it does not surface under the original
          title in library catalogs. It is the first modern printing of the
          essay in full, three years before the Winsnes selection. Digitized
          at nb.no, readable from Norwegian IP addresses only.
        sections:
          - title: "Complete reprint (57 pp.) — not held"
            status: reference
            links:
              - label: nb.no (Norway-only)
                url: "https://www.nb.no/items/c33d8031a41e7830d366019a789d852c"

      - id: winsnes-1966
        editor: "A. H. Winsnes"
        title: "»Philosophiske Forsøg« og andre skrifter"
        year: "1966"
        venue: >
          Oslo: Johan Grundt Tanum, 225 pp. Series: »Norsk filosofi i det 19.
          århundre« 1 / Thorleif Dahls kulturbibliotek
        note: >
          The standard modern selection from Treschow, in which the 1810
          »enslige Ting« essay is reprinted complete. It opens the series
          »Norsk filosofi i det 19. århundre«, presenting Treschow as the
          first figure of a Norwegian nineteenth-century philosophy rather
          than a Danish one. Digitized at nb.no, readable from Norwegian IP
          addresses only.
        sections:
          - title: "Complete volume (225 pp.) — not held"
            status: reference
            links:
              - label: nb.no (Norway-only)
                url: "https://www.nb.no/items/7a5422f7bb819a4789d2166aa632d972"

      - id: juul-nielsen-1991
        editor: "Jørgen Juul Nielsen (introduction and notes)"
        title: "Menneskeværd og menneskevel"
        year: "1991"
        venue: "København: C. A. Reitzels Forlag, 83 pp. ISBN 87-7421-728-3"
        note: >
          Danish edition of the 1810 »enslige Ting« essay, again under its
          subtitle, with an introduction and notes by Jørgen Juul Nielsen. It
          is the only one of the three modern editions with a full modern
          commentary, and the only one published in Denmark. Not digitized.
        sections:
          - title: "Complete edition (83 pp.) — not held; consult against the »enslige-ting« translation"
            status: reference
            links: []

    # Secondary literature on Treschow (distinct from the primary `works` above).
    secondary-literature:

      - id: winsnes-niels-treschow
        author: "A. H. Winsnes"
        title: "Niels Treschow"
        year: "1956"
        venue: >
          Det Kongelige Norske Videnskabers Selskabs Forhandlinger, bd. 29
          (Trondheim: Aktietrykkeriet, i kommisjon hos F. Bruns Bokhandel, 1956),
          31 pp. (offprint, pp. 1*–31*)
        note: >
          Biographical address by the literary historian A. H. Winsnes on the
          Society's anniversary day, 26 February 1956: a concise Norwegian
          overview of Treschow's »philosophia perennis«, his debt to Leibniz
          and Spinoza, and the primacy of the individual in the »enslige Ting«
          essay. It closes with a useful bibliography of the older
          scholarship, including Høffding's »Danske Filosofer« (1909) and
          »Udvalgte Stykker« (1910).
        sections:
          - title: "Complete article (pp. 1*–31*)"
            status: complete
            links:
              - label: PDF
                url: "https://www.dknvs.no/wp-content/uploads/2024/07/1956-Treschow_vWinsnes1956.pdf"

      - id: stybe-danish-neoplatonist-1976
        author: "Svend Erik Stybe"
        title: "Niels Treschow (1751–1833), A Danish Neoplatonist"
        year: "1976"
        venue: "Danish Yearbook of Philosophy 13 (1), pp. 29–47"
        doi: "10.1163/24689300-01301003"
        note: >
          The one substantial treatment of Treschow in English. Stybe reads
          him as a Neoplatonist — Treschow's own label — which bears directly
          on »Om Gud«: the eternal Ideas, their outflowing (»Udflydelse«) from
          the absolutely One, and the principle that the highest and the
          lowest things are essentially alike. Treschow's Neoplatonism is
          heterodox on the decisive point, since his Ideas are themselves
          individual (»Om Gud« I, p. 206).
        sections:
          - title: "Complete article (pp. 29–47)"
            status: reference
            links:
              - label: DOI
                url: "https://doi.org/10.1163/24689300-01301003"
              - label: Brill
                url: "https://brill.com/view/journals/dyp/13/1/article-p29_3.xml"

      - id: christophersen-treschow-1977
        author: "H. O. Christophersen"
        title: "Niels Treschow, 1751–1833: en tenker mellom to tidsaldrer"
        year: "1977"
        venue: "Oslo: Grøndahl, 549 pp. ISBN 82-504-0270-7"
        note: >
          The standard monograph on Treschow, and the largest single piece of
          scholarship on him: »a thinker between two ages«, straddling
          Enlightenment and Romanticism and the Danish and Norwegian phases of
          his career. Digitized at nb.no, readable from Norwegian IP addresses
          only.
        sections:
          - title: "Complete monograph (549 pp.) — not held; consult before publishing"
            status: reference
            links:
              - label: nb.no (Norway-only)
                url: "https://www.nb.no/items/85cc02b7fc019240bd8c3839b2ad0f12"

      - id: lundestad-tidlige-norske-2002
        author: "Erik Lundestad"
        title: "Den tidlige norske filosofien: en lesning av Treschow, Schweigaard og Monrad"
        year: "2002"
        venue: "Universitetet i Tromsø"
        note: >
          Reads Treschow alongside A. M. Schweigaard and M. J. Monrad as the
          first phase of an independent Norwegian philosophy — a different
          framing from Høffding's Danish one. Digitized at nb.no, readable
          from Norwegian IP addresses only.
        sections:
          - title: "Complete work — not held"
            status: reference
            links:
              - label: nb.no (Norway-only)
                url: "https://www.nb.no/search?q=Den%20tidlige%20norske%20filosofien"

      - id: koch-oplysningsfilosofi-2003
        author: "Carl Henrik Koch"
        title: "»Filosofien på Københavns Universitet fra 1803 til 1813: Niels Treschow«, in »Dansk oplysningsfilosofi 1700–1800«"
        year: "2003"
        venue: >
          Den danske filosofis historie, ed. Sten Ebbesen and Carl Henrik Koch,
          bd. 3 (København: Gyldendal, 2003), 385 pp. ISBN 87-02-01584-6;
          e-book 2016, ISBN 978-87-11-49738-8. The Treschow chapter stands in
          Part 1, »Filosofien som skole og universitetsfag«.
        note: >
          The standard Danish account: Koch treats Treschow as a Danish
          university philosopher, the holder of the Copenhagen chair between
          Riisbrigh and Sibbern, rather than as the first figure of a
          Norwegian philosophy. The chapter covers 1803–13 but is filed in the
          Enlightenment volume (bd. 3, 1700–1800), because Koch carries the
          history of the chair past 1800; the same volume has the chapter on
          Holberg.
        sections:
          - title: "Chapter »Filosofien på Københavns Universitet fra 1803 til 1813: Niels Treschow« — not held; page range to establish"
            status: reference
            links:
              - label: bibliotek.dk
                url: "https://bibliotek.dk/materiale/dansk-oplysningsfilosofi_carl-henrik-koch/work-of:870970-basis:24961869"

      - id: brekke-dannelse-og-kjonn-2012
        author: "Tone Brekke"
        title: "«(S)aa meget bedre skikkede til … de mindste Ting»: Niels Treschow om dannelse og kjønn"
        year: "2012"
        venue: "Tidsskrift for kjønnsforskning 36 (2), pp. 99–120"
        doi: "10.18261/ISSN1891-1781-2012-02-03"
        note: >
          Treschow on Dannelse (Bildung) and gender. Brekke argues that
          although Treschow would exclude women from the university, he
          grounds both individual and social Dannelse in sociability, the
          family, and feminine models of sympathy and care, against academia
          as a homosocial and over-rationalized sphere. Sociability takes the
          individual relationally rather than atomistically, so the article
          tests how far the primacy of the individual extends into the moral
          and political writings.
        sections:
          - title: "Complete article (pp. 99–120)"
            status: reference
            links:
              - label: DOI
                url: "https://doi.org/10.18261/ISSN1891-1781-2012-02-03"
              - label: Scandinavian University Press
                url: "https://www.scup.com/doi/10.18261/ISSN1891-1781-2012-02-03"

      - id: torjussen-visdom-klokskap-2026
        author: "Lars Petter Storm Torjussen"
        title: "«Thi Klogskab burde være Videnskabs Slavinde, og hielpe den til at bestige Visdoms Throne» – Niels Treschow og forholdet mellom filosofisk visdom og politisk klokskap"
        year: "2026"
        venue: "Norsk filosofisk tidsskrift 61 (1–2), pp. 4–14"
        doi: "10.18261/nft.61.1-2.3"
        note: >
          The most recent scholarship on Treschow. Torjussen argues that for
          Treschow the task of philosophy is to supply not knowledge but
          wisdom, through spiritual exercises aimed at peace of mind, and
          reads him through Pierre Hadot's »view from above«; politics then
          rests on a doctrine of virtue in which prudence is made science's
          handmaid. Open access at the DOI.
        sections:
          - title: "Complete article (pp. 4–14)"
            status: reference
            links:
              - label: DOI
                url: "https://doi.org/10.18261/nft.61.1-2.3"

  - id: gyllembourg
    name: "Thomasine Gyllembourg"
    dates: "1773–1856"
    bio: >
      Thomasine Christine Gyllembourg-Ehrensvärd, born Buntzen into a Copenhagen
      merchant family, married the radical writer P.A. Heiberg in 1790 and, after
      his exile, divorced him in 1801 to marry C.F. Gyllembourg-Ehrensvärd. She
      made her debut at fifty-three, in 1827, in her son J.L. Heiberg's
      »Kjøbenhavns flyvende Post«, and published anonymously for the rest of her
      life as "the author of »En Hverdags-Historie«", with Heiberg as editor of
      record; her name first appeared on her collected works in 1866–67. Her
      novellas take the modern family as their object — marriage, the private
      feeling of women, and the distance between public propriety and inner life.
      She belongs in this catalog because of »To Tidsaldre« (1845). Kierkegaard's
      »En literair Anmeldelse« (1846) is formally a review of it, and the
      diagnosis of "the present age" for which that review is known is worked out
      through her contrast between the age of revolution and the present one.
    works:

      - id: to-tidsaldre
        title: "To Tidsaldre"
        year: "1845"
        venue: "Copenhagen, ed. J.L. Heiberg"
        note: >
          A novella set in two generations, the 1790s and the 1840s, and the
          object of Kierkegaard's »En literair Anmeldelse« (1846). A modern edited
          text is on the Royal Danish Library's text portal (from »Drøm og
          Virkelighed«, 1986) and on tekstnet.dk; no first-edition scan has yet
          been located for this collection.
        sections:
          - title: "Complete work"
            status: to-do
            links:
              - label: "KB tekstportal (1986 ed.)"
                url: "https://tekster.kb.dk/text/adl-texts-gyllem14val-shoot-workid58123"
              - label: "tekstnet.dk"
                url: "https://tekstnet.dk/books/gyllembourg-t_to-tidsaldre/"
              - label: "Kierkegaard's review (SKS 8, KB tekstportal)"
                url: "https://tekster.kb.dk/text/sks-la-txt-root"

      - id: hverdags-historie
        title: "En Hverdags-Historie"
        year: "1828"
        note: >
          The novella that gave the anonymous author her standing name. Listed
          for orientation; no scan has yet been located for this collection.
        sections:
          - title: "Complete work"
            status: to-do
            links:
              - label: "Author portrait (tekstnet.dk)"
                url: "https://tekstnet.dk/authors/thomasine-gyllembourg/portrait/"

  - id: orsted
    name: "Hans Christian Ørsted"
    dates: "1777–1851"
    bio: >
      Physicist, chemist and natural philosopher; professor at Copenhagen from
      1806 and founder of the Polytekniske Læreanstalt (1829). In 1820 he
      discovered electromagnetism — that an electric current deflects a magnetic
      needle — and in 1825 was the first to isolate metallic aluminium. But
      Ørsted was as much a philosopher of nature as an experimenter: a student of
      Kant and of the German Naturphilosophie, he held that the same reason the
      mind finds in itself is objectively at work in nature, so that the laws of
      thought and the laws of nature ultimately coincide. This dynamical monism —
      opposed forces as convertible expressions of one underlying activity — is
      the thesis of his late essay-collection »Aanden i Naturen« (1850), "the
      spirit (reason) in nature," and it is why he belongs in this catalog: it is
      a Danish source of the unity-of-nature theme running toward Bohr. Ørsted
      also gave physics the term »Tankeeksperiment« (thought experiment) and
      coined much of the modern Danish scientific vocabulary; Høffding treated him
      among the »Danske Filosofer«. Two English editions cover most of his
      important work: »The Soul in Nature« (trans. L. & J. B. Horner, London:
      Bohn, 1852) for the philosophy of nature, and the 83-item »Selected
      Scientific Works of Hans Christian Ørsted« (trans. Jelved, Jackson &
      Knudsen, Princeton, 1998) for the scientific and aesthetic essays — the
      source of most of the translation links below. Further works not listed
      below include »Videnskaben om Naturens almindelige Love« (1809),
      »Naturlærens mechaniske Deel« (1844), and the poem »Luftskibet« (1836).
    works:

      - id: metaphysik-naturens
        title: "Dissertatio de forma metaphysices elementaris naturae externae"
        year: "1799"
        venue: "Kjøbenhavn (doctoral dissertation, based on Kant)"
        note: >
          Ørsted's Kantian doctoral dissertation, the metaphysical foundation of
          everything that followed: nature construed through fundamental dynamical
          forces rather than inert matter. Rendered into English in the Selected
          Scientific Works as two 1799 pieces — "Fundamentals of the Metaphysics
          of Nature, Partly According to a New Plan" and "Dissertation on the
          Structure of the Elementary Metaphysics of External Nature."
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: forste-indledning-naturlaere
        title: "Første Indledning til den almindelige Naturlære"
        year: "1811"
        venue: "Kjøbenhavn"
        note: >
          Introductory lectures on the method and unity of physics — his fullest
          early statement of how the study of nature should be conceived and
          taught. English in the Selected Scientific Works as "First Introduction
          to General Physics."
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: ansicht-chemische-naturgesetze
        title: "Ansicht der chemischen Naturgesetze, durch die neueren Entdeckungen gewonnen"
        year: "1812"
        venue: "Berlin (Realschulbuchhandlung); German"
        note: >
          Ørsted's systematic statement of a dynamical chemistry — chemical
          phenomena as the play of two fundamental opposed forces — the mature
          theoretical background to the 1820 discovery. English in the Selected
          Scientific Works as "View of the Chemical Laws of Nature."
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: conflictus-electricus
        title: "Experimenta circa effectum conflictus electrici in acum magneticam"
        year: "1820"
        venue: "Hafniae [Copenhagen]; Latin pamphlet, 21 July 1820"
        note: >
          The four-page Latin announcement of the discovery of electromagnetism —
          a current-carrying wire deflects a nearby magnetic needle — the single
          most consequential thing Ørsted did and a founding document of modern
          physics. Translated into English at once as "Experiments on the Effect
          of a Current of Electricity on the Magnetic Needle" (Annals of
          Philosophy 16, 1820); also in the Selected Scientific Works.
        sections:
          - title: "Complete paper"
            status: complete
            links:
              - label: "Translation (Annals of Philosophy, 1820)"
                url: "https://erenow.org/common/history-philosophy-science-reader/54.php"
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: fysikken-og-det-skonne
        title: "Essays on light and the physics of beauty (»det Skjønnes Physik«)"
        year: "1842–1843"
        venue: "Copenhagen"
        note: >
          Ørsted's aesthetics: the attempt to ground beauty — especially the
          beauty of light and lustre — in physical law, the counterpart in art to
          his philosophy of nature and a key source for his epistemology of
          »Anskuelse« (intuition/contemplation). English in the Selected
          Scientific Works as "An Investigation of Light with Regard to the
          Physics of Beauty," its continuation, and "Development of the Theory of
          Lustre."
        sections:
          - title: "Complete essays"
            status: complete
            links:
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: aanden-i-naturen
        title: "Aanden i Naturen"
        year: "1850"
        venue: "Kjøbenhavn (A. F. Høst), 2 vols. 1849–50"
        note: >
          Ørsted's philosophical masterwork: essays and dialogues on the
          philosophy of nature, science, reason and beauty, arguing that nature is
          the expression of an all-pervading reason. The fullest statement of his
          dynamical Naturphilosophie and his most directly philosophical book.
          Translated complete into English (from Ørsted's own German »Der Geist in
          der Natur«, 1850–51) as »The Soul in Nature, with Supplementary
          Contributions«.
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: "Translation (Horner 1852)"
                url: "https://archive.org/details/soulinnaturewit00horngoog"
              - label: Wikisource
                url: "https://en.wikisource.org/wiki/The_Soul_in_Nature"
              - label: HathiTrust
                url: "https://catalog.hathitrust.org/Record/001389004"

  - id: sibbern
    name: "F.C. Sibbern"
    dates: "1785–1872"
    bio: >
      Frederik Christian Sibbern, professor of philosophy at Copenhagen
      1813–1870. Close friend of Poul Martin Møller; Kierkegaard attended
      his lectures and called him a lovable and distinctive thinker. A
      transitional figure who resisted the Hegelian campaign of the 1830s and
      anticipated several of Kierkegaard's central arguments. What he set
      against Hegel was personality as the highest value: where the individual
      is subordinated to the universal and subjective truth to objective, so
      that the well-ordered state becomes the end of Dannelse, Sibbern held
      that a truth is not appropriated until it has been personally lived and
      undergone, and is possessed only »som personliggjort i os« — turned by
      the will into an actual life. Kim Minke's chapter in Dansk litteraturs
      historie, catalogued under secondary literature below, makes this
      personality-philosophy the built-in premise of Møller, of Kierkegaard's
      ethicist, and of the Danish Bildungsroman, and the ground of the critique
      of Hegel that »baner vej for Kierkegaards«. For the life — the
      parentage, the walking tour to Hegel and Goethe, Sophie Ørsted, the
      fifty-seven years in the chair — see the essay »The Doctor's Son Called
      Gabrielis«.
    works:

      - id: menneskets-natur
        title: "Menneskets aandelige Natur og Væsen. Et Udkast til en Psychologie"
        year: "1819–1828"
        venue: "Copenhagen"
        note: >
          Sibbern's principal psychological work, in two parts: Part 1 (1819)
          and Part 2 (1828), the latter subtitled »Psychologisk Pathologie«.
          Part 2 was reissued in 1885 by his son Gabriel Sibbern as »Læren om
          de menneskelige Følelser og Lidenskaber«.
        sections:
          - title: "Anden Deel (1828), »Psychologisk Pathologie« — scan held, not transcribed"
            status: to-do
            links:
              - label: "1885 reissue (Internet Archive)"
                url: "https://archive.org/details/lrenomdemennesk00sibbgoog"
          - title: "Første Deel (1819) — no scan located"
            status: to-do
            links: []

      - id: om-elskov
        title: "Om Elskov eller Kjerlighed imellem Mand og Qvinde"
        year: "1819"
        venue: "Copenhagen"
        note: >
          Sibbern's treatise on love between man and woman, in three »Bøger«.
          Transcribed from the »Tredie uforandrede Udgave« (Kjøbenhavn 1858),
          whose text is unchanged from the 1819 first edition.
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/sibbern/om-elskov/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/sibbern/om-elskov/translation.pdf"
              - label: HathiTrust
                url: "https://catalog.hathitrust.org/Record/011261596"

      - id: logikens-elementer
        title: "Logikens Elementer (1822); 2nd ed. as Logik som Tænkelære (1827)"
        year: "1822, 1827"
        venue: "Copenhagen"
        note: >
          Sibbern's first logic, printed as a manuscript for his students; the
          1827 second edition, transcribed here, appeared as »Logik som
          Tænkelære« (XXII + 378 pp.). Its Fortale compares »nærværende Udgave
          med den første« and reports that the ground-view is unchanged but
          the execution differs enough that the two are not simply printings
          of one text. The 1827 book is distinct from the 1835 »Logik som
          Tænkelære fra en intelligent Iagttagelses Standpunct og i
          analytisk-genetisk Fremstilling«, listed separately below.
        sections:
          - title: "Logik som Tænkelære (1827), the second edition"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/sibbern/logikens-elementer/transcription.pdf"
          - title: "Logikens Elementer (1822), the first edition — no scan located"
            status: to-do
            links: []

      - id: erkjendelse
        title: "Om Erkjendelse og Granskning. Til Indledning i det academiske Studium"
        year: "1822"
        venue: "Copenhagen"
        note: >
          Sibbern's introduction to academic study, on knowledge
          (»Erkjendelse«) and inquiry (»Granskning«). Transcribed from the
          first edition (Kjøbenhavn 1822, Paa Fr. Brummers Forlag); the
          translation keeps a lightly modernized register and glosses key
          terms with the Danish on first use.
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/sibbern/erkjendelse/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/sibbern/erkjendelse/translation.pdf"

      - id: gabrielis
        title: "Udaf Gabrielis' Breve til og fra Hjemmet"
        year: "1826"
        venue: "Copenhagen"
        note: >
          Sibbern's Gabrielis fiction is two novels: »Efterladte Breve af
          Gabrielis« (1826), some 100 letters from a young theology student
          written from the country near Herlufsholm, and the continuation
          »Udaf Gabrielis's Breve til og fra Hjemmet« (1850), set ten years
          later. Christian Molbech's contemporary review read the 1826 book as
          a Danish wertheriade; Minke replies that it fails as one »først og
          fremmest fordi den slet ikke er det«, and is rather the seed of the
          Danish Bildungsroman. Transcribed from the »Femte Udgave« (1893),
          with a Forord by Høffding and Sibbern's dedication to Mynster, dated
          1850.
        sections:
          - title: "Complete work"
            status: in-progress
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/sibbern/gabrielis/transcription.pdf"

