    # Modern editions and translations of the primary works above.
    modern-editions:

      - id: thompson-kangas-1997
        editor: "Curtis L. Thompson and David J. Kangas (trans.)"
        title: "Between Hegel and Kierkegaard: Hans L. Martensen's Philosophy of Religion"
        year: "1997"
        venue: "Atlanta: Scholars Press. AAR Religions in Translation 17, 337 pp."
        note: >
          English translations of three early works in which Martensen set
          out his speculative theology: the licentiate dissertation »Den
          menneskelige Selvbevidstheds Autonomie« (1837; Danish 1841),
          »Mester Eckart« (1840), and »Grundrids til Moralphilosophiens
          System« (1841). These are the writings that made Hegelian theology
          the reigning fashion in Copenhagen, and so the easiest way into the
          Martensen at whom Kierkegaard's »Johannes Climacus« and Nielsen's
          polemic were aimed.
        sections:
          - title: "Complete volume"
            status: reference
            links:
              - label: "Google Books"
                url: "https://books.google.com/books?id=yFra2mmhJUIC"

    # Secondary literature on Martensen (distinct from the primary `works` above).
    secondary-literature:

      - id: stewart-martensen-2012
        author: "Jon Stewart (ed.)"
        title: "Hans Lassen Martensen: Theologian, Philosopher and Social Critic"
        year: "2012"
        venue: >
          Danish Golden Age Studies 6, Copenhagen: Museum Tusculanum Press
        note: >
          The standard English-language collection on Martensen, from the same
          series and editor as the Møller volume above, and the natural first
          stop for the anglophone reader.
        sections:
          - title: "Complete volume — not held"
            status: reference
            links: []

      - id: li-dphil-2020
        author: "Elizabeth Li"
        title: "Kierkegaard, Martensen, and the Problem of Philosophy and Theology"
        year: "2020"
        venue: "DPhil thesis, University of Oxford, Faculty of Theology and Religion"
        doi: "10.5287/ora-9o5gr1bqq"
        note: >
          One of the few focused studies of Martensen, reading him as
          Kierkegaard's central interlocutor on the relation of philosophy
          and theology. Li sets Martensen's "dialectic of unity-in-difference",
          which harmonizes philosophy, theology and religion in a higher
          synthesis, against Kierkegaard's "dialectic of
          similarity-in-dissimilarity", which keeps the gap between
          philosophy and Christianity open. Open access at the Oxford
          University Research Archive.
        sections:
          - title: "Complete thesis"
            status: reference
            links:
              - label: "PDF (ORA)"
                url: "https://ora.ox.ac.uk/objects/uuid:520777f6-50c8-4672-afa8-879543697981/files/drn3011443"

      - id: li-existence-2021
        author: "Elizabeth Li"
        title: "Existence in the thought and theology of Hans Lassen Martensen"
        year: "2021"
        venue: "Studia Theologica – Nordic Journal of Theology 76:2 (2022), 150–171; online 2021"
        doi: "10.1080/0039338X.2021.1954998"
        note: >
          Against the Kierkegaardian caricature of Martensen as a courtier of
          Hegelian speculation and Christendom's cultural religiosity, Li
          places him within a wider existential movement in nineteenth-century
          Danish philosophy. She finds the concern with existence in three
          moments of his theology: religion as an existential relation,
          dogmatics as existential knowledge, and theological ethics as
          existential striving.
        sections:
          - title: "Complete article"
            status: reference
            links: []

      - id: li-upbuilding-2025
        author: "Elizabeth Li"
        title: "Upbuilding Religious Popular-Philosophy: Martensen's Eckhart and Kierkegaard's Defence of Mysticism"
        year: "2025"
        venue: "In Hjördis Becker-Lindenthal (ed.), Kierkegaard and Mysticism: Reception, Influence, Resonance, London: Routledge, 98–113"
        doi: "10.4324/9781003461869-9"
        note: >
          On Martensen's characterization of German medieval mysticism as
          "upbuilding religious popular-philosophy" in »Mester Eckart«
          (1840), a call to read the mystics for upbuilding that scholarship
          has overlooked because Martensen held that speculation must finally
          go beyond mysticism. Li argues that Kierkegaard accepts Martensen's
          view of mysticism as upbuilding but defends it against the claim
          that speculative theology surpasses it, and that the two are closer
          on mysticism than either cared to admit.
        sections:
          - title: "Chapter"
            status: reference
            links: []

  - id: nielsen
    name: "Rasmus Nielsen"
    dates: "1809–1884"
    bio: >
      Professor of philosophy at Copenhagen 1841–1884. Developed the central position
      of the mid-century debate: that faith and knowledge spring from absolutely
      heterogeneous principles. Target of both Brøchner's philosophical critique and
      Brandes's cultural polemic.
    works:

      - id: speculative-methode
        title: "Den speculative Methodes Anvendelse paa den hellige Historie"
        year: "1842"
        venue: "H.C. Klein, Copenhagen"
        note: >
          Bøggild's Danish version of Nielsen's 1840 Latin dissertation »De
          speculativa historiae sacrae tractandae methodo« (162 pp.): the
          earliest statement of the speculative program he would spend the
          1850s and 1860s dismantling from within, and so the measure of how
          far he moved. Its two parts treat the relation of philosophy to
          history in general (§§ 1–10) and sacred history itself (§§ 11–23),
          running from Catholicism through Luther to rationalism and Strauß's
          panlogism. Bøggild's preface (1842), which sets the book against
          Martensen's »Den menneskelige Selvbevidstheds Autonomie«, survives
          in the scan only as a fragment.
        sections:
          - title: "Complete work (162 pp.)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/nielsen/speculative-methode/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/nielsen/speculative-methode/translation.pdf"
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122823517205763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/110208016515-color.pdf"

      - id: propaedeutiske-logik
        title: "Den propædeutiske Logik"
        year: "1845"
        venue: "P.G. Philipsen, Copenhagen"
        note: >
          Nielsen's pre-Kierkegaardian logic textbook (283 pp.), superseded by
          the »Philosophisk Propædeutik« of 1857, and so the baseline against
          which to measure what the encounter with Kierkegaard changed. Two
          parts, on the subjective concept (§§ 1–11: concept, judgment,
          inference) and the objective concept (§§ 12–21, ending in »Idee og
          Gud«), with heavy quotation of Kant, Fichte, Hegel and Heiberg.
