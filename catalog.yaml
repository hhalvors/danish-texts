  - id: heiberg
    name: "J.L. Heiberg"
    dates: "1791–1860"
    bio: >
      Johan Ludvig Heiberg — poet, vaudeville dramatist, critic, editor, from
      1849 director of the Royal Theatre, and the man who made Hegel a Danish
      subject. He is in this catalog for one reason: almost every philosophical
      quarrel the other authors here are having is a quarrel he started. In
      Berlin in 1824 he met Hegel, attended his lectures, and underwent what he
      later described as a philosophical conversion; the same year he brought
      out »Om den menneskelige Frihed« from Kiel, the first work in Danish
      literature to argue a case on Hegelian ground. From then until the early
      1840s he ran what was in effect a campaign — through his journals
      »Kjøbenhavns flyvende Post« (1827–37), »Perseus« (1837–38) and
      »Intelligensblade« (1842–44), through the logic textbook written for his
      cadets at the Royal Military College, and through the public lecture
      series announced by »Om Philosophiens Betydning for den nuværende Tid«
      (1833) — to persuade Golden Age Denmark that Hegel's system was the cure
      for an age he diagnosed as being in crisis. The campaign is the hinge of
      this catalog's middle. Martensen, who reviewed the »Indlednings-Foredrag«
      in 1836, took the speculative program into theology and became the target
      of both Kierkegaard and Nielsen. Sibbern's »Bemærkninger og Undersøgelser,
      fornemmelig betreffende Hegels Philosophie« (1838) — transcribed and
      translated in full under Sibbern above — is formally a review of the first
      volume of »Perseus«, and remains the most thorough Danish critique of
      Hegel ever written. Poul Martin Møller's late turn against "the modern
      atheism" is a turn against this same speculative fashion. And Heiberg's
      slogan »Tidens Fordring«, the demand of the age, together with the promise
      that philosophy can »gaae videre«, is what Kierkegaard spends the
      pseudonymous authorship mocking, in »Forord« most directly, but also
      throughout the »Efterskrift«. Heiberg is thus the positive term that
      Sibbern, Møller and Kierkegaard are all negating, and the source from which
      the faith-and-knowledge controversy running through Nielsen and Brøchner
      ultimately flows. He is unusually well served in English: Jon Stewart has
      translated the whole philosophical corpus in the first six volumes of
      »Texts from Golden Age Denmark«, so translation here is low priority and
      the useful work is Danish transcription. Not catalogued below are the 1825
      essay on contingency and its 1827 sequel on Nemesis (Stewart's volume 4),
      the aesthetic and theatre writings (»Om Vaudevillen« 1826, »Om Theatret«),
      the astronomical-poetic yearbook »Urania« (1844–46), and the verse — above
      all »En Sjæl efter Døden« in »Nye Digte« (1841), a Hegelian satire in
      dramatic form and the most read thing he wrote.

    # SOURCING NOTE for everything below. Titles, imprints, extents, shelfmarks
    # and digitisation dates were read off the KB Alma records themselves —
    # including the raw MARC via soeg.kb.dk/discovery/sourceRecord — not from
    # secondary bibliographies. The `e-mat` PDF URLs are the MARC 856 $u values
    # of the current records. Two consequences worth keeping in view: the
    # speculative-logic book is »Grundtræk«, NOT »Grundlinier« (the latter is
    # the title of a different, German, 1824 work on aesthetics), and KB's
    # digitisation of the 1824 Kiel first printing resolves to a Google Books
    # scan rather than to a KB file.
    works:

      - id: menneskelige-frihed
        title: "Om den menneskelige Frihed. I Anledning af de nyeste Stridigheder over denne Gjenstand"
        year: "1824"
        venue: "Kiel: i Universitets-Boghandlingen; 104 pp."
        note: >
          Heiberg's first philosophical publication and, by common consent, the
          first Hegelian work in Danish. Written in Kiel, where he lectured on
          Danish language and literature 1822–25, and published in the year of
          his meeting with Hegel in Berlin. It is an intervention in the
          »Howitz-fejde«, the dispute over freedom of the will touched off by
          the physician F.G. Howitz's determinism and answered by A.S. Ørsted,
          J.P. Mynster and P. Hjort: Heiberg's move is to argue that the
          opposition between freedom and necessity dissolves at the standpoint
          of the absolute — the pattern of every argument he would make for the
          next twenty years. The 1824 Kiel first printing is available complete
          and in full view: KB's own online record for it (digitisation project
          funded by Cand.pharm. Povl M. Assens Fond) carries no KB file but
          points, in its MARC 856, at the Google Books scan linked below —
          Fraktur throughout, 104 pp., title page reading »Af Dr. J. L.
          Heiberg«. Also reprinted in »Prosaiske Skrifter« vol. 1 (Schubothe)
          and as the opening item of Bd. 1 of the 1861–62 Reitzel set. Note
          provisional: written from the title page, the KB record and the
          standard bibliographies, not from a reading of the text.
        sections:
          - title: "Complete work (1824 first printing, 104 pp.)"
            status: to-do
            links:
              - label: "Scan, 1824 first printing (Google Books)"
                url: "https://books.google.com/books?id=9agPAAAAYAAJ&printsec=frontcover"
              - label: "KB Scan (record for the 1824 printing)"
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122708119205763"
              - label: "Scan, reprint in »Prosaiske Skrifter« vol. 1 (Google Books)"
                url: "https://books.google.com/books?id=UVRTAAAAYAAJ"
              - label: "Translation (Stewart, Texts from Golden Age Denmark 1, 2005)"
                url: "https://www.jonstewart.dk/goldenagetexts.html"

      - id: grundtraek
        title: "Grundtræk til Philosophiens Philosophie eller den speculative Logik. Som Ledetraad ved Forelæsninger paa den kongelige militaire Høiskole"
        year: "1832"
        venue: "Kjøbenhavn: Andreas Seidelin; 126, [2] pp."
        note: >
          Heiberg's most extensive work on logic, written as a textbook for his
          students at the Royal Military College (den kongelige militaire
          Høiskole). NB the title: it is »Grundtræk«, not »Grundlinier« — the
          latter belongs to a quite different, German, 1824 piece on aesthetics
          (»Grundlinien zum Systeme der Aesthetik«, re-edited by Klaus
          Müller-Wille in 2022), and the two are easy to confuse. KB's record
          also identifies this printing as a revised setting of an earlier
          »Ledetraad ved Forelæsningerne over Philosophiens Philosophie eller
          den speculative Logik ved den kongelige militaire Høiskole«
          (1831–32), of which KB holds a copy at Fil. 54495 4°; a transcription
          should say which of the two it follows and ideally collate them. The
          book follows Hegel's »Wissenschaft der Logik« closely, and is the
          first of the series of Danish works on Hegel's logic that runs through
          the late 1830s and 1840s — Nielsen's and Brøchner's logical writings,
          catalogued below, are downstream of it. The themes it puts into Danish
          circulation are exactly the ones the later controversy turns on: the
          presuppositionless beginning, mediation, the law of excluded middle,
          and the relation of philosophy to religion. Digitised by KB in 2014
          from their copy 14,-112-4°, rights recorded as »Unrestricted online
          access«; the PDF is linked below and is large — 88.7 MB, so render
          pages to a temp dir rather than pulling the whole file about. Note provisional: written from the
          KB record, Stewart's introduction and the standard bibliographies,
          not from a reading of the text.
