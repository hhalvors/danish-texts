        year: "1921"
        venue: "Bianco Lunos Bogtrykkeri, Copenhagen"
        note: >
          Høffding's late treatise on relation as a category, the companion to
          »Totalitet som Kategori« (1917) and, like it, an extended
          working-out of a point in »Den menneskelige Tanke« (1910). §3d.δ
          (pp. 72–76) takes up relativity theory directly — Neumann, Mach,
          Einstein, Langevin, Whitehead's "the percipient event" — and argues
          that Einstein's result, if it stands, is a further instance of the
          Copernican lesson that the observer's own standpoint must enter the
          account, and no threat to the unity of truth. Published in
          Filosofiske Meddelelser I, 3.
