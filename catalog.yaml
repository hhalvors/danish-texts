  - id: nielsen
    name: "Rasmus Nielsen"
    dates: "1809–1884"
    bio: >
      Professor of philosophy at Copenhagen 1841–1884. Developed the central position
      of the mid-century debate: that faith and knowledge spring from absolutely
      heterogeneous principles. Target of both Brøchner's philosophical critique and
      Brandes's cultural polemic.
    works:

      - id: speculative-methode
        title: "Den speculative Methodes Anvendelse paa den hellige Historie"
        year: "1842"
        venue: "H.C. Klein, Copenhagen"
        note: >
          Danish version, made by B. C. Bøggild, of Nielsen's 1840 Latin
          dissertation »De speculativa historiae sacrae tractandae methodo«.
          Body printed pp. 1–162, Fraktur. The earliest statement of the
          speculative programme he would spend the 1850s and 1860s dismantling
          from within — and, read against the later books, the clearest measure
          of how far he moved. Two Deele: the first on the relation of
          philosophy to history in general (§§ 1–10), the second on sacred
          history itself (§§ 11–23), running from Catholicism through Luther and
          the symbolic books to criticism, subjective and objective rationalism,
          and finally Strauß's panlogism, with a Slutning at p. 161. The §§ run
          continuously across both Parts.
          Bøggild's translator's preface sets the book against H. L. Martensen's
          »Den menneskelige Selvbevidstheds Autonomie« and refers the reader to
          the review in »Fædrelandet« Nr. 329 (1840); it is dated Kjøbenhavn,
          24 January 1842. NB the KB scan transcribed here is missing a whole
          leaf of that preface — the surviving page begins mid-sentence — so the
          preface stands as the fragment it is, and the colour KB digitisation
          has still to be checked for the missing leaf.
          The printed Indhold and the printed § heads disagree in six places
          (§§ 3, 7, 10, 13, 15, 21 — e.g. the Indhold's »Den speculative
          Methode« against the head's »Den videnskabelige Methode« at p. 36);
          both readings are recorded in the transcription and neither is
          normalised away. All twelve of the book's own Trykfeil are applied and
          flagged at their sites.
        sections:
          - title: "Complete work (162 pp.)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/nielsen/speculative-methode/transcription.pdf"
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122823517205763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/110208016515-color.pdf"

      - id: propaedeutiske-logik
        title: "Den propædeutiske Logik"
        year: "1845"
        venue: "P.G. Philipsen, Copenhagen"
        note: >
          283 pp. of Fraktur prose. Nielsen's pre-Kierkegaardian logic textbook,
          superseded by the »Philosophisk Propædeutik« of 1857. Useful as the
          baseline against which to measure what the encounter with Kierkegaard
          changed. Structure: Indledning (I. Den formelle og speculative Logik;
          II. Den propædeutiske Logiks Formaal); Første Deel, Læren om det
          subjective Begreb (§§ 1–11, in three Capitler on the subjective
          concept's formation, its expression in the judgment, and its validity
          in inference and proof); anden Deel, Læren om det objective Begreb
          (§§ 12–21, ending in Idee og Gud). The §§ run continuously 1–21 across
          both Parts. No footnotes and no figures; the »Anm.« remarks do the work
          footnotes would do. Polytonic Greek and Latin, French and English
          phrases set in antiqua against the Fraktur; heavy quotation of Kant,
          Fichte, Hegel and Heiberg. Danish transcription COMPLETE —
          image-verified verbatim, the whole book, printed pp. 1–283; 205-page
          LaTeX PDF, compiles clean. Diplomatic throughout: the printer's
          unmatched quotation marks, wrong sorts, blind stops and letterspacing
          lapses are transcribed as printed and logged at their sites, while the
          nine corrections of the book's own »Rettelser« page are applied and
          flagged; both readings are recorded wherever the body heads and the
          Indhold disagree — including the lowercase »anden Deel:« of p. 97
          against the Indhold's »Anden Deel.«
        sections:
          - title: "Complete work (printed pp. 1–283)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/nielsen/propaedeutiske-logik/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/nielsen/propaedeutiske-logik/translation.pdf"
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122369529005763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/11140801806D.pdf"

      - id: evangelietroen-bevidsthed
        title: "Evangelietroen og den moderne Bevidsthed: Forelæsninger over Jesu Liv"
        year: "1849"
        venue: "C.A. Reitzel, Copenhagen"
        note: >
          Published 19 May 1849, five months before the »Johannes Climacus«
          review. X + 530 pp.; the title page marks it "Deel 1", but no further
          part appeared. Lectures on the life of Jesus in which Nielsen first
          works out publicly how evangelical faith is to stand toward modern
          historical-critical consciousness — the book that began his
          appropriation of Kierkegaard and that disappointed Kierkegaard
          himself. Danish transcription IN PROGRESS: the front matter, the whole
          of the Første Afsnit, and the Andet Afsnit as far as printed p. 391 are
          image-verified verbatim — 391 of 530 pages. Fraktur throughout, with
          three distinct emphases: the letterspacing, the antiqua set against the
          Fraktur, and a bold Fraktur reserved for scripture and for refrains
          such as „Varslerne komme og svinde“. The same verse is often set one
          way on one page and another on the next, and each occurrence is
          transcribed as that page sets it. Diplomatic: the compositor's turned
          sorts, wrong sorts and unclosed speeches are transcribed as printed and
          logged at their sites — including the running r-for-x fault that makes
          Text, Exeget and Reflexion come out Tert, Ereget and Reflerion through
          much of the second Afsnit. The book's own »Rettelser« page proves
          unreliable: of the seven sites so far reached, two direct corrections
          this copy had already received and one directs an ungrammatical
          reading, so the copy appears not to be the state the errata leaf was
          written against; each is recorded at its site. Where the printed
          chapter heads and the Indhold disagree in punctuation, both readings
          are kept.
        sections:
          - title: "Første Afsnit: Det Nye Testamentes For-Evangelium (printed pp. 1–183)"
            status: in-progress
            links:
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122131868405763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/11030800268B.pdf"
          - title: "Andet Afsnit: Den hellige Historie (printed pp. 184–530)"
            status: in-progress
            links: []

      - id: johannesclimacos
        title: "Mag. S. Kierkegaards \"Johannes Climacus\" og Dr. H. Martensens \"Christelige Dogmatik\""
        year: "1849"
        venue: "C.A. Reitzel, Copenhagen"
        note: >
          Published 15 October 1849, a few months after Martensen's »Christelige
          Dogmatik«. Nielsen's public response to Kierkegaard's »Afsluttende
          uvidenskabelig Efterskrift« (1846): he reads Climacus against Martensen
          to argue that the latter's dogmatics fails "i dens Princip som i dens
          Problem". The pamphlet that opened the Danish faith/knowledge
          controversy — and that broke Kierkegaard's confidence in Nielsen.
          Printed pp. 3–132, Fraktur, continuous review-essay in two halves,
          hinged at p. 42: the first reads the »Efterskrift« („Har ikke
          »Johannes Climacus« dialektisk skjærpet det christelige Problem?"),
          the second Martensen's dogmatics („Har ikke »den christelige
          Dogmatik« udialektisk omgaaet det christelige Problem?"). Articulated
          by these display questions and by lettered sub-heads rather than
          numbered sections. Danish transcription COMPLETE: the whole book,
          printed pp. 3–132, image-verified page by page against the Google
          Books scan (77-page LaTeX PDF; requires libertinus + libertinust1math
          + textalpha for the polytonic Greek). English translation COMPLETE:
          full pp. 3–132, 86-page LaTeX PDF, sandbox-verified 0 errors.
        sections:
          - title: "Complete work (pp. 3–132) — transcription"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/nielsen/johannesclimacos/transcription.pdf"
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99121946955905763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/11030800899B.pdf"
          - title: "Complete work (pp. 3–132) — translation"
            status: complete
            links:
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/nielsen/johannesclimacos/translation.pdf"

      - id: evangelietroen-theologien
        title: "Evangelietroen og Theologien: Tolv Forelæsninger, holdte ved Universitetet i Kjøbenhavn i Vinteren 1849–50"
        year: "1850"
        venue: "C.A. Reitzel, Copenhagen"
        note: >
          VIII + 174 pp. Twelve lectures delivered in the winter immediately
          after the »Johannes Climacus« review, and the most compact statement
          of the position for which Nielsen became the central figure of the
          mid-century debate: that faith and knowledge rest on absolutely
          heterogeneous principles, so that theology may not be made a science
          on the model of the other sciences, and yet nothing in scientific
          knowing need be surrendered. Transcription complete (Forord, all
