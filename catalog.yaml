  - id: martensen
    name: "Hans Lassen Martensen"
    dates: "1808–1884"
    bio: >
      Theologian: Privatdocent and from 1840 professor of theology at
      Copenhagen, court preacher from 1845, and Mynster's successor as Bishop
      of Zealand from 1854. Usually classified as a theologian rather than a
      philosopher, but a necessary part of this catalog's story, because he is
      the man both Kierkegaard and Nielsen wrote against. His lectures on
      speculative dogmatics from the late 1830s made Hegelian theology the
      reigning fashion in Copenhagen — the mediation of faith and knowledge,
      and the ambition to »gaae videre«, to go further than Descartes' doubt
      and Hegel's system — and it is these commonplaces that Kierkegaard's
      unfinished »Johannes Climacus eller De omnibus dubitandum est« and the
      polemic against speculation in the »Efterskrift« (1846) satirise: the
      Climacus pseudonym is aimed at a Martensenian target. When the
      »Christelige Dogmatik« finally appeared in 1849, Nielsen's
      »undersøgende Anmeldelse« of it (the »johannesclimacos« entry below)
      opened the faith/knowledge controversy that runs through this catalog
      from Nielsen to Brøchner to Høffding; Martensen answered once, in the
      »Dogmatiske Oplysninger« (1850), and thereafter left the defence to
      others (whence Nielsen's »scharling-apologie« pamphlet). And it was
      Martensen who triggered the last act of Kierkegaard's authorship: his
      February 1854 memorial sermon placed Mynster as »et tjenende Led« in
      »den hellige Kjæde af Sandhedsvidner« — compressed by Kierkegaard into
      the »Sandhedsvidne« charge of his Fædrelandet attack (December 1854)
      and the »Øieblikket« campaign of 1855. Only the four
      controversy documents are catalogued below; the larger corpus —
      »Mester Eckart« (1840), »Grundrids til Moralphilosophiens System«
      (1841), »Den christelige Daab« (1843), »Den christelige Ethik«
      (1871–78), the memoirs »Af mit Levnet« (1882–83) — is left for later.
    works:

      - id: selvbevidstheds-autonomie
        title: "Den menneskelige Selvbevidstheds Autonomie i vor Tids dogmatiske Theologie (De autonomia conscientiae sui humanae)"
        year: "1837; Danish transl. 1841"
        venue: "Kjøbenhavn; Latin original 1837, Danish transl. L. V. Petersen 1841"
        note: >
          The licentiate dissertation, and the programmatic document of Danish
          speculative theology: against the autonomy of human
          self-consciousness in modern dogmatics — the principle Martensen
          finds running from Descartes through rationalism to Kant and
          Schleiermacher — and for a theonomous dogmatics in which
          self-consciousness knows itself only in dependence on God. The
          young Kierkegaard read it closely, and its picture of modern
          philosophy as beginning in doubt is part of what »Johannes
          Climacus eller De omnibus dubitandum est« mocks. The 1841 Danish
          translation exists as a Wikisource transcription, so the
          transcription task here would be collation against the page images
          rather than keying from scratch. Note provisional: written from
          the title pages and the standard bibliographies, not from a
          reading of the text.
        sections:
          - title: "Complete work (Danish transl., 1841)"
            status: to-do
            links:
              - label: Wikisource
                url: "https://da.wikisource.org/wiki/Den_menneskelige_Selvbevidstheds_Autonomie_i_vor_Tids_dogmatiske_Theologie"
              - label: "Scan (Google Books)"
                url: "https://books.google.com/books?id=GrQHAAAAQAAJ"

      - id: christelige-dogmatik
        title: "Den christelige Dogmatik"
        year: "1849"
        venue: "Kjøbenhavn: C.A. Reitzel"
        note: >
          The system itself, and the centre of the mid-century controversy:
          the long-promised dogmatics in which faith and knowledge are
          mediated and theology made speculative science. Nielsen's »Mag. S.
          Kierkegaards "Johannes Climacus" og Dr. H. Martensens "Christelige
          Dogmatik"« (October 1849, transcribed complete under Nielsen below)
          reads Climacus against it to argue that it fails »i dens Princip
          som i dens Problem«; everything in the Nielsen–Brøchner debate
          radiates from this book. Widely translated: German 1850, English as
          »Christian Dogmatics« (trans. William Urwick, Edinburgh: T. & T.
          Clark, 1866), so an English version already exists and translation
          here has low priority. NB the KB digitisation is the *fourth*
          printing (4. Oplag, Reitzel, 491 pp.; the record's dates point to
          1883), not the 1849 first — the Google Books scan carries the
          first printing, so any transcription should collate the two and
          state which printing it follows. Note provisional: written from
          the title pages and the standard bibliographies, not from a
          reading of the text.
        sections:
          - title: "Complete work"
            status: to-do
            links:
              - label: "Scan, 1st printing (Google Books)"
                url: "https://books.google.com/books?id=uSpAAAAAcAAJ"
              - label: "KB Scan (4. Oplag)"
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122518479005763"
              - label: "PDF (4. Oplag)"
                url: "https://www.kb.dk/e-mat/dod/11030800880D.pdf"
              - label: "Translation (Urwick 1866; 1898 printing, archive.org)"
                url: "https://archive.org/details/christiandogmati00martuoft"

      - id: dogmatiske-oplysninger
        title: "Dogmatiske Oplysninger. Et Leilighedsskrift"
        year: "1850"
        venue: "Kjøbenhavn: C.A. Reitzel"
        note: >
          Martensen's one direct reply to the critics of the »Dogmatik« —
          above all to Nielsen's »undersøgende Anmeldelse« — after which he
          withdrew from the controversy and left the defence to C.E.
          Scharling and others. The KB digitisation is the 2. Oplag (also
          1850; 104 pp., Reitzel). The other half of the exchange is under
          Nielsen: he answered with »Dr. H. Martensens dogmatiske
          Oplysninger belyste« (75 pp., Reitzel 1850; digitised at KB and
          linked below since it is listed in Nielsen's bibliography but not
          yet curated there) and with the »scharling-apologie« pamphlet.
          Note provisional: written from the title pages and the standard
          bibliographies, not from a reading of the text.
        sections:
          - title: "Complete work (104 pp., 2. Oplag)"
            status: to-do
            links:
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122662137705763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/110308008969.pdf"
              - label: "KB Scan, Nielsen's counter-reply"
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122403235005763"
              - label: "PDF, Nielsen's counter-reply"
                url: "https://www.kb.dk/e-mat/dod/110308009069.pdf"

      - id: mynster-praediken
        title: "Prædiken holdt i Christiansborg Slotskirke paa 5te Søndag efter Hellig Tre Konger, Søndagen før Biskop Dr. Mynsters Jordefærd"
        year: "1854"
        venue: "Kjøbenhavn: C. A. Reitzels Bo og Arvinger (Bianco Luno), 1854; reprinted in »Leilighedstaler« (1884)"
        note: >
          The memorial sermon of 5 February 1854, on Hebr. 13, 7–8. 16
          printed pp. What Martensen actually says (pp. 5–6): »Efterligner de
          sande Veilederes, de rette Sandhedsvidners Tro!«, and of Mynster
          that »I denne hellige Kjæde af Sandhedsvidner var ogsaa vor
          hedengangne Lærer et tjenende Led« — the sermon nowhere flatly
          calls Mynster »et Sandhedsvidne«; that compression is Kierkegaard's,
          in the title of his delayed reply »Var Biskop Mynster et
          'Sandhedsvidne', et af 'de rette Sandhedsvidner' — er dette
          Sandhed?« (Fædrelandet, 18 December 1854; Martensen answered in
          Berlingske Tidende on the 28th), which began the church struggle
          and »Øieblikket«. A few pages, but the single most consequential
          document Martensen published for the Kierkegaard story — and short
          enough that transcription plus translation is an afternoon's work.
          KB holds two separate digitisations of the same 1854 printing; the
          first is linked below, the second is under record alma99122386251405763
          (e-mat 130020344319). Kierkegaard's article is in SKS at the KB
          tekstportal, linked below.
        sections:
          - title: "Complete sermon (16 pp.)"
            status: to-do
            links:
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122885028805763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/11060802902C.pdf"
              - label: "Kierkegaard's reply (SKS, KB tekstportal)"
                url: "https://tekster.kb.dk/text/sks-bms-txt-root"

