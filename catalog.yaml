      - id: philosophiens-betydning
        title: "Om Philosophiens Betydning for den nuværende Tid. Et Indbydelses-Skrift til en Række af philosophiske Forelæsninger"
        year: "1833"
        venue: "Kjøbenhavn: C.A. Reitzel; 55 pp."
        note: >
          The manifesto of Danish Hegelianism, and the most consequential thing
          Heiberg wrote as a philosopher: an invitation to a lecture series,
          which turns into a diagnosis of the age as one of relativism and
          dissolution — art, religion and scholarship all having lost their
          ground — and a prescription that thinkers take refuge in speculative
          philosophy, which alone can restore truth and beauty to their places.
          Its claims about the standing of religion drew fire from Copenhagen's
          theologians, Mynster among them, and Heiberg answered; Stewart's
          volume collects the whole exchange. 55 printed pages, which makes it
          the obvious first transcription for this author. Digitised twice over
          and available in full both ways: a Google Books scan, and KB's own
          2022 digitisation of their copy 14,-22 8°, rights recorded as
          »Unrestricted online access«, whose colour PDF (13.1 MB) is linked
          below. Note
          provisional: written from the title page, the KB record, Stewart's
          introduction and the standard bibliographies, not from a reading of
          the text.
        sections:
          - title: "Complete work (55 pp.)"
            status: to-do
            links:
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99124073540605763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/130001760921-color.pdf"
              - label: "Scan (Google Books)"
                url: "https://books.google.com/books?id=KWtZAAAAcAAJ"
