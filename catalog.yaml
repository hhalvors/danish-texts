  - id: bohr
    name: "Niels Bohr"
    dates: "1885–1962"
    bio: >
      Niels Henrik David Bohr — physicist, and the figure toward whom this whole
      collection points. His 1913 quantum model of the atom and the principle of
      complementarity (Como, 1927) reshaped physics; the 1922 Nobel Prize
      recognized the former. But Bohr was also a philosopher of knowledge in the
      Danish tradition gathered here: raised in the circle around Harald Høffding
      — his father's friend and his own philosophical mentor — and a lifelong
      reader of Poul Martin Møller's »En dansk Students Eventyr«, whose
      licentiate, dizzy with the self that thinks about itself, Bohr loved to
      quote. From quantum theory he drew what he called an "epistemological
      lesson": that the conditions of observation enter irreducibly into what is
      observed, so that subject and object cannot be cleanly separated — the theme
      this catalog traces back through Høffding, Sibbern, Treschow and beyond.
      The collection's capstone is an edition of his philosophical writings in
      eight volumes — the four Danish »Filosofiske Skrifter« and the four English
      »Philosophical Writings« — listed separately below, since for the
      supplementary volume the Danish and English are independent selections
      rather than translations of one another. Its distinguishing feature is dual
      marginal pagination: each essay carries the page numbers of its original
      printing in a journal, congress volume or Festschrift alongside those of the
      collected volume scholars usually cite, so a passage can be located either
      way. Every piece links to its first printing, by DOI where one exists.

    # ------------------------------------------------------------------
    # PHILOSOPHICAL WRITINGS — eight volumes, listed separately by language
    # because they are separate books: four Danish (Philosophia 2013) and four
    # English (Ox Bow Press). For volumes I-III the two run parallel; for
    # volume IV they are INDEPENDENT SELECTIONS sharing only nine papers, so
    # pairing them would misinform a reader. Each volume lists its full contents,
    # and each piece links to our text and to the original printing.
    #
    # The distinguishing feature of the edition is DUAL MARGINAL PAGINATION:
    # [n] in the left margin for the ORIGINAL publication, |n| in the right for
    # the COLLECTED volume, so a passage can be cited either way. Page ranges in
    # the section titles below are the collected volume's, read off the printed
    # contents pages.
    #
    # Links per piece: our transcription or translation, then the original
    # article (DOI, or a stable JSTOR URL where no DOI exists), then the Niels
    # Bohr Collected Works chapter, which reproduces nearly everything Bohr
    # published and so covers the Danish-venue pieces that have no DOI.
    #
    # NOTE ON RIGHTS: unlike everything else in this catalog, these texts are
    # NOT public domain. Bohr died in 1962, and the Danish edition (Philosophia
    # 2013) and English edition (Ox Bow Press) are both in copyright.
    # Permission to publish has been obtained; the sections below are live.
    # Do not extend this to further Bohr material without checking that the
    # permission covers it.
    # ------------------------------------------------------------------
    works:

      - id: bind-1-da
        title: "Filosofiske Skrifter I: Atomteori og naturbeskrivelse"
        year: "1929 / 2013"
        venue: "Forlaget Philosophia, København 2013"
        note: >
