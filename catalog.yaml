  - id: fibiger
    name: "Mathilde Fibiger"
    dates: "1830–1872"
    bio: >
      Born in Copenhagen, the daughter of an army officer, Mathilde Fibiger was
      teaching on an estate near Sakskøbing, not yet twenty, when she wrote the
      twelve letters that Heiberg brought out, under the pseudonym he suggested
      and with his preface, as »Clara Raphael« (1850, title page 1851). The
      letters demand for women an emancipation of the spirit rather than of
      material circumstance, on idealist ground that owes much to Poul Martin
      Møller. The book set off the Clara Raphael feud of 1851, a public debate on
      the position of women conducted in eleven pamphlets and more than
      twenty-five newspaper and journal articles, with Goldschmidt among the
      opponents and Grundtvig, Pauline Worm and Athalia Schwartz among those who
      took her side. Her own reply, »Et Besøg« (1851), retreats from the ideal of
      renunciation the first book had drawn. She wrote »En Skizze efter det
      virkelige Liv« (1853) and »Minona« (1854), and from 1863 until her death
      worked as a telegraphist in the Danish state telegraph service.
    works:

      - id: clara-raphael
        title: "Clara Raphael. Tolv Breve"
        year: "1851"
        venue: "Copenhagen: C.A. Reitzel; with a preface by J.L. Heiberg"
        note: >
          Twelve letters, eleven of them from Clara to her friend Mathilde,
          published in December 1850. A modern critical text
          (ed. Lise Busk-Jensen, 1994), including Heiberg's preface, is on the
          Royal Danish Library's text portal; no first-edition scan has yet been
          located for this collection.
        sections:
          - title: "Complete work"
            status: to-do
            links:
              - label: "KB tekstportal (1994 ed.)"
                url: "https://tekster.kb.dk/text/adl-texts-fibiger01-root"
              - label: "Grundtvig's review (Danskeren, 1851)"
