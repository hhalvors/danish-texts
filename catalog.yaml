      - id: logik-og-psychologie
        title: "Logik og Psychologie"
        year: "1867"
        venue: "Gyldendal, Copenhagen"
        note: >
          Lecture course for 1867–68 (VI + 482 pp.): the logic set out as the
          common ground of all the sciences, then worked down through plant,
          animal and human life to the relation of soul and body, closing with
          Herbart's mathematical psychology. It is printed under the signature
          title »Grundideernes Logik«, with a heading apparatus the book never
          continues — signs that the course was conceived as an installment of
          the 1864 volume. The KB digitizations are not the volume but the
          »Omtrykte Blade« (reprinted leaves) for 1867–68 and 1871–72.
        sections:
