    # Secondary literature on Nielsen (distinct from the primary `works` and
    # the `bibliography` above).
    secondary-literature:

      - id: roenning-fire-fynske-1898
        author: "F. Rønning"
        title: "Rasmus Nielsen"
        year: "1898"
        venue: >
          In Rønning, Fire fynske Bøndersønner: Literaturhistoriske
          Levnedsskildringer (Nyerup, Rask, N. M. Petersen, Rasmus Nielsen).
          København: Udvalget for Folkeoplysnings Fremme, i Kommission hos
          G. E. C. Gad, 1898. Chapter 4, pp. 159–196, with portrait.
        note: >
          A popular life published fourteen years after Nielsen's death,
          from his Funen childhood through his university career and public
          lectures. Its central pages trace his relation to Martensen and
          Kierkegaard: his early agreement that faith is a paradox, and his
          revision of it to »Troen er et Mysterium«, above reason but not
          against it, with faith and science as separate realms.
        sections:
          - title: "Chapter 4, »Rasmus Nielsen« (pp. 159–196)"
            status: complete
            links:
              - label: "PDF (chapter begins at PDF p. 160)"
                url: "https://slaegtsbibliotek.dk/909891.pdf#page=160"

      - id: rosenberg-nordens-filosof-1903
        author: "P. A. Rosenberg"
        title: "Rasmus Nielsen: Nordens Filosof. En almenfattelig Fremstilling"
        year: "1903"
        venue: "København: K. Schønberg, 1903. 247 pp., portrait"
        note: >
          The only book-length treatment of Nielsen: Rosenberg's popular
          (»almenfattelig«) exposition of the whole philosophy, published
          nineteen years after Nielsen's death. It is the fullest secondary
          source on the doctrine of the »uensartede Principer«, and so the
          companion to the Nielsen–Brøchner debate. Scanned complete at
          HathiTrust.
        sections:
          - title: "Complete volume (247 pp.)"
            status: to-do
            links:
              - label: HathiTrust
                url: "https://babel.hathitrust.org/cgi/pt?id=hvd.ah6pia"
              - label: "HathiTrust (catalog record)"
                url: "https://catalog.hathitrust.org/Record/100434803"
              - label: "SAGA Egmont e-book, epub, 2021 (WilliamDam.dk, paid)"
                url: "https://www.williamdam.dk/rasmus-nielsen-nordens-filosof-en-almenfattelig-fremstilling__2066033"

      - id: klein-rosenberg-mindeskrift-1909
        author: "V. Klein & P. A. Rosenberg"
        title: "Mindeskrift over Rasmus Nielsen, udgivet paa Hundredaarsdagen efter hans Fødsel"
        year: "1909"
        venue: >
          København: Det Schønbergske Forlag (Ernst Bierberg & Michael H.
          Jensen), 1909; contents run to p. 111. Frontispiece portrait after
          H. W. Bissen.
        note: >
          Memorial volume for the centenary of Nielsen's birth, in three
          parts: Klein's firsthand reminiscences of Nielsen as a private man
          and of his circle; Rosenberg's short popular exposition of the
          philosophy, centered on »de uensartede Principers Problem«; and
          Klein's assessment of its bearing on culture, freedom and the
          national questions. Scanned complete at Slægtsforskernes Bibliotek.
        sections:
          - title: "Complete volume"
            status: complete
            links:
              - label: PDF
                url: "https://slaegtsbibliotek.dk/920452.pdf"

      - id: asmussen-entwicklungsgang-1911
        author: "Eduard Asmussen"
        title: "Entwicklungsgang und Grundprobleme der Philosophie Rasmus Nielsens"
        year: "1911"
        venue: "Flensburg: A. Westphalen, 1911. 109 pp. (doctoral dissertation)"
        note: >
          The only academic monograph on Nielsen and the only treatment of him
          in German, a doctoral dissertation printed at Flensburg; Asmussen
          died in the First World War, and the book went essentially uncited
          until it resurfaced in the literature on Kierkegaard's influence.
          Its index shows sustained engagement with Kierkegaard and Climacus,
          Glauben und Wissen, ideelle Kausalität, and — unusually for the
          older literature — the mathematical apparatus of »Grundideernes
          Logik«. Not publicly digitized.
        sections:
          - title: "Complete dissertation (109 pp.) — paper copy held; scan to make the first public digitisation"
            status: to-do
            links:
              - label: Google Books (snippet only)
                url: "https://books.google.com/books?id=B6kUAQAAIAAJ"
              - label: WorldCat
                url: "http://worldcat.org/oclc/1015077845"

  - id: kierkegaard
    name: "Søren Kierkegaard"
    dates: "1813–1855"
    bio: >
      The essential upstream figure for the entire Nielsen–Brøchner–Høffding debate.
      This collection includes only passages most directly relevant to that debate;
      complete texts are available through the Royal Danish Library and in the
      Princeton University Press Kierkegaard's Writings series.
