      - id: vor-naturerkjendelse
        title: "Vor Naturerkjendelse: Bidrag til en Mathematikens og Fysikens Theori"
        year: "1883 (prize awarded 1882)"
        venue: "Andr. Fred. Høst & Søns Forlag, Copenhagen; awarded the Royal Danish Academy's gold medal"
        note: >
          Kroman's main philosophical work, and the one that made his name
          abroad. It separates the formal sciences, a priori and concerned
          with objects we create by definition, from the real sciences,
          empirical and never beyond approximation and probability; resting
          the certainty of the formal sciences on necessity of intuition, it
          rejects the non-Euclidean geometries as contentless — the premise
          that drives his attack on relativity thirty-two years later. The
          Danish printing is not digitized; R. v. Fischer-Benzon's German
          translation, »Unsere Naturerkenntnis« (1883), is on the Internet
          Archive.
