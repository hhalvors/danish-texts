  - id: moller
    name: "Poul Martin Møller"
    dates: "1794–1838"
    bio: >
      Poet, philosopher, and Professor of Philosophy at Copenhagen 1831–1838.
      The most important philosophical figure in the generation immediately preceding
      Kierkegaard; the Concept of Anxiety is dedicated to his memory. A digital
      scholarly edition of Møller's collected writings — with textual-critical
      apparatus and commentary — is in preparation at Det Danske Sprog- og
      Litteraturselskab (DSL) and available in prototype at http://pmm.dsl.dk; the
      transcriptions below are independent of it.
