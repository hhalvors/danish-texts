  - id: brochner
    name: "Hans Brøchner"
    dates: "1820–1875"
    bio: >
      Professor of philosophy at Copenhagen 1857–1875. Post-Hegelian, moved
      toward a naturalistic humanism under the influence of Feuerbach and
      Strauss. With Rasmus Nielsen he is one of the two men who carried
      Kierkegaard into the Danish university in the decade after 1855: the
      authorship reached the next generation largely as these two professors
      taught and disputed it — Nielsen annexing it to his dualism of faith and
      knowledge, Brøchner reading it as a psychological and ethical achievement
      whose theology he rejected. He was also its first serious expositor. »Om
      Søren Kierkegaards Virksomhed som religieus Forfatter« appeared in
      Fædrelandet three weeks after the death, and the »Erindringer« of 1871–72
      remain a primary source for the man. The exchange with Nielsen in 1868
      (»Problemet om Tro og Viden« and the »Svar«) is accordingly a quarrel
      between two custodians of the same inheritance, not an attack from
      outside it. What he transmitted he transmitted mainly by teaching:
      Brandes and Høffding both sat in his lecture room, and Høffding credited
      Brøchner's lectures as the direct cause of his own conversion away from
      Nielsen's position.
    works:

      - id: bemaerkninger-daaben
        title: "Nogle Bemærkninger om Daaben, foranledigede ved Professor Martensens Skrift: »Den christelige Daab«"
        year: "1843"
        venue: "P. G. Philipsen, Copenhagen"
        note: >
          Brøchner's first publication, written at twenty-three against
          Martensen's »Den christelige Daab« of the same year. The pamphlet
          denies infant baptism its sacramental force and cost him the
          theological career: it is the reason he took the philosophical
          magister degree instead.
        sections:
          - title: "Complete work (61 pp.)"
            status: to-do
            links:
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122889915205763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/11030801723D.pdf"

      - id: jodiske-folk
        title: "Om det jødiske Folks Tilstand i den persiske Periode"
        year: "1845"
        venue: "Bianco Lunos Bogtrykkeri, Copenhagen"
        note: >
          The magister dissertation, »skrevet for den philosophiske
          Magistergrad« — the degree Brøchner took after the baptism pamphlet
          closed the theological path to him. Historical-critical rather than
          philosophical, it is the earliest sustained piece of his writing and
          the start of the Straussian line the later work follows.
        sections:
          - title: "Complete work (97 pp.)"
            status: to-do
            links:
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122349279605763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/110208012504.pdf"

      - id: kierkegaard-virksomhed
        title: "Om Søren Kierkegaards Virksomhed som religieus Forfatter"
        year: "1855"
        venue: "Fædrelandet, 1 December 1855"
        note: >
          Brøchner's first comprehensive account of Kierkegaard's authorship,
