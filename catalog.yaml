      - id: om-vitalisme
        title: "Om Vitalisme"
        year: "1898"
        venue: "In Mindre Arbejder (1899), pp. 40–50"
        note: >
          A lecture to the Biological Society, 27 January 1898, taking the
          alternation of mechanism and vitalism through the history of biology
          and arguing that the neo-vitalism of Bunge, Haeckel and Verworn
          differs so far from the classical doctrine that the name should be
          dropped: where the old vitalism took "vital force" for a finished
          explanation, the new one means by it an x, an unresolved remainder.
          The closing pages generalize the point into the opposition between
          the rational and the empirical, the "kinks and knots in the thread"
          that recur wherever quality and individuality resist rational
          continuity. Høffding refers back to it in Filosofiske Problemer
          (note 6) and in Den menneskelige Tanke.
        sections:
