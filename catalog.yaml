      - id: udvalgte-stykker
        title: "Udvalgte Stykker af dansk filosofisk Litteratur"
        year: "1910"
        venue: "Gyldendal, Copenhagen (Mindesmærker af Danmarks Nationallitteratur, III)"
        note: >
          Høffding's anthology of Danish philosophy, with his own introductions —
          the companion volume to »Danske Filosoffer« (1909) and the vehicle by
          which nineteenth-century Danish philosophy was transmitted to the next
          generation. Section IV, »Den psykologiske Skole (Treschow, Sibbern,
          Howitz)«, is of particular interest for the line running toward Bohr.
          Work here is selective: the aim is the *transmission document* —
          Høffding's editorial framing and the shape of his selection — rather
          than a re-transcription of excerpts whose originals are already in this
          catalog. Two findings worth recording. (1) Høffding heads the excerpt
          from the 1810 essay with a title of his own, »Det Individuelles
          Uudtømmelighed«, and prints only pp. 225–230 and 235–241 of the
          original, **cutting pp. 231–234 and 242–254 silently** — so what reached
          his readers was the epistemology of the limits of general concepts, not
          the identity-system, and not the thesis (p. 247) that the concept of
          singular things has objective validity. (2) The second excerpt,
          »Udviklingslære«, carries no source in the anthology; it is verified
          here as coming from »Elementer til Historiens Philosophie« (1811).
        sections:
          - title: "Section IV: Høffding's introduction to Treschow (§ 1) and »Udviklingslære« (pp. 99, 108–113)"
            status: in-progress
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/hoeffding/udvalgte-stykker/transcription.pdf"
              - label: Translation
