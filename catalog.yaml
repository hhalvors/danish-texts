# Danish Philosophical Texts — Catalog
#
# This file is the source of truth for the danish-texts page on hanshalvorson.com.
# It is intended to live in ~/danish-texts/catalog.yaml and be symlinked here:
#   ln -s ~/danish-texts/catalog.yaml ~/hhalvors.github.io/data/danish-texts.yaml
#
# Status values: complete | in-progress | skeleton | to-do | coming-soon | placeholder
#
# Link labels (suggested conventions):
#   Transcription, Translation, Scan, KB Scan, Wikisource,
#   Runeberg, JSTOR, Journal, PDF
#
# ON THE WORD "DANISH": Denmark and Norway were one state until 1814, so
# Holberg (b. Bergen) and Treschow (b. Drammen) belong to both traditions and
# the modern national claims are anachronistic for their lifetimes. The
# reader-facing version of this note is the second paragraph of the page
# preamble — NOT in this file, but hardcoded in the site generator:
#   ~/hhalvors.github.io/DanishTexts.hs, generateDanishTextsHTML (class
#   "dt-intro dt-note"), styled by .dt-note in css/style.css.
# Edit it there, not here, or the two will drift apart.

authors:

  - id: holberg
    name: "Ludvig Holberg"
    dates: "1684–1754"
    bio: >
      Bergen-born, Copenhagen-based playwright, historian, essayist and
      professor — the founder of modern Danish-Norwegian literature and, for
      Høffding, the founder of independent philosophical reflection in Denmark:
      »Danske Filosofer« (1909) opens with him. Holberg is no system-builder but
      a skeptic and empiricist in the Montaigne–Bayle vein, hostile to dogma and
      speculative systems, insisting that "man må først lære at tvivle førend man
      må lære at tro" (one must first learn to doubt before one can learn to
      believe). His relevance to the line running toward Bohr's "epistemological
      lesson" is one of disposition rather than doctrine: epistemic humility, the
      testing of received norms against sound reason, and — especially in »Niels
      Klim« — a sustained play with the relativity of standpoint, the recognition
      that how things appear depends on the observer's position. This
      anti-dogmatic, perspective-conscious temper is the seedbed of the critical
      Danish tradition that Høffding inherits and transmits. Further works not
      listed below include »Introduction til Naturens og Folke-Rettens Kundskab«
      (1716), the »Moralske Fabler« (1751), and the Latin autobiographical
      epistles (1728–1743).
    works:

      - id: moralske-tanker
        title: "Moralske Tanker"
        year: "1744"
        venue: "Kjøbenhavn"
        note: >
          Holberg's central philosophical work: a collection of reflective
          essays, framed as commentaries on his own epigrams, on morality,
          religion, knowledge and doubt. The clearest statement of his
          anti-systematic skepticism and the "doubt before belief" method that
          Høffding takes as the starting point of Danish philosophy.
        sections:
          - title: "Complete work"
            status: to-do
            links: []

      - id: epistler
        title: "Epistler"
        year: "1748–1754"
        venue: "Kjøbenhavn, 5 vols."
        note: >
          Over 500 essayistic letters, the mature continuation of the »Moralske
          Tanker«: doubt, tolerance, the relativity of custom, and the limits of
          human knowledge, handled case by case rather than as a system.
        sections:
          - title: "Complete work (vols. I–V)"
            status: to-do
            links: []

      - id: niels-klim
        title: "Niels Klims underjordiske Rejse (Nicolai Klimii iter subterraneum)"
        year: "1741"
        venue: "Latin original, Copenhagen/Leipzig; Danish transl. J. Baggesen 1789"
        note: >
          Satirical-philosophical subterranean voyage in Latin. Its device — a
          traveler judging human institutions from wholly other standpoints, and
          being judged in turn — is a sustained exercise in the relativity of
          viewpoint and religious/intellectual tolerance: the "epistemological
          lesson" theme (how things appear depends on the observer's position) in
          a literary key.
        sections:
          - title: "Complete work"
            status: to-do
            links: []

  - id: treschow
    name: "Niels Treschow"
    dates: "1751–1833"
    bio: >
      Norwegian-born philosopher; professor of philosophy at Copenhagen
      1803–1813, then the first professor of philosophy at the new Frederik
      University in Christiania (Oslo) from 1813. A Spinoza- and
      Leibniz-influenced monist and self-described Neoplatonist whose late
      "Identitets-system" treats the mental and the bodily — and, more broadly,
      the ideal and the real, subject and object — as two sides of one reality.
      His insistence that "in the real world only individuals exist" (universals
      being mere "Hjælpemidler til Oversyn," aids to survey, not knowledge of
      things in themselves) makes him an early source of the emphasis on
      concrete individuality that runs through nineteenth-century Danish
      philosophy. The relevance to the Bohr line is direct: Harald Høffding —
      Bohr's philosophical mentor, and himself in this catalog — discussed
      Treschow at length in »Danske Filosofer« (1909) and reprinted his essay on
      individuality in »Udvalgte Stykker af dansk filosofisk Litteratur« (1910).
      Treschow is thus the earliest figure on the Danish subject–object /
      individuality tradition that reaches Bohr's "epistemological lesson."
      The philosophical books are all listed below. Further items not
      catalogued here are the pre-1794 juvenilia and occasional pieces (»Om
      Veltalenheds Nytte« 1776, »Om offentlig Underviisning i Videnskaber«
      1785, the 1790 dissertation »De anthropomorphismo«), the 1807
      »Anatomisk-physiologiske Forelæsninger for Anthropologer«, the 1816 prize
      essay on rights and moral law, the 1817 »Politisk Catechismus«, and the
      1830 verse »Skabelsen, Mennesket og Messias«. All are digitised and
      public-domain at nb.no.
    works:

      - id: forsog-guds-tilvaerelse
        title: "Forsøg om Guds Tilværelse af theoretiske Grunde: i Anledning af den kantiske Philosophie"
        year: "1794"
        venue: "Kjøbenhavn"
        note: >
          The earlier of Treschow's two early critiques of Kant (1794, 1798),
          written directly »i Anledning af den kantiske Philosophie«: a defence
          of theoretical grounds for God's existence against Kant's verdict that
          the speculative proofs fail and that God can be reached only through
          practical reason. His earliest published engagement with critical
          philosophy and the starting point of the trajectory that leads to the
          monist »Identitets-system« of the 1831–33 »Testament«.
        sections:
          - title: "Complete work (121 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/2c0dd7daeac482c15d1c687f1fa2da73"

      - id: forelaesninger-kantiske
        title: "Forelæsninger over den Kantiske Philosophie"
        year: "1798"
        venue: "Kjøbenhavn: Gyldendals Forlag"
        note: >
          The later of the two early critiques of Kant, four years after the
          »Forsøg om Guds Tilværelse« and on a much larger scale (361 printed
          pp.): a course of lectures expounding and assessing the critical
          philosophy as a whole rather than contesting a single doctrine. A
          German version, »Vorlesungen über die Kantische Philosophie. Erster
          Theil« (421 pp.), appeared the same year and is separately digitised;
          worth establishing whether it is a translation of this volume or an
          independent recasting, and whether a second German part ever
          followed. Together with the 1794 »Forsøg« this is the record of what
          Treschow took from Kant and what he refused, and so the baseline
          against which the monism of the 1805 »Philosophiske Forsøg« should be
          read. Note provisional: written from the title pages and the standard
          bibliographies, not from a reading of the text.
        sections:
          - title: "Complete work (361 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/6361c914e2d828cea9b021ad3c7ec77d"
              - label: "Scan, German version (nb.no)"
                url: "https://www.nb.no/items/dfb9359282ef7fbd2b581d7334617705"

      - id: kort-udkast-mennesket
        title: "Kort Udkast til Kundskab om Mennesket, eller Anthropologie til Brug for de lærde Skoler"
        year: "1803"
        venue: "Kjøbenhavn: Fr. Brummers Forlag, hos Sebastian Popp"
        note: >
          A school textbook of anthropology, written for the »lærde Skoler« in
          the year Treschow took the Copenhagen chair. It is the direct
          predecessor of the 1812 »Om den menneskelige Natur«, which is
          described in this catalog as the first psychology written in Danish;
          the interest of the 1803 book is therefore what the doctrine of the
          twofold — bodily and mental — access to the human being looked like
          nine years earlier, and in a form pitched at schoolboys. Named in the
          Brekke bibliography below as one of the pedagogical works this catalog
          had not yet reached. A German version, »Kurzer Entwurf zu einer Lehre
          von der Kenntniss des Menschen, oder Anthropologie« (323 pp.),
          appeared the same year. Note provisional: written from the title pages
          and the standard bibliographies, not from a reading of the text.
        sections:
          - title: "Complete work (315 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/b7196714b9d6a21bd004a7474ade3d86"
              - label: "Scan, German version (nb.no)"
                url: "https://www.nb.no/items/6d9b126674095652f347efadb020f820"

      - id: indledning-hele-philosophie
        title: "Indledning til den hele Philosophie og de vigtigste Lærebygninger af samme"
        year: "1805"
        venue: "Kjøbenhavn: Fr. Brummers Forlag, hos Z. Breum"
        note: >
          A survey introduction to philosophy as a whole and to its principal
          systems (»Lærebygninger«), issued by the same publisher in the same
          year as the »Philosophiske Forsøg« and evidently its companion: the
          historical and doctrinal frame within which the identity-system sketch
          was meant to be placed. It anticipates the 1811 »Om Philosophiens
          Natur og Dele«, which redoes the same task at greater length. Note
          provisional: written from the title page and the standard
          bibliographies, not from a reading of the text.
        sections:
          - title: "Complete work (226 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/0c5d1d0a7e5b3e9c66cae41bd7b56421"

      - id: philosophiske-forsog
        title: "Philosophiske Forsøg"
        year: "1805"
        venue: "Kjøbenhavn"
        note: >
          The first sketch of the identity-system later expanded in the 1831–33
          »Testament«. Useful as the compact early statement of his monism.
        sections:
          - title: "Complete work (409 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/7bd6a1b194386b4c61f5ae0a0a118ff9"

      - id: enslige-ting
        title: "Gives der noget Begreb eller nogen Idee om enslige Ting? Besvaret med Hensyn til Menneskeværd og Menneskevel"
        year: "1810"
        venue: "Det Kgl. Danske Videnskabernes Selskabs Skrifter, bd. 5"
        note: >
          Short, self-contained treatise arguing that only individuals are real
          and that universals are mere aids to survey, not exact knowledge of
          things in themselves. The core statement of Treschow's primacy of the
          individual — the theme most resonant with Bohr's language of the
          "individuality" (indivisibility) of the quantum phenomenon. Reprinted
          in excerpt by Høffding, »Udvalgte Stykker af dansk filosofisk
          Litteratur« (1910), and complete in A.H. Winsnes' ed. of »Philosophiske
          Forsøg og andre Skrifter« (1966). It was also issued twice on its own
          under its subtitle as »Menneskeværd og Menneskevel« (Tanum 1963;
          Reitzel 1991, ed. Jørgen Juul Nielsen) — see `modern-editions` below,
          and note that the retitling is why it hides in library catalogues.
          NB: the essay is signed 1807 and
          printed in the volume published 1810; it is set in antiqua, not
          Fraktur, and uses »ö« rather than »ø« throughout. The key formulation
          is on printed p. 240: general concepts are »kun Hielpemidler til
          Oversyn, ei til nöiagtig Kundskab om Tingene i sig selv«; the thesis is
          restated on p. 247: »Der gives altsaa et fast Begreb om enslige Ting.«
        sections:
          - title: "Complete treatise (pp. 223–254)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/enslige-ting/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/enslige-ting/translation.pdf"
              - label: Scan (archive.org)
                url: "https://archive.org/details/kongeligedanskev35kong/page/n233/mode/1up"
              - label: Scan (BHL)
                url: "https://www.biodiversitylibrary.org/item/182420"

      - id: moral-folk-stat
        title: "Moral for Folk og Stat"
        year: "1810"
        venue: "Kjøbenhavn: Fr. Brummers Forlag, hos J. F. Schultz"
        note: >
          Treschow's moral philosophy, published the same year as the »enslige
          Ting« essay and running to 481 printed pp. The pairing of »Folk« and
          »Stat« in the title is the point of interest here: it is the first
          place to look for how far the primacy of the individual extends from
          metaphysics into ethics and politics, which is the question Brekke
          raises (see secondary literature below) and which
          »Lovgivnings-Principier« then takes up at length. The standard
          bibliographies give the work as 1810–11 in two parts; the nb.no scan
          is a single volume, so whether it carries both parts or only the first
          needs checking against the item. Note provisional: written from the
          title page and the standard bibliographies, not from a reading of the
          text.
        sections:
          - title: "Complete work (481 pp. digitised; bibliographies give 2 parts, 1810–11)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/fc422953d5cf38b89584f2a580b19ba4"

      - id: historiens-philosophie
        title: "Elementer til Historiens Philosophie"
        year: "1811"
        venue: "Kjøbenhavn, 2 vols."
        note: >
          Treschow's developmental philosophy applied to living nature and to
          the history of the species (and of individual nations), which pass
          through childhood, youth, maturity and age. The continuity/development
          strand of the tradition — a counterpoint to the quantum discontinuity
          that Bohr's epistemology had to accommodate.
          NB the full title is »Elementer til Historiens Philosophie i
          Forelæsninger holdne Vinteren 1806-1807«. The nb.no scan is a single
          digitised volume of 411 pp.; whether it carries both printed parts or
          only the first still needs checking against the item.
        sections:
          - title: "Complete work (vols. I–II)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/169c584e1d7f73408cb7516ce36f88cc"

      - id: philosophiens-natur
        title: "Om Philosophiens Natur og Dele: en dogmatisk og historisk Indledning til denne Videnskab"
        year: "1811"
        venue: "Kjøbenhavn"
        note: >
          A metaphilosophical introduction — what philosophy is, how it divides
          into parts, and how it got that way — expanding the 1805 »Indledning
          til den hele Philosophie«. It is the natural companion to the 1813
          »Almindelig Logik«: the 1811 book says what the parts of the science
          are, the 1813 textbook works out one of them, and between them they
          should settle where Treschow thought the doctrine of individuals
          belongs in the architecture. Published the same year as the
          »Elementer til Historiens Philosophie«. Note provisional: written from
          the title page and the standard bibliographies, not from a reading of
          the text.
        sections:
          - title: "Complete work (281 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/28ee69ca2c1b6afbace777f29a197fe4"

      - id: menneskelige-natur
        title: "Om den menneskelige Natur i Almindelighed, især dens aandelige Sider"
        year: "1812"
        venue: "Kjøbenhavn"
        note: >
          The first psychology written in Danish, and the fullest statement of
          Treschow's double-aspect view. Man is not a composite of soul and body;
          the mental and the bodily are the same thing considered as an object of
          the inner and the outer sense. The programme is stated in § 2 — the
          human being »kan betragtes fra en dobbelt Side, nemlig en legemlig og
          aandelig«, with no »fælles Sands« in the middle from which both could
          be seen united — and made precise in the 2det Hovedstykke § 12 (p. 79),
          »Sandselighedens første Lov«: every bodily motion is bound to a mental
          sensation answering to it in quality and magnitude, and conversely, yet
          »Forholdet mellem begge er altsaa ikke caussalt«. A strict parallelism,
          and the 1812 anticipation of the identity system of »Om Gud«. Two
          further passages tie the book to the 1810 prize essay: p. 168, where
          individuality is itself »Tingenes uforanderlige Grundform« and »Enhver
          enslig Ting kan i denne Mening betragtes som Aftryk af en Idee, ei
          Arterne og Slægterne alene«; and p. 151, where the Linnaean system,
          horticulture and forestry classify plants by different marks yet »i alle
          tre Videnskaber kan Forstanden vise Grundighed«, the pure sciences
          aiming at Tingenes Væsen and the applied at Vigtighed for a purpose.
          Body: printed pp. 1–486, in an Indledning and four Hovedstykker
          (Forestillingsevnen, Føleevnen, Villien). Transcription of the complete
          work is under way and image-verified page by page.
        sections:
          - title: "Complete work (pp. 1–486) — pp. 1–261 transcribed"
            status: in-progress
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/menneskelige-natur/transcription.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/a82027cdd4a3b9c70976c711ad2388f1"

      - id: almindelig-logik
        title: "Almindelig Logik"
        year: "1813"
        venue: "Kjøbenhavn: Fr. Brummers Forlag"
        note: >
          His textbook of logic / theory of knowledge, the counterpart to the
          1812 psychology; develops the epistemology of the individual (concepts
          of particulars vs. general concepts). §§ 26–34 supply the machinery the
          1810 essay presupposes but never states. The key passage is § 30
          (printed p. 97): »Slægter saavelsom Arter ere deels egentlige, deels
          uegentlige eller analogiske. Hines Kiendemærker ere væsentlige og
          bestandige, disses blot tilfældige og ubestandige« — a criterion of
          naturalness for classifications. Treschow does not discard the improper
          kinds: they are »nødvendige« where no proper kind is to be had, whence
          the »kunstige Systemer«. §§ 32–34 give a theory of division (partitio
          vs. divisio, the ground of a division, and the rules that the parts
          must exhaust the whole, be mutually exclusive, and admit no leap from
          higher to lower species); and § 35 turns § 30 into a rule of method —
          take the ground of a division from things' essential and abiding
          criteria, and where none are to be had, choose those that come
          *nearest* to them, which makes naturalness graded rather than binary.
          NB § 31 denies that the highest being is a
          whole of which individuals are parts — pantheism and the emanation-
          system are said to rest on that confusion. Fraktur; uses »ø«, unlike
          the antiqua 1810 essay. 330 printed pp. in all; only §§ 26–35 are
          transcribed here — they close the First Main Part (p. 108).
        sections:
          - title: "§§ 26–35: Ordforklaringer, Beskrivelser, and the 4th Division »Om Delinger« (pp. 91–108)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/almindelig-logik/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/almindelig-logik/translation.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/198252f351aaf7a7a436b5d193fb1226"
          - title: "Remainder of the work (§§ 1–25, 36–97+)"
            status: to-do
            links: []

      - id: lovgivnings-principier
        title: "Lovgivnings-Principier"
        year: "1820–1823"
        venue: "Christiania (Chr. Grøndahl), 3 vols."
        note: >
          The political philosophy, written in the Christiania years and the
          largest thing Treschow published apart from the »Testament«: vol. I
          »Om Staten i Forhold til Religion, Sæder og Cultur« (1820, 479 pp.),
          vol. II »Om Staten i Forhold til offentlig Velstand, Næringsveie,
          Handel, Fattigvæsenet, samt Penge- og Skatte-Væsenet m.m.« (1821, 437
          pp.), vol. III »Om Staten med Hensyn til Justits- og Forsvarsvæsenet,
          Statsforfatning og Staters Forhold til hverandre« (1823, 513 pp.).
          Together with »Moral for Folk og Stat« this is where the
          primacy-of-the-individual thesis meets the state, and so where it can
          be tested against the relational, sociability-based reading of
          Treschow that Brekke defends (see secondary literature below). Note
          provisional: written from the title pages and the standard
          bibliographies, not from a reading of the text.
        sections:
          - title: "Vol. I: Religion, Sæder og Cultur (1820, 479 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/56e954f1d834a12d5ec8c0a22b141bd8"
          - title: "Vol. II: offentlig Velstand, Næringsveie, Handel, Fattigvæsenet, Penge- og Skatte-Væsenet (1821, 437 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/7de63686603a53804d5336b0af0a1cde"
          - title: "Vol. III: Justits- og Forsvarsvæsenet, Statsforfatning, Staters Forhold til hverandre (1823, 513 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/ec7a3f32ab25c5a36938f314736306a9"

      - id: philosophiske-saedelaere
        title: "Den philosophiske Sædelæres første Grunde, til Brug ved Forelæsninger"
        year: "1824"
        venue: "Christiania: Trykt hos Chr. Grøndahl"
        note: >
          The lecture textbook of moral philosophy from the Christiania chair,
          standing to »Moral for Folk og Stat« (1810) roughly as the 1813
          »Almindelig Logik« stands to the larger theoretical works: the
          doctrine reduced to first principles for teaching. Its compactness is
          the reason to read it — a textbook has to say plainly what the big
          books can leave implicit. Note provisional: written from the title
          page and the standard bibliographies, not from a reading of the text.
        sections:
          - title: "Complete work (247 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/2828e6ffc889485eea8f6b14ecd76c7a"

      - id: christendommens-aand
        title: "Christendommens Aand, eller Den evangeliske Lære: Frimodig og upartisk beskreven"
        year: "1828"
        venue: "Christiania: Trykt hos Chr. Grøndahl"
        note: >
          Treschow's book on Christianity, three years before the first volume
          of the »Testament« and evidently its theological antechamber: »Om Gud,
          Idee- og Sandseverdenen« works out the doctrine of God that this book
          approaches from the evangelical side. The subtitle's »frimodig og
          upartisk« (candid and impartial) was not received as such — the
          Christiania pastor W. A. Wexels published against it, and Treschow
          replied the same year with the 35-page »Anhang til Bogen om
          Christendommens Aand«, linked below. The exchange is the one place in
          the corpus where the identity-system had to be defended as orthodoxy.
          Note provisional: written from the title pages and the standard
          bibliographies, not from a reading of the text.
        sections:
          - title: "Complete work (287 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/355fb0b312643d317f41af10c2f30650"
          - title: "»Anhang til Bogen om Christendommens Aand«, reply to Pastor Wexels (1828, 35 pp.)"
            status: to-do
            links:
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/47b546990df719ef8e002f247dce3563"

      - id: om-gud-idee-sandseverdenen
        title: "Om Gud, Idee- og Sandseverdenen samt de førstes Aabenbarelse i den sidste. Et philosophisk Testament"
        year: "1831–1833"
        venue: "Christiania (Grøndahl), 3 vols."
        note: >
          Treschow's summa, written in retirement and prefaced with an
          autobiography; the detailed statement of his monist "Identitets-system."
          God is not the sum of things but "a real individual" that makes all
          things one; consciousness "pictures the Absolute One," standing to the
          manifold as the mind stands to its own thoughts and decisions. The
          most explicit source for the subject–object identity theme. NB: the
          third word is »Sandse-« (world of sense), not »Sandheds-«. Two spans of
          vol. I are transcribed here because they settle a problem raised by
          »Almindelig Logik« § 31, which denies that the highest being is »noget
          Heelt, som Verden, hvoraf alle Individuer ere Dele«. The answer (p. 220)
          is that the unity of the ideal world is constituted by »Vexelvirkning«
          among Ideas that do not alter one another — a relational, not a
          mereological unity — and that (p. 221) »Disse ere de Individuer, hvoraf
          Sandseverdenen bestaaer«: individuals compose the world of sense, not
          God. p. 207 gives the sharpest statement of the primacy of the
          individual anywhere in the corpus: all class-, genus- and
          species-concepts are »mere eller mindre vaklende og ubestemmelige, men
          Individuerne i sig selv saa fuldkommen bestemte«, while an individual may
          pass over into another species, genus, order or class. p. 206 marks the
          break with Plato: the Ideas are individual, not the objects of general
          concepts.
        sections:
          - title: "Vol. I, extracts: the individuality of the Ideas; unity by reciprocity (pp. 202–207, 220–221)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/om-gud/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/om-gud/translation.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/744d25724c6a9bb8c825bcc9186eaef1"
          - title: "Remainder of vols. I–III"
            status: to-do
            links:
              - label: "Scan, vol. II (nb.no)"
                url: "https://www.nb.no/items/5da969cc54d78ea86c9610599c8e396c"
              - label: "Scan, vol. III (nb.no)"
                url: "https://www.nb.no/items/7a480a1be9b53a5ccd959a1938550e7c"

    # Twentieth-century scholarly editions and reprints of the primary works
    # above. None is a source of new text; they matter for citation, for the
    # editorial apparatus they carry, and because they are what a modern reader
    # is likely to have to hand.
    modern-editions:

      - id: menneskevaerd-1963
        title: "Menneskeværd og Menneskevel"
        year: "1963"
        venue: "Oslo: Johan Grundt Tanum, 57 pp."
        note: >
          Free-standing reprint of the 1810 »Gives der noget Begreb eller nogen
          Idee om enslige Ting? Besvaret med Hensyn til Menneskeværd og
          Menneskevel« — the essay is here retitled by its subtitle, which is
          why it does not surface under the original title in library catalogues.
          Predates the Winsnes selection by three years and is the first modern
          printing of the essay in full. The National Library record gives the
          languages as Danish and Norwegian Bokmål, so the volume evidently
          carries something more than the Danish original; worth establishing
          what, since a 1963 Norwegian rendering would be a prior translation of
          the text transcribed and translated here under »enslige-ting«.
          Digitised at nb.no under the »bokhylla« licence: Norwegian IP
          addresses only.
        sections:
          - title: "Complete reprint (57 pp.) — not held"
