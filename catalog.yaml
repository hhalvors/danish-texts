      - id: prosaiske-skrifter-1861
        title: "Johan Ludvig Heibergs prosaiske Skrifter (posthumous collected edition, 11 vols.)"
        year: "1861–1862"
        venue: >
          Kjøbenhavn: C.A. Reitzel, 11 bd., ed. L.V. Petersen and Andræ; part of
          »J.L. Heibergs samlede Skrifter«
        note: >
          The standard collected prose, and the edition the secondary literature
          cites. What matters here is Bd. 1 (1861), whose contents are, in
          order: »Om den menneskelige Frihed«, »Speculativ Logik«, »Om
          Philosophiens Betydning«, and »Indlednings-Foredrag til det logiske
          Cursus« — that is, the entire philosophical core of this entry
          gathered in a single volume, which makes Bd. 1 the natural transcription
          target if a diplomatic text of the first printings is not the goal.
          Bd. 11 (1862) carries »Studier og Udkast« and the »Autobiographiske
          Fragmenter«, the latter being Heiberg's own account of meeting Hegel
