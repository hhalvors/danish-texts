  - id: colding
    name: "Ludvig August Colding"
    dates: "1815–1888"
    bio: >
      Engineer and physicist, born in Holbæk; one of the independent discoverers
      of the conservation of energy, alongside Mayer and Joule. Ørsted, a family
      friend, arranged his apprenticeship, sent him to the Polytekniske
      Læreanstalt (graduated 1841), employed him on experiments in 1839, and
      sponsored his later research through Videnskabernes Selskab. In 1843 he
      laid his theses on the imperishability of the "forces of nature" before the
      Academy; the friction experiments and the general statement followed in
      the Academy's Skrifter in 1850–51. His working life was spent as a
      Copenhagen civil engineer (inspector of roads and bridges from 1845, city
      engineer from 1857). Kragh (2009, p. 6) documents a religious motive: the
      forces of nature must be related to the spiritual in nature. He belongs
      in this catalog for his place in the Danish philosophical reception of the
      conservation principle: Rasmus Nielsen quotes the 1851 paper in a note on
      cause and force (»Philosophisk Propædeutik«, 1862, p. 166, quoting pp.
      169–170), and Høffding names Mayer, Colding and Joule in his treatment of
      causality (»Den menneskelige Tanke«, 1910, pp. 213–214). C. Christiansen's
      »Lærebog i Fysik« (1892–94) gave Colding more space than Mayer (Kragh
      2009, p. 21). English: Per F. Dahl (ed. and trans.), »Ludvig Colding and
      the Conservation of Energy Principle: Experimental and Philosophical
      Contributions« (New York: Johnson Reprint, 1972), seven papers, six newly
      translated. Further works not listed below include "Undersøgelse over
      Vanddampene og deres bevægende Kraft i Dampmaskinen" (Skrifter, 1852).
    works:

      - id: saetninger-om-kraefterne
        title: "Nogle Sætninger om Kræfterne"
        year: "1843"
        venue: >
          Presented to Videnskabernes Selskab 1843; printed 1856 as a supplement
          to the Academy's »Oversigt«
        note: >
          Colding's first statement of the principle that the forces of nature
          are imperishable and only change form. Paper I ("Theses concerning
          force") in Dahl's 1972 English edition.
        sections:
          - title: "Complete paper"
            status: to-do
            links:
              - label: "Scan (Videnskabernes Selskab)"
                url: "http://publ.royalacademy.dk/books/710/5113"
              - label: "Translation (Dahl 1972, Internet Archive loan)"
                url: "https://archive.org/details/ludvigcoldingcon0000unse"

      - id: undersoegelse-gnidning
        title: "Undersögelse om de almindelige Naturkræfter og deres gjensidige Afhængighed og isærdeleshed om den ved visse faste Legemers Gnidning udviklede Varme"
        year: "1850"
        venue: >
          Vidensk. Selsk. Skr., 5. Række, naturv. og math. Afd., 2. Bd.
          (1849–51)
        note: >
          The experimental paper: measurements of the heat developed by friction
          between solid bodies, offered as confirmation of the principle. Paper II
          in Dahl's 1972 English edition.
        sections:
          - title: "Complete paper"
            status: to-do
            links:
              - label: "Scan (Videnskabernes Selskab)"
                url: "http://publ.royalacademy.dk/books/406/2785"
              - label: "Translation (Dahl 1972, Internet Archive loan)"
                url: "https://archive.org/details/ludvigcoldingcon0000unse"

      - id: almindelige-naturkraefter
        title: "Om de almindelige Naturkræfter og deres gjensidige Afhængighed"
        year: "1851"
        venue: >
          Vidensk. Selsk. Skr., 5. Række, naturv. og math. Afd., 2. Bd.
          (1849–51), pp. 167–188 (text pp. 169–188); the Academy's site dates it
          1850, Rasmus Nielsen cites it as Kbhvn 1851
        note: >
          The general statement: forces never vanish in the corporeal but only
          undergo a change of form, reappearing "som virkende Aarsager i samme
          Störrelse, men i forandrede Former" (p. 170). The footnote to that
          sentence refers the reader to Mayer (1845) and Helmholtz (1847). Rasmus
          Nielsen quotes pp. 169–170 in »Philosophisk Propædeutik« (1862), p. 166;
          English as Paper III in Dahl 1972.
        sections:
          - title: "Complete paper"
            status: to-do
            links:
              - label: "Scan (Videnskabernes Selskab)"
                url: "http://publ.royalacademy.dk/books/406/2787"
              - label: "Translation (Dahl 1972, Internet Archive loan)"
                url: "https://archive.org/details/ludvigcoldingcon0000unse"

      - id: aandelige-livs-virksomheder
        title: "Naturvidenskabelige Betragtninger over Slægtskabet mellem det aandelige Livs Virksomheder og de almindelige Naturkræfter"
        year: "1856"
        venue: >
          Read 23 May 1856; »Oversigt over det Kongelige Danske Videnskabernes
          Selskabs Forhandlinger« 1856 (printed 1857)
        note: >
          As the title says: the kinship between the activities of mental life
          and the general forces of nature. Paper V in Dahl's 1972 English edition.
