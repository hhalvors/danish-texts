    venue: "Gyldendal, Copenhagen; 5 vols., ~2068 pp."
    note: >
      The standard history of Danish philosophy, from the Middle Ages to the
      mid-twentieth century — the essential reference work for the field. Carl
      Henrik Koch is the principal author (sole author of vols. 3–5, co-author of
      vol. 2); the medievalist Sten Ebbesen wrote vol. 1 and co-authored vol. 2.
      Secondary literature, and far too long to translate; listed here because
      any scholar of Danish philosophy needs to know it.
    volumes:
      - "Bind 1 — Sten Ebbesen, »Dansk middelalderfilosofi ca. 1170–1536« (2002)"
      - "Bind 2 — Sten Ebbesen & Carl Henrik Koch, »Dansk filosofi i renæssancen 1537–1700« (2003)"
      - "Bind 3 — Carl Henrik Koch, »Dansk oplysningsfilosofi 1700–1800« (2003)"
      - "Bind 4 — Carl Henrik Koch, »Den danske idealisme 1800–1880« (2004)"
      - "Bind 5 — Carl Henrik Koch, »Dansk filosofi i positivismens tidsalder 1880–1950« (2004)"
