      - id: natur-og-aand
        title: "Natur og Aand: Bidrag til en med Physiken stemmende Naturphilosophie"
        year: "1873"
        venue: "J. H. Schubothe, Copenhagen"
        note: >
          Nielsen's philosophy of nature, and his longest book in this
          collection (xiv + 549 pp.): a Naturphilosophie that agrees with
          physics rather than legislating to it. Three parts — mechanical,
          elementary and organic nature — run from space and time through
          celestial mechanics and the elements to life, death and the claim
          that all natural reality is »Aandsvirkelighed, Virkelighed for
          Aanden«. The book contains real mathematics: 83 pages carry it, and
          a footnote to p. 160 derives Kepler's laws from Newton's principles
          in polar coordinates.
        sections:
          - title: "Complete work (xiv + 549 pp.)"
            status: complete
            links:
