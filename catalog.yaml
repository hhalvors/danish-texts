      - id: kristelige-humane
        title: "Det Kristelige og det Humane som Modsætninger i vor Tids Bevidsthed"
        year: "1871"
        venue: "Nyt dansk Maanedsskrift, 2. Bind (April–September 1871)"
        note: >
          Three installments (July–September) published under the pseudonym
          »Constans«, and the journal counterpart to »Om det Religiøse i dets
          Enhed med det Humane« (1869). Christianity, as the highest and
          closing form of positive religion, is set against the free human
          consciousness and the two are held irreconcilable, with Kierkegaard
          as the classic Danish statement of the first side. Dansk Biografisk
          Leksikon calls the piece a critique of Martensen's »Den christelige
          Ethik«, but Martensen is named only once, in a single dismissive
          paragraph on p. 451.
        sections:
          - title: "Complete article, three installments (pp. 289–299, 433–456, 492–510)"
            status: complete
            links:
