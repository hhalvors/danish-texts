  - id: martensen
    name: "Hans Lassen Martensen"
    dates: "1808–1884"
    bio: >
      Theologian: Privatdocent and from 1840 professor of theology at
      Copenhagen, court preacher from 1845, and Mynster's successor as Bishop
      of Zealand from 1854. Usually classified as a theologian rather than a
      philosopher, but a necessary part of this catalog's story, because he is
      the man both Kierkegaard and Nielsen wrote against. His lectures on
      speculative dogmatics from the late 1830s made Hegelian theology the
      reigning fashion in Copenhagen — the mediation of faith and knowledge,
      and the ambition to »gaae videre«, to go further than Descartes' doubt
      and Hegel's system — and it is these commonplaces that Kierkegaard's
      unfinished »Johannes Climacus eller De omnibus dubitandum est« and the
      polemic against speculation in the »Efterskrift« (1846) satirise: the
      Climacus pseudonym is aimed at a Martensenian target. When the
      »Christelige Dogmatik« finally appeared in 1849, Nielsen's
      »undersøgende Anmeldelse« of it (the »johannesclimacos« entry below)
      opened the faith/knowledge controversy that runs through this catalog
      from Nielsen to Brøchner to Høffding; Martensen answered once, in the
      »Dogmatiske Oplysninger« (1850), and thereafter left the defence to
      others (whence Nielsen's »scharling-apologie« pamphlet). And it was
      Martensen who triggered the last act of Kierkegaard's authorship: his
      February 1854 memorial sermon placed Mynster as »et tjenende Led« in
      »den hellige Kjæde af Sandhedsvidner« — compressed by Kierkegaard into
      the »Sandhedsvidne« charge of his Fædrelandet attack (December 1854)
      and the »Øieblikket« campaign of 1855. Only the four
      controversy documents are catalogued below; the larger corpus —
      »Mester Eckart« (1840), »Grundrids til Moralphilosophiens System«
      (1841), »Den christelige Daab« (1843), »Den christelige Ethik«
      (1871–78), the memoirs »Af mit Levnet« (1882–83) — is left for later.
    works:

      - id: selvbevidstheds-autonomie
        title: "Den menneskelige Selvbevidstheds Autonomie i vor Tids dogmatiske Theologie (De autonomia conscientiae sui humanae)"
        year: "1837; Danish transl. 1841"
        venue: "Kjøbenhavn; Latin original 1837, Danish transl. L. V. Petersen 1841"
        note: >
          The licentiate dissertation and the programmatic document of Danish
          speculative theology: against the autonomy of self-consciousness in
          modern dogmatics, which Martensen traces from Descartes through Kant
          to Schleiermacher, and for a theonomous dogmatics in which
          self-consciousness knows itself only in dependence on God. The young
          Kierkegaard read it closely, and its picture of modern philosophy as
          beginning in doubt is part of what »Johannes Climacus eller De
          omnibus dubitandum est« mocks. The 1841 Danish translation is
          transcribed at Wikisource.
        sections:
          - title: "Complete work (Danish transl., 1841)"
            status: to-do
            links:
              - label: Wikisource
                url: "https://da.wikisource.org/wiki/Den_menneskelige_Selvbevidstheds_Autonomie_i_vor_Tids_dogmatiske_Theologie"
              - label: "Scan (Google Books)"
                url: "https://books.google.com/books?id=GrQHAAAAQAAJ"
              - label: "English (Thompson & Kangas 1997)"
                url: "https://books.google.com/books?id=yFra2mmhJUIC"

      - id: mester-eckart
        title: "Mester Eckart. Et Bidrag til at oplyse Middelalderens Mystik"
        year: "1840"
        venue: "Kjøbenhavn: C.A. Reitzel"
        note: >
          Martensen's study of Eckhart and medieval German mysticism, the
          fruit of the reading in the mystics he began on his journey of
          1834–36: extracts from Eckhart's sermons and an account of »den
          mystiske Bevidsthed« after Eckhart. A German version, »Meister
