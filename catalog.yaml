    # Secondary literature on Nielsen (distinct from the primary `works` and
    # the `bibliography` above).
    secondary-literature:

      - id: rosenberg-nordens-filosof-1903
        author: "P. A. Rosenberg"
        title: "Rasmus Nielsen: Nordens Filosof. En almenfattelig Fremstilling"
        year: "1903"
        venue: "København: K. Schønberg, 1903. 247 pp., portrait"
        note: >
          The only book-length treatment of Nielsen — Rosenberg's popular
          (»almenfattelig«) exposition of the whole philosophy, published
          nineteen years after Nielsen's death and quoted on the opening page
          of the 1909 »Mindeskrift« below, whose Part II is in effect
          Rosenberg's own précis of this book. The fullest secondary source on
          the doctrine of the uensartede Principer and so the natural
          companion to the Nielsen–Brøchner debate materials catalogued above.
          Unlike the rest of the secondary literature in this catalog, an
          English translation IS planned: Rosenberg died in 1935, so the text
          has been public domain in the EU since 2006 (and in the US as a
          pre-1930 publication). Scanned complete at HathiTrust (Harvard
          copy, full view). A modern epub reissue (SAGA Egmont) exists and can
          serve as a working text, but it should be collated against the 1903
          printing before anything is published from it.
        sections:
          - title: "Complete volume (247 pp.)"
            status: to-do
            links:
              - label: HathiTrust
                url: "https://babel.hathitrust.org/cgi/pt?id=hvd.ah6pia"
              - label: "HathiTrust (catalog record)"
                url: "https://catalog.hathitrust.org/Record/100434803"

      - id: klein-rosenberg-mindeskrift-1909
        author: "V. Klein & P. A. Rosenberg"
        title: "Mindeskrift over Rasmus Nielsen, udgivet paa Hundredaarsdagen efter hans Fødsel"
        year: "1909"
        venue: >
          København: Det Schønbergske Forlag (Ernst Bierberg & Michael H.
          Jensen), 1909; contents run to p. 111. Frontispiece portrait after
          H. W. Bissen.
        note: >
          Memorial volume for the centenary of Nielsen's birth (4 July 1809),
          dedicated »Til unge danske Mænd, som higer og søger« and prefaced
          with a Hostrup verse. Three parts. I, »Nielsen som Privatmand«:
          Klein's firsthand reminiscences of a man who taught him — working
          habits, the writing of »Grundideernes Logik«, his last days, and his
          circle (Sibbern, Martensen, Jacobsen, Steenstrup, Julius Thomsen,
          Høyen, Brøchner, Brandes, Gabriel Sibbern, Rudolf Schmidt) —
          biographical testimony of the same kind the Brandes »Levned« excerpt
          supplies for Brøchner. II, »Nielsen som Videnskabsmand«: Rosenberg's
          short popular exposition of the philosophy — Erkendelsesproblemet,
          Virkelighedsproblemet, and »de uensartede Principers Problem«, i.e.
          precisely the doctrine of heterogeneous principles at issue in the
          Nielsen–Brøchner debate catalogued above, plus Nielsen's relation to
          contemporary philosophy (German materialism, French positivism,
          Spencer). III, »Nielsen som Folkelærer«: Klein's personal assessment
          of the thought and its bearing on culture, freedom and the national
          questions. Rosenberg is the author of the fuller monograph »Rasmus
          Nielsen, Nordens Filosof« (1903), quoted on the volume's opening
          page — the natural companion if this proves useful. Scanned complete
          at Slægtsforskernes Bibliotek. In Danish; secondary literature, so no
          transcription or translation is planned.
        sections:
          - title: "Complete volume"
            status: complete
            links:
              - label: PDF
                url: "https://slaegtsbibliotek.dk/920452.pdf"

      - id: asmussen-entwicklungsgang-1911
        author: "Eduard Asmussen"
        title: "Entwicklungsgang und Grundprobleme der Philosophie Rasmus Nielsens"
        year: "1911"
        venue: "Flensburg: A. Westphalen, 1911. 109 pp. (doctoral dissertation)"
        note: >
          The only academic monograph on Nielsen, and the only treatment of him
          in German — a doctoral dissertation printed at Flensburg; the
          granting university still needs establishing from the title page.
          Asmussen died in the First World War, and the dissertation went
          essentially uncited until the late twentieth century, when it
          resurfaced in the literature on Kierkegaard's influence. The Google
          Books term index shows sustained engagement with exactly the strands
          this catalog cares about: Kierkegaard and Climacus, Glauben und
          Wissen, ideelle Kausalität, Subjektiv und Objektiv, and — unusually
          for the older literature — the mathematical apparatus of
          »Grundideernes Logik« (Integralrechnung, Kontinuum,
          Stoffwirksamkeit/Selbstwirksamkeit). NOT publicly digitised: Google
          scanned the University of California copy in 2009 but shows snippets
          only, and HathiTrust has no record. Asmussen's death in the war puts
          the text long out of copyright everywhere, so the paper copy held
          here could be scanned and published — which would be the first
          public digitisation. In German; secondary literature, so no
          translation is planned.
        sections:
          - title: "Complete dissertation (109 pp.) — paper copy held; scan to make the first public digitisation"
            status: to-do
            links:
              - label: Google Books (snippet only)
                url: "https://books.google.com/books?id=B6kUAQAAIAAJ"
              - label: WorldCat
                url: "http://worldcat.org/oclc/1015077845"

  - id: brochner
    name: "Hans Brøchner"
    dates: "1820–1875"
    bio: >
      Professor of philosophy at Copenhagen 1857–1875. Post-Hegelian, moved toward
      a naturalistic humanism under the influence of Feuerbach and Strauss. His
      critical engagement with Kierkegaard and Nielsen makes him a crucial third
      voice; Høffding credited Brøchner's lectures as the direct cause of his own
      conversion away from Nielsen's position.
    works:

      - id: kierkegaard-virksomhed
        title: "Om Søren Kierkegaards Virksomhed som religieus Forfatter"
        year: "1855"
        venue: "Fædrelandet, 1 December 1855"
        note: >
          Published anonymously under the mark "-r". Brøchner's first
          comprehensive account of Kierkegaard's authorship, written just
          after Kierkegaard's death. Article text reprinted in C.H. Koch
          (ed.), Brøchner og Kierkegaard (Scientia Danica, Series H,
          Humanistica 8, vol. 13).
        sections:
