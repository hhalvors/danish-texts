      - id: moralphilosophiens-system
        title: "Grundrids til Moralphilosophiens System. Udgivet til Brug ved academiske Forelæsninger"
        year: "1841"
        venue: "Kjøbenhavn: C.A. Reitzel"
        note: >
          Martensen's outline of moral philosophy for his university
          lectures, in which Kant and Fichte stand as the last significant
          proponents of systematic normative ethics and Hegel is said never
          to have given a comprehensive account of ethics as a normative
