  - id: frederiksen
    name: "Kirstine Frederiksen"
    dates: "1845–1903"
    bio: >
      Elisabeth Kirstine Frederiksen was born at Fuglsang on Lolland and came to
      formal education at thirty-three, after her family's fortune collapsed.
      She qualified in 1878 as Denmark's first woman stenographer, took her
      teaching certificate at N. Zahle's school in 1879, and taught in the
      Copenhagen schools until 1895. At the university, open to women since 1875,
      she studied philosophy under Høffding, whom she valued as a humanistically
      minded ethicist, and in 1891 the university awarded her its gold medal for
      a treatise on the general laws of education that can be derived from the
      new psychology and ethics. The treatise was never published. Her books
      carry the program into practice: education should begin from the child's
      own sensory world, and childhood is a stage of life with its own validity.
      She chaired Dansk Kvindesamfund from 1887 to 1894 and wrote on the Danish
      women's movement for English and German readers. She belongs in this
      catalog as Høffding's student, whose prize treatise brought the psychology
      and ethics he taught to bear on education.
    works:

      - id: opdragelsens-love
