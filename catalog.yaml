      - id: nyere-filosofis-historie
        title: "Den nyere Filosofis Historie"
        year: "1894–1895"
        venue: "Det Nordiske Forlag, Copenhagen; 2nd ed. 1903"
        note: >
          Høffding's two-volume history of modern philosophy, from the
          Renaissance to the late nineteenth century, in ten Books — the work
          he cites more often than any other of his own, and dedicated to the
          memory of his teacher and friend Hans Brøchner. It is the source of
          the volume-and-page references ("Den nyere Filosofis Historie I,
          p. 290") scattered through the translations here; the 1898 Kort
          Oversigt is a separate, one-volume abridgement and does not resolve
          them.

          An English translation exists and is not superseded: B. E. Meyer,
          A History of Modern Philosophy (Macmillan, 1900), 2 vols. It is,
          however, made from the German edition of 1895–96 rather than from
          the Danish, and so stands at two removes from Høffding's text, and
          renders the FIRST Danish edition. The e-book used here is the SECOND
          Danish edition (© 1903), whose revisions are concentrated in the
          notes — some thirty citations dated 1900–1903 that cannot appear in
          Meyer. No full retranslation is contemplated; the sections below are
          the parts worth doing in English on their own account.
