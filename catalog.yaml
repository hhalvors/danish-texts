        note: >
          A critique of positivism and materialism occasioned by Henry
          Maudsley's lecture on mind and body, translated in Ugeskrift for
          Læger (1870). The first part sets out Comte's positive philosophy
          and its law of three stages; the second turns to the physiologists'
          materialism and to Maudsley's account of mental illness. Høffding
          concludes that both grasp only one side of life, and so fail in
          practice as they fail in theory.
