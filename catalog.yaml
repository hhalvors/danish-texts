      - id: christelige-dogmatik
        title: "Den christelige Dogmatik"
        year: "1849"
        venue: "Kjøbenhavn: C.A. Reitzel"
        note: >
          The system itself, and the center of the mid-century controversy: a
          dogmatics in which faith and knowledge are mediated and theology
          made speculative science. Nielsen's review of October 1849,
          transcribed under Nielsen below, reads Kierkegaard's Climacus
          against it to argue that it fails »i dens Princip som i dens
          Problem«, and the Nielsen–Brøchner debate radiates from there.
          An English translation by William Urwick, »Christian Dogmatics: A
          Compendium of the Doctrines of Christianity« (Edinburgh: T. & T.
          Clark, 1866), is free online in its 1898 printing, and a German
          version appeared in 1850; the KB scan is the fourth printing
