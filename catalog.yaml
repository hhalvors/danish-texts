              - label: "Translation (Stewart, Texts from Golden Age Denmark 3, 2007)"
                url: "https://www.jonstewart.dk/goldenagetexts.html"

      - id: perseus
        title: "Perseus, Journal for den speculative Idee, Nr. 1–2"
        year: "1837–1838"
        venue: "Kjøbenhavn: C.A. Reitzel"
        note: >
          Heiberg's philosophical journal, founded in June 1837 after the
          editors of »Maanedsskrift for Litteratur« declined an article of his
          and he withdrew it in protest. Two issues only, but the landmark of
          the Danish Hegel reception: the prefatory address calls on Perseus to
          champion speculative idealism against the Medusa of realism and
          empiricism, and the second issue carries »Det logiske System«, the
          fragment of Heiberg's own system that got as far as §23 and stopped.
          The journal is the occasion of two of the most important texts in this
          catalog — Sibbern's »Bemærkninger og Undersøgelser« (1838), which
          began as an eight-part review of Nr. 1 and is transcribed complete
          under Sibbern, and Kierkegaard's »Forord« (1844), which satirises it.
          THIS IS THE ONE ITEM HERE WITH NO DIGITISATION ANYWHERE that has been
          found: a KB catalogue search restricted to electronic holdings returns
          nothing for it, and it is absent from Google Books. What KB does hold
          is physical copies: the record below carries shelfmark Fil. 13075 8°
          with »2 eks.« and holdings recorded as Nr. 1–2, 1837–1838; further
          copies sit at Den Sorte Diamant (reading-room loan, to be ordered)
          and at KU Teologi's Søren Kierkegaard Bibliotek, E 569 Per, use on
          the premises by arrangement.
          Getting this text therefore means either a reading-room visit or a
          digitisation order; it is the strongest candidate on the KB visit
          list. Note provisional: written from the KB records, Stewart's
          introduction and the standard bibliographies, not from a reading of
          the text.
        sections:
          - title: "Nr. 1–2 complete — not digitised; KB holds physical copies only"
            status: to-do
            links:
              - label: "KB Scan (record; physical holdings, Den Sorte Diamant)"
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122384575105763"
              - label: "KB record, Søren Kierkegaard Bibliotek copy"
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122230574705763"
              - label: "Translation (Stewart, Texts from Golden Age Denmark 6, 2011)"
                url: "https://www.jonstewart.dk/goldenagetexts.html"
              - label: "Sibbern's review, transcribed here"
                url: "https://hhalvors.github.io/danish-texts/texts/sibbern/bemaerkninger/transcription.pdf"

      - id: prosaiske-skrifter-1841
        title: "Prosaiske Skrifter (first collected edition)"
        year: "1841–1843"
        venue: "Kjøbenhavn: J.H. Schubothe"
        note: >
          The collected prose Heiberg himself saw through the press, and the
          working text for the »Indlednings-Foredrag« until the 1835 printing is
          digitised. Two volumes are digitised full-view at Google Books from
          the Princeton copies: vol. 1 carries »Om den menneskelige Frihed«, »Om
          Vaudevillen« and the polemic with Oehlenschläger; vol. 2 carries the
          polemic with Hauch, »Om Philosophiens Betydning for den nuværende
          Tid«, the »Indlednings-Foredrag til det logiske Cursus« and »Bidrag
          til en æsthetisk Moral«. Google dates both digitised volumes 1841;
          the set's full extent and volume structure have not been collated
          against a bibliography. Do not confuse this with the posthumous
          eleven-volume Reitzel set of 1861–62, catalogued separately below —
          the volume numbers cited in the scholarly literature are usually that
          set's, not this one's, and any transcription must say which it
          follows.
        sections:
