        year: "c. 1864–1866"
        venue: "Manuscript"
        note: "Høffding's handwritten notes from Nielsen's lectures on Grundideernes Logik."
        sections:
          - title: "Complete manuscript"
            status: coming-soon
            links: []

      - id: philosophie-og-theologie
        title: "Philosophie og Theologie: en historisk-kritisk Afhandling"
        year: "1866"
        venue: "Copenhagen"
        note: >
          Published when Høffding signed himself cand. theol., in the middle
          of the faith-and-knowledge controversy. He answers Larsen's
          "Samvittighed og Videnskab", then traces the dispute from
          scholasticism through Strauss, Martensen's Dogmatik and Johannes
          Climacus to Rasmus Nielsen, and defends the absolute heterogeneity
          of faith and knowledge.
        sections:
