  - id: thoresen
    name: "Magdalene Thoresen"
    dates: "1819–1903"
    bio: >
      Magdalene Thoresen, born Kragh in Fredericia, the daughter of a ship's
      carpenter, trained as a teacher in Copenhagen and in 1842 went to Norway as
      governess to the children of the provost Hans Conrad Thoresen, whom she
      married the following year. Their home in Bergen was a meeting place for
      the city's literary life; Bjørnson was a friend, and Ibsen married her
      stepdaughter Suzannah. Widowed, she returned to Copenhagen in the early
      1860s, where, according to Dansk Biografisk Leksikon, Rasmus Nielsen drew
      her particularly, and she lived for some years in Christiania later in the
      decade. Her literary reputation rests on the Norwegian travel and
      folk-life sketches of the 1870s and 1880s. She belongs in this catalog chiefly as a
      correspondent. Her letters to the young
      Georg Brandes (1865–99) take up the faith-and-knowledge controversy of
      1866–67 from the other side: writing from Christiania on 29 January 1867,
      she tells him she wishes a Christian philosophy well and finds his charges
      against Rasmus Nielsen and Sophus Heegaard in part absurd, in part unclear.
      Nielsen was himself among her correspondents. Jorunn Hareide has edited the
      Brandes exchange (2002) and the letters as a whole (2009).
