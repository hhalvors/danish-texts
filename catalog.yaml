# Danish Philosophical Texts — Catalog
#
# This file is the source of truth for the danish-texts page on hanshalvorson.com.
# It is intended to live in ~/danish-texts/catalog.yaml and be symlinked here:
#   ln -s ~/danish-texts/catalog.yaml ~/hhalvors.github.io/data/danish-texts.yaml
#
# Status values: complete | in-progress | skeleton | to-do | coming-soon | placeholder
#
# Link labels (suggested conventions):
#   Transcription, Translation, Scan, KB Scan, Wikisource,
#   Runeberg, JSTOR, Journal, PDF
#
# ON THE WORD "DANISH": Denmark and Norway were one state until 1814, so
# Holberg (b. Bergen) and Treschow (b. Drammen) belong to both traditions and
# the modern national claims are anachronistic for their lifetimes. The
# reader-facing version of this note is the second paragraph of the page
# preamble — NOT in this file, but hardcoded in the site generator:
#   ~/hhalvors.github.io/DanishTexts.hs, generateDanishTextsHTML (class
#   "dt-intro dt-note"), styled by .dt-note in css/style.css.
# Edit it there, not here, or the two will drift apart.

authors:

  - id: holberg
    name: "Ludvig Holberg"
    dates: "1684–1754"
    bio: >
      Bergen-born, Copenhagen-based playwright, historian, essayist and
      professor — the founder of modern Danish-Norwegian literature and, for
      Høffding, the founder of independent philosophical reflection in Denmark:
      »Danske Filosofer« (1909) opens with him. Holberg is no system-builder but
      a skeptic and empiricist in the Montaigne–Bayle vein, hostile to dogma and
      speculative systems, insisting that "man må først lære at tvivle førend man
      må lære at tro" (one must first learn to doubt before one can learn to
      believe). His relevance to the line running toward Bohr's "epistemological
      lesson" is one of disposition rather than doctrine: epistemic humility, the
      testing of received norms against sound reason, and — especially in »Niels
      Klim« — a sustained play with the relativity of standpoint, the recognition
      that how things appear depends on the observer's position. This
      anti-dogmatic, perspective-conscious temper is the seedbed of the critical
      Danish tradition that Høffding inherits and transmits. Further works not
      listed below include »Introduction til Naturens og Folke-Rettens Kundskab«
      (1716), the »Moralske Fabler« (1751), and the Latin autobiographical
      epistles (1728–1743).
    works:

      - id: moralske-tanker
        title: "Moralske Tanker"
        year: "1744"
        venue: "Kjøbenhavn"
        note: >
          Holberg's central philosophical work: a collection of reflective
          essays, framed as commentaries on his own epigrams, on morality,
          religion, knowledge and doubt. The clearest statement of his
          anti-systematic skepticism and the "doubt before belief" method that
          Høffding takes as the starting point of Danish philosophy.
        sections:
          - title: "Complete work"
            status: to-do
            links: []

      - id: epistler
        title: "Epistler"
        year: "1748–1754"
        venue: "Kjøbenhavn, 5 vols."
        note: >
          Over 500 essayistic letters, the mature continuation of the »Moralske
          Tanker«: doubt, tolerance, the relativity of custom, and the limits of
          human knowledge, handled case by case rather than as a system.
        sections:
          - title: "Complete work (vols. I–V)"
            status: to-do
            links: []

      - id: niels-klim
        title: "Niels Klims underjordiske Rejse (Nicolai Klimii iter subterraneum)"
        year: "1741"
        venue: "Latin original, Copenhagen/Leipzig; Danish transl. J. Baggesen 1789"
        note: >
          Satirical-philosophical subterranean voyage in Latin. Its device — a
          traveler judging human institutions from wholly other standpoints, and
          being judged in turn — is a sustained exercise in the relativity of
          viewpoint and religious/intellectual tolerance: the "epistemological
          lesson" theme (how things appear depends on the observer's position) in
          a literary key.
        sections:
          - title: "Complete work"
            status: to-do
            links: []

  - id: treschow
    name: "Niels Treschow"
    dates: "1751–1833"
    bio: >
      Norwegian-born philosopher; professor of philosophy at Copenhagen
      1803–1813, then the first professor of philosophy at the new Frederik
      University in Christiania (Oslo) from 1813. A Spinoza- and
      Leibniz-influenced monist and self-described Neoplatonist whose late
      "Identitets-system" treats the mental and the bodily — and, more broadly,
      the ideal and the real, subject and object — as two sides of one reality.
      His insistence that "in the real world only individuals exist" (universals
      being mere "Hjælpemidler til Oversyn," aids to survey, not knowledge of
      things in themselves) makes him an early source of the emphasis on
      concrete individuality that runs through nineteenth-century Danish
      philosophy. The relevance to the Bohr line is direct: Harald Høffding —
      Bohr's philosophical mentor, and himself in this catalog — discussed
      Treschow at length in »Danske Filosofer« (1909) and reprinted his essay on
      individuality in »Udvalgte Stykker af dansk filosofisk Litteratur« (1910).
      Treschow is thus the earliest figure on the Danish subject–object /
      individuality tradition that reaches Bohr's "epistemological lesson."
      Further works not listed below include the two early critiques of Kant
      (1794, 1798), »Moral for Folk og Stat« (1810–11), »Lovgivnings-Principier«
      (1820–23), and »Christendommens Aand« (1828).
    works:

      - id: forsog-guds-tilvaerelse
        title: "Forsøg om Guds Tilværelse af theoretiske Grunde: i Anledning af den kantiske Philosophie"
        year: "1794"
        venue: "Kjøbenhavn"
        note: >
          The earlier of Treschow's two early critiques of Kant (1794, 1798),
          written directly »i Anledning af den kantiske Philosophie«: a defence
          of theoretical grounds for God's existence against Kant's verdict that
          the speculative proofs fail and that God can be reached only through
          practical reason. His earliest published engagement with critical
          philosophy and the starting point of the trajectory that leads to the
          monist »Identitets-system« of the 1831–33 »Testament«.
        sections:
          - title: "Complete work"
            status: to-do
            links: []

      - id: philosophiske-forsog
        title: "Philosophiske Forsøg"
        year: "1805"
        venue: "Kjøbenhavn"
        note: >
          The first sketch of the identity-system later expanded in the 1831–33
          »Testament«. Useful as the compact early statement of his monism.
        sections:
          - title: "Complete work"
            status: to-do
            links: []

      - id: enslige-ting
        title: "Gives der noget Begreb eller nogen Idee om enslige Ting? Besvaret med Hensyn til Menneskeværd og Menneskevel"
        year: "1810"
        venue: "Det Kgl. Danske Videnskabernes Selskabs Skrifter, bd. 5"
        note: >
          Short, self-contained treatise arguing that only individuals are real
          and that universals are mere aids to survey, not exact knowledge of
          things in themselves. The core statement of Treschow's primacy of the
          individual — the theme most resonant with Bohr's language of the
          "individuality" (indivisibility) of the quantum phenomenon. Reprinted
          in excerpt by Høffding, »Udvalgte Stykker af dansk filosofisk
          Litteratur« (1910), and complete in A.H. Winsnes' ed. of »Philosophiske
          Forsøg og andre Skrifter« (1966). It was also issued twice on its own
          under its subtitle as »Menneskeværd og Menneskevel« (Tanum 1963;
          Reitzel 1991, ed. Jørgen Juul Nielsen) — see `modern-editions` below,
          and note that the retitling is why it hides in library catalogues.
          NB: the essay is signed 1807 and
          printed in the volume published 1810; it is set in antiqua, not
          Fraktur, and uses »ö« rather than »ø« throughout. The key formulation
          is on printed p. 240: general concepts are »kun Hielpemidler til
          Oversyn, ei til nöiagtig Kundskab om Tingene i sig selv«; the thesis is
          restated on p. 247: »Der gives altsaa et fast Begreb om enslige Ting.«
        sections:
          - title: "Complete treatise (pp. 223–254)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/enslige-ting/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/enslige-ting/translation.pdf"

      - id: historiens-philosophie
        title: "Elementer til Historiens Philosophie"
        year: "1811"
        venue: "Kjøbenhavn, 2 vols."
        note: >
          Treschow's developmental philosophy applied to living nature and to
          the history of the species (and of individual nations), which pass
          through childhood, youth, maturity and age. The continuity/development
          strand of the tradition — a counterpoint to the quantum discontinuity
          that Bohr's epistemology had to accommodate.
        sections:
          - title: "Complete work (vols. I–II)"
            status: to-do
            links: []

      - id: menneskelige-natur
        title: "Om den menneskelige Natur i Almindelighed, især dens aandelige Sider"
        year: "1812"
        venue: "Kjøbenhavn"
        note: >
          The first psychology written in Danish. Anti-Cartesian: man is not a
          composite of soul and body; rather the mental and the bodily are the
          same thing considered as an object of the inner and the outer sense.
          The clearest early anticipation of the "conditions of observation"
          theme — the same reality under two irreducible modes of access. The
          programme is stated in § 2: the human being »kan betragtes fra en
          dobbelt Side, nemlig en legemlig og aandelig«, and taking either
          exclusively makes knowledge one-sided; there is no »fælles Sands« in
          the middle from which both could be seen united, so anthropology must
          be divided into the physiological and the psychological, each keeping
          the other in view. It is cashed out in §§ 8–14 (pp. 16–27), which
          reject the occasionalist and pre-established-harmony solutions, state
          the criterion (p. 20: »Det der fornemmes med den indvortes Sands, er
          altsaa Aand, Legeme hvad vi alene ved den udvortes kan fornemme«),
          argue from the limits of the two modes that the question whether
          bodies think is undecidable (§ 11), and conclude (p. 27) that
          »Mennesket er altsaa i sin individuelle Grundform og som Idee eller
          Noümen uforgængeligt« — tying the book to the Grundform of the 1810
          essay and the individual Ideas of »Om Gud«. Body: printed pp. 1–486,
          in an Indledning and four Hovedstykker (Forestillingsevnen,
          Føleevnen, Villien). Transcription of the complete work is under way;
          printed pp. 1–166 are done, image-verified and continuous — the
          Indledning, the whole 1ste Hovedstykke, and the first three Afdelinger
          of the 2det Hovedstykke with the 4de begun: the 1ste on the
          understanding and attention, the 2den on sensibility and the senses,
          the 3die on memory,
          imagination, dreams and the association of ideas. §§ 20–23 (pp. 130–140)
          are a sustained naturalistic treatment of sleepwalking, presentiment,
          prophecy and madness: each is derived from the ordinary machinery of
          association running without its usual checks, and none requires a special
          faculty. Presentiment is defined as an inference whose premises are dark
          — »Heri er Slutningen alene tydelig, ei Forsetningerne«. The 4de Afdeling,
          on the Forstand, then supplies the book's most directly relevant
          material. To understand a thing is to know »hvad Orden eller Klasse vi
          skal henføre Gienstanden til«. Importance is interest-relative but
          essence is not: »En Tings væsentlige Egenskaber ere uden Tvivl for den
          selv de vigtigste, men for andre Ting kan de tilfældige være vigtigere«
          (p. 150). Hence a domain thesis rather than a relativism — the Linnaean
          sexual system, horticulture and forestry classify plants by different
          marks, »Men i alle tre Videnskaber kan Forstanden vise Grundighed«, the
          pure sciences aiming at Tingenes Væsen and the applied at Vigtighed for
          a purpose (p. 151). And a classification can be flatly wrong: »Skæv er
          Forstanden, naar den finder Ligheder og Kontraster hvor ingen ere«
          (p. 152). Nor is the position anti-theoretical: judgement is sharpened
          by theoretical knowledge, since without principles it is lost among »saa
          mange eenslige Exempler«, and of the practitioner who applies to a new
          case the rules that worked in similar ones Treschow writes »Thi hvorvidt
          de virkelig ligne, kan Theorien alene lære« (p. 164). The 3die Afdeling
          divides the connection
          among representations into a logical kind, »blot ideal og frembragt ved
          vor egen Virksomhed eller Tænkekraft«, and a physical kind that follows
          from our passive nature and is independent of the will — only the second
          is properly Association. So the ideal/real distinction of the 1810 essay
          is put to work inside the theory of mind. §§ 4–5 (pp. 100–105) then give
          an account of what makes a concept dominant: not vividness but
          associative connectivity, the Hovedbegreb »som det herskende« occupying
          the centre of a system of impressions with the rest at the circumference,
          »hvert i sin Orden«, fastened both to it and to each other. And § 12
          (p. 116), advising on how to order knowledge, warns that one must take
          care »at ei Tildragelsernes væsentlige Forbindelse tilsidesettes for den
          tilfældige af Tid og Sted« — so an essential/accidental distinction is
          fully operative; what Treschow denies is that it picks out a privileged
          class of properties. § 18 (p. 126) makes this explicit for the
          associative laws themselves: »blandt disse Regler føre nogle til vigtige,
          skiønne og Gienstandene selv væsentlige Forbindelser; andre til uvigtige,
          heslige og uvæsentlige«, and an imagination governed by the former is
          called a higher one. The grading falls on the combining rules, not on a
          privileged class of properties. Four further passages bear on the
          natural-properties project. § 3 (pp. 61–63) argues for a common
          objective sense against the abstractionists: the understanding »vel
          bemærker Ligheden, men at disse dog for at bemærkes, nødvendig maae
          være givne« — likenesses must be given in sensation before they can be
          noticed, so objective Beskaffenheder such as Enhed, Mangfoldighed and
          Forandring are given, not selected by the intellect. § 12 (p. 79)
          states »Sandselighedens første Lov«: every bodily motion is bound to a
          mental sensation corresponding to it in both quality and magnitude, and
          vice versa — followed at once by »Forholdet mellem begge er altsaa ikke
          caussalt«. A strict parallelism with causation denied in both
          directions, and the 1812 anticipation of the identity system of »Om
          Gud«. § 16 (pp. 86–90) argues that the senses cannot deceive, since
          they draw no inferences, and then defends the subjectivity of sensation
          as a design rather than a defect: it is no business of sensibility to
          teach what things are in themselves »men hvad Forhold de staae i til os
          og vore Nødvendigheder«, and senses restricted to the Grundegenskaber
          would leave the world stripped of everything that rouses us to useful
          activity. And p. 57 turns the 1810 essay's own term of art into a
          cognitive-economy worry: the mind that fixes on »enslige Gienstande«
          becomes one-sided in judgement, since the important things cannot be
          grasped except in connection with many lesser ones.
        sections:
          - title: "Complete work (pp. 1–486) — pp. 1–166 transcribed"
            status: in-progress
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/menneskelige-natur/transcription.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/a82027cdd4a3b9c70976c711ad2388f1"

      - id: almindelig-logik
        title: "Almindelig Logik"
        year: "1813"
        venue: "Kjøbenhavn: Fr. Brummers Forlag"
        note: >
          His textbook of logic / theory of knowledge, the counterpart to the
          1812 psychology; develops the epistemology of the individual (concepts
          of particulars vs. general concepts). §§ 26–34 supply the machinery the
          1810 essay presupposes but never states. The key passage is § 30
          (printed p. 97): »Slægter saavelsom Arter ere deels egentlige, deels
          uegentlige eller analogiske. Hines Kiendemærker ere væsentlige og
          bestandige, disses blot tilfældige og ubestandige« — a criterion of
          naturalness for classifications. Treschow does not discard the improper
          kinds: they are »nødvendige« where no proper kind is to be had, whence
          the »kunstige Systemer«. §§ 32–34 give a theory of division (partitio
          vs. divisio, the ground of a division, and the rules that the parts
          must exhaust the whole, be mutually exclusive, and admit no leap from
          higher to lower species); and § 35 turns § 30 into a rule of method —
          take the ground of a division from things' essential and abiding
          criteria, and where none are to be had, choose those that come
          *nearest* to them, which makes naturalness graded rather than binary.
          NB § 31 denies that the highest being is a
          whole of which individuals are parts — pantheism and the emanation-
          system are said to rest on that confusion. Fraktur; uses »ø«, unlike
          the antiqua 1810 essay. 330 printed pp. in all; only §§ 26–35 are
          transcribed here — they close the First Main Part (p. 108).
        sections:
          - title: "§§ 26–35: Ordforklaringer, Beskrivelser, and the 4th Division »Om Delinger« (pp. 91–108)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/almindelig-logik/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/almindelig-logik/translation.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/198252f351aaf7a7a436b5d193fb1226"
          - title: "Remainder of the work (§§ 1–25, 36–97+)"
            status: to-do
            links: []

      - id: om-gud-idee-sandseverdenen
        title: "Om Gud, Idee- og Sandseverdenen samt de førstes Aabenbarelse i den sidste. Et philosophisk Testament"
        year: "1831–1833"
        venue: "Christiania (Grøndahl), 3 vols."
        note: >
          Treschow's summa, written in retirement and prefaced with an
          autobiography; the detailed statement of his monist "Identitets-system."
          God is not the sum of things but "a real individual" that makes all
          things one; consciousness "pictures the Absolute One," standing to the
          manifold as the mind stands to its own thoughts and decisions. The
          most explicit source for the subject–object identity theme. NB: the
          third word is »Sandse-« (world of sense), not »Sandheds-«. Two spans of
          vol. I are transcribed here because they settle a problem raised by
          »Almindelig Logik« § 31, which denies that the highest being is »noget
          Heelt, som Verden, hvoraf alle Individuer ere Dele«. The answer (p. 220)
          is that the unity of the ideal world is constituted by »Vexelvirkning«
          among Ideas that do not alter one another — a relational, not a
          mereological unity — and that (p. 221) »Disse ere de Individuer, hvoraf
          Sandseverdenen bestaaer«: individuals compose the world of sense, not
          God. p. 207 gives the sharpest statement of the primacy of the
          individual anywhere in the corpus: all class-, genus- and
          species-concepts are »mere eller mindre vaklende og ubestemmelige, men
          Individuerne i sig selv saa fuldkommen bestemte«, while an individual may
          pass over into another species, genus, order or class. p. 206 marks the
          break with Plato: the Ideas are individual, not the objects of general
          concepts.
        sections:
          - title: "Vol. I, extracts: the individuality of the Ideas; unity by reciprocity (pp. 202–207, 220–221)"
            status: complete
            links:
              - label: Transcription
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/om-gud/transcription.pdf"
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/treschow/om-gud/translation.pdf"
              - label: Scan (nb.no)
                url: "https://www.nb.no/items/744d25724c6a9bb8c825bcc9186eaef1"
          - title: "Remainder of vols. I–III"
            status: to-do
            links: []

    # Twentieth-century scholarly editions and reprints of the primary works
    # above. None is a source of new text; they matter for citation, for the
    # editorial apparatus they carry, and because they are what a modern reader
    # is likely to have to hand.
    modern-editions:

      - id: menneskevaerd-1963
        title: "Menneskeværd og Menneskevel"
        year: "1963"
        venue: "Oslo: Johan Grundt Tanum, 57 pp."
        note: >
          Free-standing reprint of the 1810 »Gives der noget Begreb eller nogen
          Idee om enslige Ting? Besvaret med Hensyn til Menneskeværd og
          Menneskevel« — the essay is here retitled by its subtitle, which is
          why it does not surface under the original title in library catalogues.
          Predates the Winsnes selection by three years and is the first modern
          printing of the essay in full. The National Library record gives the
          languages as Danish and Norwegian Bokmål, so the volume evidently
          carries something more than the Danish original; worth establishing
          what, since a 1963 Norwegian rendering would be a prior translation of
          the text transcribed and translated here under »enslige-ting«.
          Digitised at nb.no under the »bokhylla« licence: Norwegian IP
          addresses only.
        sections:
          - title: "Complete reprint (57 pp.) — not held"
            status: reference
            links:
              - label: nb.no (Norway-only)
                url: "https://www.nb.no/items/c33d8031a41e7830d366019a789d852c"

      - id: winsnes-1966
        editor: "A. H. Winsnes"
        title: "»Philosophiske Forsøg« og andre skrifter"
        year: "1966"
        venue: >
          Oslo: Johan Grundt Tanum, 225 pp. Series: »Norsk filosofi i det 19.
          århundre« 1 / Thorleif Dahls kulturbibliotek
        note: >
          The standard modern selection from Treschow, and the volume cited in
          the »enslige-ting« note above as the source in which the 1810 essay is
          reprinted complete. It opens the series »Norsk filosofi i det 19.
          århundre« within Thorleif Dahls kulturbibliotek — i.e. it presents
          Treschow as the first figure of a *Norwegian* nineteenth-century
          philosophy, which is the framing the note at the head of this file
          flags as diverging from Høffding's Danish one. The editor is the same
          A. H. Winsnes as the 1927 monograph »Niels Treschow. En opdrager til
          menneskelighet« and the 1956 Trondheim address listed under secondary
          literature below, so his introduction can be read against that 1956
          text. Contents need verifying against the volume: it takes its title
          from the 1805 »Philosophiske Forsøg« (listed above as
          »philosophiske-forsog«, still to-do here), so it is the most likely
          modern access point for that work as well. Digitised at nb.no under
          the »bokhylla« licence: Norwegian IP addresses only.
        sections:
          - title: "Complete volume (225 pp.) — not held"
            status: reference
            links:
              - label: nb.no (Norway-only)
                url: "https://www.nb.no/items/7a5422f7bb819a4789d2166aa632d972"

      - id: juul-nielsen-1991
        editor: "Jørgen Juul Nielsen (introduction and notes)"
        title: "Menneskeværd og menneskevel"
        year: "1991"
        venue: "København: C. A. Reitzels Forlag, 83 pp. ISBN 87-7421-728-3"
        note: >
          Danish edition of the same 1810 essay, again under its subtitle, with
          an introduction and notes by Jørgen Juul Nielsen. The only one of the
          three modern editions to carry a full modern commentary on the essay,
          and the only one published in Denmark — so it is the natural check on
          the reading of »enslige Ting« given here: whether Juul Nielsen also
          takes the primacy-of-the-individual thesis to be the essay's point,
          and whether his notes settle anything about the text's antiqua/»ö«
          orthography or the 1807 signature vs. 1810 printing. Not digitised;
          obtain a copy or consult by ILL.
        sections:
          - title: "Complete edition (83 pp.) — not held; consult against the »enslige-ting« translation"
            status: reference
            links: []

    # Secondary literature on Treschow (distinct from the primary `works` above).
    secondary-literature:

      - id: winsnes-niels-treschow
        author: "A. H. Winsnes"
        title: "Niels Treschow"
        year: "1956"
        venue: >
          Det Kongelige Norske Videnskabers Selskabs Forhandlinger, bd. 29
          (Trondheim: Aktietrykkeriet, i kommisjon hos F. Bruns Bokhandel, 1956),
          31 pp. (offprint, pp. 1*–31*)
        note: >
          Biographical portrait delivered by the literary historian Andreas
          Hofgaard Winsnes as the address on the Society's Høytidsdag (Anniversary
          Day), 26 February 1956. A concise Norwegian overview of Treschow's life
          and thought — his »philosophia perennis«, his debt to Leibniz and
          Spinoza, and the primacy-of-the-individual theme of »Gives der noget
          Begreb eller nogen Idee om enslige Ting?« It closes with a valuable
          bibliography (»Henvisninger«) of the older scholarship on Treschow,
          including Høffding's »Danske Filosofer« (1909) and »Udvalgte Stykker«
          (1910). Winsnes is the same scholar who edited »Philosophiske Forsøg og
          andre Skrifter« (1966), cited under the »enslige-ting« work above; he
          had earlier written the monograph »Niels Treschow. En opdrager til
          menneskelighet« (Oslo, 1927). In Norwegian; secondary literature, so no
          translation is planned.
        sections:
          - title: "Complete article (pp. 1*–31*)"
            status: complete
            links:
              - label: PDF
                url: "https://www.dknvs.no/wp-content/uploads/2024/07/1956-Treschow_vWinsnes1956.pdf"

      - id: stybe-danish-neoplatonist-1976
        author: "Svend Erik Stybe"
        title: "Niels Treschow (1751–1833), A Danish Neoplatonist"
        year: "1976"
        venue: "Danish Yearbook of Philosophy 13 (1), pp. 29–47"
        doi: "10.1163/24689300-01301003"
        note: >
          The one substantial treatment of Treschow in English, and therefore the
          natural point of departure for any anglophone discussion of him. Stybe
          reads him as a Neoplatonist — the label Treschow applies to himself —
          which bears directly on the »Om Gud« material: the eternal Ideas, the
          outflowing (»Udflydelse«) of both Ideas and sensible things from the
          absolutely One, and the identity-system's principle that »essentially
          the highest and the lowest things are entirely alike«. NB that
          Treschow's Neoplatonism is heterodox on exactly the point that matters
          here: his Ideas are themselves individual, not the objects of general
          concepts, and he breaks with Plato explicitly on that ground
          (»Om Gud« I, p. 206). Worth checking whether Stybe registers that
          departure, and whether he anticipates the primacy-of-the-individual
          reading. In English; secondary literature, so no translation needed.
        sections:
          - title: "Complete article (pp. 29–47)"
            status: reference
            links:
              - label: DOI
                url: "https://doi.org/10.1163/24689300-01301003"
              - label: Brill
                url: "https://brill.com/view/journals/dyp/13/1/article-p29_3.xml"

      - id: christophersen-treschow-1977
        author: "H. O. Christophersen"
        title: "Niels Treschow, 1751–1833: en tenker mellom to tidsaldrer"
        year: "1977"
        venue: "Oslo: Grøndahl, 549 pp. ISBN 82-504-0270-7"
        note: >
          The standard monograph on Treschow, and the largest single piece of
          scholarship on him — »a thinker between two ages«, i.e. straddling the
          Enlightenment and Romanticism, and equally the Danish and Norwegian
          phases of his career. It is the first thing to consult before claiming
          novelty for any reading of Treschow: anyone arguing for the
          primacy-of-the-individual thesis, or for the line running toward
          Høffding and Bohr, needs to know whether Christophersen has already
          said it. Digitised at the National Library of Norway but under the
          »bokhylla« licence, so readable only from Norwegian IP addresses;
          obtain a print copy by ILL. In Norwegian; secondary literature, so no
          transcription or translation is planned.
        sections:
          - title: "Complete monograph (549 pp.) — not held; consult before publishing"
            status: reference
            links:
              - label: nb.no (Norway-only)
                url: "https://www.nb.no/items/85cc02b7fc019240bd8c3839b2ad0f12"

      - id: lundestad-tidlige-norske-2002
        author: "Erik Lundestad"
        title: "Den tidlige norske filosofien: en lesning av Treschow, Schweigaard og Monrad"
        year: "2002"
        venue: "Universitetet i Tromsø"
        note: >
          Reads Treschow alongside A. M. Schweigaard and M. J. Monrad as the
          first phase of an independent Norwegian philosophy. Useful as a check
          on how the Norwegian tradition frames Treschow — which is a different
          framing from Høffding's Danish one, and the divergence is itself worth
          knowing about (see the note on Denmark–Norway at the head of this
          file). Digitised at the National Library of Norway under the
          »bokhylla« licence: Norwegian IP addresses only. In Norwegian;
          secondary literature, so no transcription or translation is planned.
        sections:
          - title: "Complete work — not held"
            status: reference
            links:
              - label: nb.no (Norway-only)
                url: "https://www.nb.no/search?q=Den%20tidlige%20norske%20filosofien"

      - id: brekke-dannelse-og-kjonn-2012
        author: "Tone Brekke"
        title: "«(S)aa meget bedre skikkede til … de mindste Ting»: Niels Treschow om dannelse og kjønn"
        year: "2012"
        venue: "Tidsskrift for kjønnsforskning 36 (2), pp. 99–120"
        doi: "10.18261/ISSN1891-1781-2012-02-03"
        note: >
          Treschow on Dannelse (Bildung) and gender. Brekke's case is that
          although Treschow held that women should be excluded from the
          university — importing and continuing a Continental ideal of
          Dannelse that did so — he nonetheless works out a more nuanced model
          of gender than the period's dominant one: against academia as a
          homosocial, over-rationalised and professionalised sphere, he grounds
          both individual and social Dannelse in sociability, the family, and
          feminine models of sympathy and care. Two reasons to keep it in view
          here. First, sociability is a *relational* rather than an atomistic
          way of taking the individual, so it is a test of how far the
          primacy-of-the-individual thesis in »enslige Ting« and »Om Gud«
          extends beyond metaphysics into the moral and political writings
          (»Moral for Folk og Stat«, »Lovgivnings-Principier«). Second, the
          bibliography is unusually rich on the pedagogical Treschow — Helge
          Dahl's 1965 magister thesis »Niels Treschow – en pedagogisk tenker«,
          Anathon Aall's 1911 piece on his doctrine of development, Erik
          Lundestad's 1998 article on the »Forsøg om Guds Tilværelse«, and the
          1803 »Kort Udkast til Kundskab om Mennesket« (the anthropology
          textbook that precedes the 1812 psychology) — none of which is
          catalogued here yet. Paywalled at Scandinavian University Press;
          Brekke is at ILOS, University of Oslo, so a repository copy may exist.
          In Norwegian with an English abstract; secondary literature, so no
          translation is planned.
        sections:
          - title: "Complete article (pp. 99–120)"
            status: reference
            links:
              - label: DOI
                url: "https://doi.org/10.18261/ISSN1891-1781-2012-02-03"
              - label: Scandinavian University Press
                url: "https://www.scup.com/doi/10.18261/ISSN1891-1781-2012-02-03"

  - id: orsted
    name: "Hans Christian Ørsted"
    dates: "1777–1851"
    bio: >
      Physicist, chemist and natural philosopher; professor at Copenhagen from
      1806 and founder of the Polytekniske Læreanstalt (1829). In 1820 he
      discovered electromagnetism — that an electric current deflects a magnetic
      needle — and in 1825 was the first to isolate metallic aluminium. But
      Ørsted was as much a philosopher of nature as an experimenter: a student of
      Kant and of the German Naturphilosophie, he held that the same reason the
      mind finds in itself is objectively at work in nature, so that the laws of
      thought and the laws of nature ultimately coincide. This dynamical monism —
      opposed forces as convertible expressions of one underlying activity — is
      the thesis of his late essay-collection »Aanden i Naturen« (1850), "the
      spirit (reason) in nature," and it is why he belongs in this catalog: it is
      a Danish source of the unity-of-nature theme running toward Bohr. Ørsted
      also gave physics the term »Tankeeksperiment« (thought experiment) and
      coined much of the modern Danish scientific vocabulary; Høffding treated him
      among the »Danske Filosofer«. Two English editions cover most of his
      important work: »The Soul in Nature« (trans. L. & J. B. Horner, London:
      Bohn, 1852) for the philosophy of nature, and the 83-item »Selected
      Scientific Works of Hans Christian Ørsted« (trans. Jelved, Jackson &
      Knudsen, Princeton, 1998) for the scientific and aesthetic essays — the
      source of most of the translation links below. Further works not listed
      below include »Videnskaben om Naturens almindelige Love« (1809),
      »Naturlærens mechaniske Deel« (1844), and the poem »Luftskibet« (1836).
    works:

      - id: metaphysik-naturens
        title: "Dissertatio de forma metaphysices elementaris naturae externae"
        year: "1799"
        venue: "Kjøbenhavn (doctoral dissertation, based on Kant)"
        note: >
          Ørsted's Kantian doctoral dissertation, the metaphysical foundation of
          everything that followed: nature construed through fundamental dynamical
          forces rather than inert matter. Rendered into English in the Selected
          Scientific Works as two 1799 pieces — "Fundamentals of the Metaphysics
          of Nature, Partly According to a New Plan" and "Dissertation on the
          Structure of the Elementary Metaphysics of External Nature."
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: forste-indledning-naturlaere
        title: "Første Indledning til den almindelige Naturlære"
        year: "1811"
        venue: "Kjøbenhavn"
        note: >
          Introductory lectures on the method and unity of physics — his fullest
          early statement of how the study of nature should be conceived and
          taught. English in the Selected Scientific Works as "First Introduction
          to General Physics."
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: ansicht-chemische-naturgesetze
        title: "Ansicht der chemischen Naturgesetze, durch die neueren Entdeckungen gewonnen"
        year: "1812"
        venue: "Berlin (Realschulbuchhandlung); German"
        note: >
          Ørsted's systematic statement of a dynamical chemistry — chemical
          phenomena as the play of two fundamental opposed forces — the mature
          theoretical background to the 1820 discovery. English in the Selected
          Scientific Works as "View of the Chemical Laws of Nature."
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: conflictus-electricus
        title: "Experimenta circa effectum conflictus electrici in acum magneticam"
        year: "1820"
        venue: "Hafniae [Copenhagen]; Latin pamphlet, 21 July 1820"
        note: >
          The four-page Latin announcement of the discovery of electromagnetism —
          a current-carrying wire deflects a nearby magnetic needle — the single
          most consequential thing Ørsted did and a founding document of modern
          physics. Translated into English at once as "Experiments on the Effect
          of a Current of Electricity on the Magnetic Needle" (Annals of
          Philosophy 16, 1820); also in the Selected Scientific Works.
        sections:
          - title: "Complete paper"
            status: complete
            links:
              - label: "Translation (Annals of Philosophy, 1820)"
                url: "https://erenow.org/common/history-philosophy-science-reader/54.php"
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: fysikken-og-det-skonne
        title: "Essays on light and the physics of beauty (»det Skjønnes Physik«)"
        year: "1842–1843"
        venue: "Copenhagen"
        note: >
          Ørsted's aesthetics: the attempt to ground beauty — especially the
          beauty of light and lustre — in physical law, the counterpart in art to
          his philosophy of nature and a key source for his epistemology of
          »Anskuelse« (intuition/contemplation). English in the Selected
          Scientific Works as "An Investigation of Light with Regard to the
          Physics of Beauty," its continuation, and "Development of the Theory of
          Lustre."
        sections:
          - title: "Complete essays"
            status: complete
            links:
              - label: "Translation (Selected Scientific Works, 1998)"
                url: "https://press.princeton.edu/books/hardcover/9780691635187/selected-scientific-works-of-hans-christian-orsted"

      - id: aanden-i-naturen
        title: "Aanden i Naturen"
        year: "1850"
        venue: "Kjøbenhavn (A. F. Høst), 2 vols. 1849–50"
        note: >
          Ørsted's philosophical masterwork: essays and dialogues on the
          philosophy of nature, science, reason and beauty, arguing that nature is
          the expression of an all-pervading reason. The fullest statement of his
          dynamical Naturphilosophie and his most directly philosophical book.
          Translated complete into English (from Ørsted's own German »Der Geist in
          der Natur«, 1850–51) as »The Soul in Nature, with Supplementary
          Contributions«.
        sections:
          - title: "Complete work"
            status: complete
            links:
              - label: "Translation (Horner 1852)"
                url: "https://archive.org/details/soulinnaturewit00horngoog"
              - label: Wikisource
                url: "https://en.wikisource.org/wiki/The_Soul_in_Nature"
              - label: HathiTrust
                url: "https://catalog.hathitrust.org/Record/001389004"

