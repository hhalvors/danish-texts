          - title: "»Sibberns brevroman — kimen til den danske dannelsesroman« — read online; printed volume and pages to establish"
            status: reference
            links:
              - label: "lex.dk"
                url: "https://dansklitteraturshistorie.lex.dk/Sibberns_brevroman_-_kimen_til_den_danske_dannelsesroman"

  - id: heiberg
    name: "J.L. Heiberg"
    dates: "1791–1860"
    bio: >
      Johan Ludvig Heiberg — poet, vaudeville dramatist, critic, editor, and
      from 1849 director of the Royal Theatre — made Hegel a Danish subject,
      and almost every philosophical quarrel in this catalog is one he
      started. He heard Hegel lecture in Berlin in 1824, underwent what he
      later called a philosophical conversion, and the same year published »Om
      den menneskelige Frihed«, the first Hegelian work in Danish. Until the
      early 1840s he campaigned — through his journals »Kjøbenhavns flyvende
      Post« (1827–37), »Perseus« (1837–38) and »Intelligensblade« (1842–44),
      through his logic lectures at the Royal Military College, and through a
      public lecture series — to persuade Golden Age Denmark that Hegel's
      system was the cure for an age in crisis. Martensen carried the program
      into theology and became the target of both Kierkegaard and Nielsen.
      Sibbern's »Bemærkninger og Undersøgelser, fornemmelig betreffende Hegels
      Philosophie« (1838) — transcribed and translated in full under Sibbern —
      is formally a review of the first volume of »Perseus«, and remains the
      most thorough Danish critique of Hegel ever written. Poul Martin
      Møller's late turn against "the modern atheism" is a turn against the
      same speculative fashion, and Heiberg's »Tidens Fordring« is what
      Kierkegaard spends the pseudonymous authorship mocking. Heiberg is thus
      the positive term that Sibbern, Møller and Kierkegaard are all negating,
      and the source from which the faith-and-knowledge controversy running
      through Nielsen and Brøchner ultimately flows. Jon Stewart has
      translated the whole philosophical corpus, so the useful work here is
      Danish transcription. Not listed below: the essays on contingency (1825)
      and Nemesis (1827), the theater writings, »Urania« (1844–46), and the
      verse, above all »En Sjæl efter Døden« (1841).

    # SOURCING NOTE for everything below. Titles, imprints, extents, shelfmarks
    # and digitisation dates were read off the KB Alma records themselves —
    # including the raw MARC via soeg.kb.dk/discovery/sourceRecord — not from
    # secondary bibliographies. The `e-mat` PDF URLs are the MARC 856 $u values
    # of the current records. Two consequences worth keeping in view: the
    # speculative-logic book is »Grundtræk«, NOT »Grundlinier« (the latter is
    # the title of a different, German, 1824 work on aesthetics), and KB's
    # digitisation of the 1824 Kiel first printing resolves to a Google Books
    # scan rather than to a KB file.
    works:

      - id: menneskelige-frihed
        title: "Om den menneskelige Frihed. I Anledning af de nyeste Stridigheder over denne Gjenstand"
        year: "1824"
        venue: "Kiel: i Universitets-Boghandlingen; 104 pp."
        # Working notes (not rendered). Heiberg lectured in Kiel on Danish
        # language and literature 1822–25. The Howitz-fejde: F.G. Howitz's
        # determinism, answered by A.S. Ørsted, J.P. Mynster and P. Hjort.
        # KB's own record for the 1824 Kiel printing (Povl M. Assens Fond
        # digitisation) carries no KB file; its MARC 856 points to the Google
        # Books scan linked below (Fraktur, 104 pp., title page »Af Dr. J. L.
        # Heiberg«). Also the opening item of Bd. 1 of the 1861–62 Reitzel
        # set. Note provisional: written from the title page, the KB record
        # and the standard bibliographies, not from a reading of the text.
        note: >
          Heiberg's first philosophical publication and the first Hegelian
          work in Danish, written in Kiel in the year he met Hegel. An
          intervention in the Howitz controversy over freedom of the will, it
          argues that the opposition of freedom and necessity dissolves at the
          standpoint of the absolute — the pattern of his arguments for the
          next twenty years. Reprinted in both editions of »Prosaiske
          Skrifter«.
        sections:
          - title: "Complete work (1824 first printing, 104 pp.)"
            status: to-do
            links:
              - label: "Scan, 1824 first printing (Google Books)"
                url: "https://books.google.com/books?id=9agPAAAAYAAJ&printsec=frontcover"
              - label: "KB Scan (record for the 1824 printing)"
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122708119205763"
              - label: "Scan, reprint in »Prosaiske Skrifter« vol. 1 (Google Books)"
                url: "https://books.google.com/books?id=UVRTAAAAYAAJ"
              - label: "Translation (Stewart, Texts from Golden Age Denmark 1, 2005)"
                url: "https://www.jonstewart.dk/goldenagetexts.html"

      - id: grundtraek
        title: "Grundtræk til Philosophiens Philosophie eller den speculative Logik. Som Ledetraad ved Forelæsninger paa den kongelige militaire Høiskole"
        year: "1832"
        venue: "Kjøbenhavn: Andreas Seidelin; 126, [2] pp."
        # Working notes (not rendered). NB the title is »Grundtræk«, not
        # »Grundlinier«: »Grundlinien zum Systeme der Aesthetik« is a
        # different, German, 1824 work (re-edited by Klaus Müller-Wille,
        # 2022). KB's record identifies this printing as a revised setting of
        # an earlier »Ledetraad ved Forelæsningerne over Philosophiens
        # Philosophie eller den speculative Logik ved den kongelige militaire
        # Høiskole« (1831–32), KB Fil. 54495 4°; a transcription should say
        # which it follows and ideally collate the two. Digitised by KB 2014
        # from copy 14,-112-4°, »Unrestricted online access«; the PDF is 88.7
        # MB, so render pages to a temp dir rather than pulling the whole file
        # about. Note provisional: written from the KB record, Stewart's
        # introduction and the standard bibliographies, not from a reading of
        # the text.
        note: >
          Heiberg's most extensive work on logic, a textbook for his students
          at the Royal Military College that follows Hegel's »Wissenschaft der
          Logik« closely. It opens the series of Danish works on Hegel's
          logic, Nielsen's and Brøchner's among them, and puts into
          circulation the themes the later controversy turns on: the
          presuppositionless beginning, mediation, the excluded middle, and
          the relation of philosophy to religion.
        sections:
          - title: "Complete work (126, [2] pp.)"
            status: to-do
            links:
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122493449805763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/11140400942C.pdf"
              - label: "Translation (Stewart, Texts from Golden Age Denmark 2, 2006)"
                url: "https://www.jonstewart.dk/goldenagetexts.html"

      - id: philosophiens-betydning
        title: "Om Philosophiens Betydning for den nuværende Tid. Et Indbydelses-Skrift til en Række af philosophiske Forelæsninger"
        year: "1833"
        venue: "Kjøbenhavn: C.A. Reitzel; 55 pp."
        # Working notes (not rendered). Digitised twice: the Google Books
        # scan, and KB's 2022 digitisation of copy 14,-22 8°, »Unrestricted
        # online access«, colour PDF 13.1 MB. Note provisional: written from
        # the title page, the KB record, Stewart's introduction and the
        # standard bibliographies, not from a reading of the text.
        note: >
          The manifesto of Danish Hegelianism: an invitation to a lecture
          series that diagnoses the age as one of relativism and dissolution
          and prescribes speculative philosophy as the remedy. Its claims
          about religion drew replies from Mynster and other theologians, and
          Stewart's volume collects the exchange.
        sections:
          - title: "Complete work (55 pp.)"
            status: to-do
            links:
              - label: KB Scan
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99124073540605763"
              - label: PDF
                url: "https://www.kb.dk/e-mat/dod/130001760921-color.pdf"
              - label: "Scan (Google Books)"
                url: "https://books.google.com/books?id=KWtZAAAAcAAJ"
              - label: "Scan, reprint in »Prosaiske Skrifter« vol. 2 (Google Books)"
                url: "https://books.google.com/books?id=oS5RAAAAYAAJ"
              - label: "Translation (Stewart, Texts from Golden Age Denmark 1, 2005)"
                url: "https://www.jonstewart.dk/goldenagetexts.html"

      - id: indlednings-foredrag
        title: "Indlednings-Foredrag til det i November 1834 begyndte logiske Cursus paa den kongelige militaire Høiskole"
        year: "1835"
        venue: "Kjøbenhavn: Schubothe; 42 pp., Fraktur"
        # Working notes (not rendered). Despite the title it ranges into
        # philosophy of language and a taxonomy of poetic forms. The 1835
        # separate printing is NOT digitised: KB copy 14,-105-8° (»Kan ikke
        # hjemlånes«) is flagged »Digitalisering eller læsesal«, i.e. eligible
        # for digitisation on demand — the cheapest way to get the text; see
        # KB-VISIT-TODO.md. KB catalogues the printing twice (copy record and
        # Schubothe imprint record); both linked. The »Prosaiske Skrifter«
        # vol. 2 reprint is in full view meanwhile. Note provisional: written
        # from the KB record, Stewart's introduction and the standard
        # bibliographies, not from a reading of the text.
        note: >
          The clearest statement of Heiberg's Hegelian idealism, lectured in
          1834 and printed in 1835. It ranks philosophical knowing above both
          religion and the natural sciences, and makes the appeal to »Tidens
          Fordring« that Kierkegaard would satirize in »Forord« and »Stadier
          paa Livets Vei«. Martensen's review (1836) and the replies of
          Sibbern and Nielsen open the debate on philosophy and religion from
          which the Nielsen–Brøchner controversy descends.
        sections:
          - title: "Complete work (in »Prosaiske Skrifter« vol. 2; 1835 printing not digitised)"
            status: to-do
            links:
              - label: "Scan, »Prosaiske Skrifter« vol. 2 (Google Books)"
                url: "https://books.google.com/books?id=oS5RAAAAYAAJ"
              - label: "KB Scan (1835 printing, copy 14,-105-8° — DOD candidate)"
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122013804105763"
              - label: "KB Scan (1835 printing, Schubothe record)"
                url: "https://soeg.kb.dk/permalink/45KBDK_KGL/1tg7ia/alma99122961074105763"
              - label: "Translation (Stewart, Texts from Golden Age Denmark 3, 2007)"
                url: "https://www.jonstewart.dk/goldenagetexts.html"

      - id: perseus
        title: "Perseus, Journal for den speculative Idee, Nr. 1–2"
        year: "1837–1838"
        venue: "Kjøbenhavn: C.A. Reitzel"
        # Working notes (not rendered). Founded June 1837 after the editors of
        # »Maanedsskrift for Litteratur« declined an article of Heiberg's and
        # he withdrew it in protest; the prefatory address sets Perseus
        # against the Medusa of realism and empiricism. Sibbern's review ran
        # in eight parts. No digitisation anywhere: a KB search restricted to
        # electronic holdings returns nothing, and it is absent from Google
        # Books. Physical copies: KB Fil. 13075 8° (»2 eks.«, Nr. 1–2,
        # 1837–1838); Den Sorte Diamant (reading-room loan, to be ordered); KU
        # Teologi, Søren Kierkegaard Bibliotek, E 569 Per (on the premises by
        # arrangement). Strongest candidate on the KB visit list; see
        # KB-VISIT-TODO.md. Note provisional: written from the KB records,
        # Stewart's introduction and the standard bibliographies, not from a
        # reading of the text.
        note: >
          Heiberg's philosophical journal, two issues only, and the landmark
          of the Danish Hegel reception; the second carries »Det logiske
          System«, the fragment of his own system that stopped at §23.
