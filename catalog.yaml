                url: "https://archive.org/details/ludvigcoldingcon0000unse"

      - id: history-conservation-energy
        title: "On the History of the Principle of the Conservation of Energy"
        year: "1864"
        venue: >
          The London, Edinburgh, and Dublin Philosophical Magazine and Journal of
          Science, 4th ser., vol. 27, no. 179 (January 1864), pp. 56–64; in English
