          unfinished future-society fiction of over 1000 pages, built on a
          highly undogmatic Christianity and a communism in the line of
          Saint-Simon. Minke calls it »det besynderlige, ret ulæselige«, and
          traces Sibbern's indifference to the national question and to
          constitutional reform to his hostility to private property — a
          politics belonging to a utopian future rather than to the present.
          Published in parts, 1858–72.
