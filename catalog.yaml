          On Kierkegaard's equivocal attitude to natural science: behind the
          biting sarcasm of the journals and notebooks lies a more complex
          view, set against the historical relationship between science and
          religion in Kierkegaard's day. Rosfort is Professor of Ethics and
          Philosophy of Religion at the Søren Kierkegaard Research Centre,
          Copenhagen.
