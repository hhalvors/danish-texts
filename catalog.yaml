      - id: andresen-anmeldelse
        title: "[Anmeldelse af A. D. Andresen, »Dr. Søren Kierkegaards falske Paastande« 1–2]"
        year: "1856"
        venue: "Ugeskrift for den evangeliske Kirke i Danmark 7 (1856), pp. 249–251; signed »-r.«"
        note: >
          Brøchner's review, under his usual mark »-r.«, of the first two of
          A. D. Andresen's pamphlets charging that Kierkegaard's attack on the
          Church had harmed Christianity in Denmark. He asks whether, among the
          complacent and the merely worldly-anxious alike, there are not some
          whom Kierkegaard has woken »til alvorligere Prøvelse, til Bekymring
          ogsaa for Sjælens Anliggender«. Attribution and reference from C. H.
          Koch, Fund og Forskning 47 (2008).
        sections:
          - title: "Complete review (pp. 249–251)"
            status: to-do
            links: []

      - id: oerum-anmeldelse
        title: "[Anmeldelse af J. C. M. Ørums Pjece om Sandhedsvidnestriden]"
        year: "1856"
        venue: "Fædrelandet, Nr. 298, 20 December 1856"
        note: >
          A review of J. C. M. Ørum's short pamphlet on the »Sandhedsvidne«
          controversy, mocking two theologians, H. F. Helveg and H. P.
          Kofoed-Hansen, who accepted part of Kierkegaard's critique of the
          established order without drawing its consequences: »det Halve er
          mindre end Intet«. Listed in Dansk Biografisk Leksikon; details from
          C. H. Koch, Fund og Forskning 47 (2008).
        sections:
          - title: "Complete review"
            status: to-do
            links: []

