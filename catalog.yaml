        note: >-
          Two-part essay. Article I (§§ I–VII) transcribed from Skrifter i
          Udvalg (1930); Article II (§§ VIII–XI, MfL 1837 pp. 422–453),
          omitted from that selection, transcribed from the Fraktur first
          printing in matching modernized orthography. Danish transcription
          complete; English translation by Jon Stewart (2022).
        sections:
