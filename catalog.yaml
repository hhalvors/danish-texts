        year: "1923"
        venue: "Det Kongelige Danske Videnskabernes Selskab, Filosofiske Meddelelser I, 4, Copenhagen"
        note: >
          The third of the late category studies, after »Totalitet som
          Kategori« (1917) and »Relation som Kategori« (1920), and the largest
          of them. Analogy is defined as likeness of relation — a likeness
          holding not of properties or parts but of the relations among them —
          and traced from the involuntary analogies of primitive thought and
          of childhood, through formal logic, to the analogies between the
          functions and the domains of cognition, closing on poetic and
          religious symbolism. It expands the 1905 essay that Høffding
          published in English himself, in Mind, so his own English is
          available as the terminology anchor.
