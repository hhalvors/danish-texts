      - id: grundideernes-logik-kort-begreb
        title: "Grundideernes Logik i kort Begreb"
        year: "1870"
        venue: "J. H. Schubothe, Copenhagen"
        note: >
          Nielsen's own one-volume compend of the »Grundideernes Logik«
          system (vols. I–II, 1864–66, above). The interest is threefold.
          First, coverage: the Google Books term index (»Atomerne«, »Brint«,
          »absolut Viden«, »Andethedsformer«, »formelle Logik«) shows the
          compend spans both volumes' material, including the
          natural-science Grundideer of the still-untranscribed vol. II —
          so it is the compact route to the whole mature system, and is
          planned for transcription in preference to vol. II. Second, the
          compend argument this catalog already applies to Treschow's
          »Sædelære« and »Almindelig Logik«: a short course must say
          plainly what the big books leave implicit. Third, timing: 1870 is
          two years after Brøchner's »Problemet om Tro og Viden«. The Forord
          (fol. III, five lines) settles how far that goes: no critic is
          named, but Nielsen presents the book as »en kort og klar
          Fremstilling af sin theistiske Logik«, organised around the
          »Knudepunkter, om hvilke den videnskabelige Strid mellem
          Pantheisme og Theisme væsenlig maa dreie sig« — the axis of the
          Brøchner exchange, though not a direct reply. Scanned complete at
          Google Books (British Library copy, digitised 2013), full view
          with downloadable PDF. Title as on the title page and in the
          »List of Publications« appendix (»i kort Begreb«; the GB record
          capitalises »Kort«). Extent XIV + 89 pp.: Forord (fol. III),
          Indledning (V–XIII), Indhold (XIV), body pp. 1–89 beginning
          »A. Viden«. Page map verified against the PDF text layer
          (printed = PDF − 20, uniform) and by eye at the endpoints. Danish
          transcription COMPLETE: the whole book — Forord, Indledning, body
          pp. 1–89, Indhold — image-verified page by page (0 gaps/dupes,
          quote balance 0, sandbox compile 0 errors). Diplomatic throughout:
          the printer's signature defect is the turned sort (n as u in
          »iugenlunde«, »Slutniug«, and the p. 77 display head »Saudhed«;
          m as w in »wellem«), all transcribed as printed and logged; where
          the Indhold disagrees with the body heads both readings are
          recorded (»Den logiske Theisme« vs. the p. 85 head »Logisk
          Theisme.«). Imprint from the title leaf: Forlagt af J. H.
          Schubothes Boghandel; Louis Kleins Bogtrykkeri. English
          translation COMPLETE (»The Logic of the Fundamental Ideas in
          Brief Compass«): front matter, body pp. 1–89, and Contents, all
          footnotes carried, printer's errors rendered corrected with the
          diplomatic readings noted in comments.
        sections:
