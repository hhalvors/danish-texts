  - id: bohr
    name: "Niels Bohr"
    dates: "1885–1962"
    bio: >
      Niels Henrik David Bohr — physicist, and the figure toward whom this whole
      collection points. His 1913 quantum model of the atom and the principle of
      complementarity (Como, 1927) reshaped physics; the 1922 Nobel Prize
      recognized the former. But Bohr was also a philosopher of knowledge in the
      Danish tradition gathered here: raised in the circle around Harald Høffding
      — his father's friend and his own philosophical mentor — and a lifelong
      reader of Poul Martin Møller's »En dansk Students Eventyr«, whose
      licentiate, dizzy with the self that thinks about itself, Bohr loved to
      quote. From quantum theory he drew what he called an "epistemological
      lesson": that the conditions of observation enter irreducibly into what is
      observed, so that subject and object cannot be cleanly separated — the theme
      this catalog traces back through Høffding, Sibbern, Treschow and beyond. No
      primary texts by Bohr are transcribed here yet; the section currently
      collects secondary literature on his thought.
    works: []

    # Secondary literature on Bohr (distinct from any primary `works` above).
    secondary-literature:

      - id: favrholdt-philosophical-background
        author: "David Favrholdt"
        title: "Niels Bohr's Philosophical Background"
        year: "1992"
        venue: "Historisk-filosofiske Meddelelser 63, Det Kongelige Danske Videnskabernes Selskab, Copenhagen"
        note: >
          Favrholdt's earlier, book-length study reconstructing the philosophical
          sources of Bohr's thought — the long argument later distilled in the 2009
          »Filosoffen Niels Bohr«. Written in English and freely available from the
          Royal Danish Academy, so this is a reference rather than a translation
          project.
        sections:
          - title: "Complete monograph (English original)"
            status: reference
            links:
              - label: "Royal Academy"
                url: "http://publ.royalacademy.dk/books/216/1386?lang=da"
              - label: PDF
                url: "http://publ.royalacademy.dk/backend/web/uploads/2019-07-08/AFL%201/H_63_00_00_1992_709/H_63_00_00_1992_709.pdf"

      - id: favrholdt-filosoffen-niels-bohr
        author: "David Favrholdt"
        title: "Filosoffen Niels Bohr"
        year: "2009"
        venue: "Informations Forlag, Copenhagen"
        note: >
          Favrholdt's synthesis of his lifelong study of Bohr as thinker, arguing
          that Bohr was a genuine philosopher whose insight into quantum mechanics
          yielded a modern understanding of the limits of thought imposed by our
          language and concepts. David Favrholdt (1931–2012), Dr.phil. and
          professor at the University of Southern Denmark, heard Bohr lecture as a
          student and became the leading Danish interpreter of complementarity. A
          clean modern e-book (epub) edition exists, so this is a translation-only
          project — no transcription needed.
