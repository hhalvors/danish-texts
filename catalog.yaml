        title: "Wilhelms brev: det etiske ifølge Kierkegaard"
        year: "2014"
        venue: "Gyldendal, Copenhagen; 306 pp."
        note: >
          Monograph on Kierkegaard's ethics, built around the question
          Assessor Wilhelm poses in the second part of »Enten-eller«: »Hvordan
          skulle et menneske leve sit liv?« Husted reads the ethical stance of
          the Wilhelm letters against contemporary analytic moral philosophy
