      - id: minke-sibbern-dlh
        author: "Kim Minke"
        title: "»Poesien som livsfilosofi — F.C. Sibbern« and »Sibberns brevroman — kimen til den danske dannelsesroman«"
        year: "2006–2009"
        venue: "Dansk litteraturs historie, 5 vols., eds. Klaus P. Mortensen and May Schack; online at lex.dk from 17 December 2012"
        note: >
          Two consecutive sections of the standard Danish literary history,
          and the best short modern account of Sibbern. The first is on the
          philosophy — the hostility to private property and the 2135 utopia,
          the Naturphilosophie that came out of the Sophie Ørsted crisis, and
          the philosophy of personality — and the second argues that
          »Efterladte Breve af Gabrielis« (1826) is not a wertheriade but the
          seed of the Danish Bildungsroman. Minke also sets Sibbern's
          Christianity against Kierkegaard's: for Sibbern it is the background
          of the philosophy, not its object, which is how he could write in
          1847 that one may belong to God's kingdom »uden at være Christen«.
        sections:
          - title: "»Poesien som livsfilosofi — F.C. Sibbern« — read online; printed volume and pages to establish"
            status: reference
            links:
