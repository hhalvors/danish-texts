      - id: juul-nielsen-1991
        editor: "Jørgen Juul Nielsen (introduction and notes)"
        title: "Menneskeværd og menneskevel"
        year: "1991"
        venue: "København: C. A. Reitzels Forlag, 83 pp. ISBN 87-7421-728-3"
        note: >
          Danish edition of the same 1810 essay, again under its subtitle, with
          an introduction and notes by Jørgen Juul Nielsen. The only one of the
          three modern editions to carry a full modern commentary on the essay,
          and the only one published in Denmark — so it is the natural check on
          the reading of »enslige Ting« given here: whether Juul Nielsen also
          takes the primacy-of-the-individual thesis to be the essay's point,
          and whether his notes settle anything about the text's antiqua/»ö«
          orthography or the 1807 signature vs. 1810 printing. Not digitised;
          obtain a copy or consult by ILL.
