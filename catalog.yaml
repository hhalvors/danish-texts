  - id: kroman
    name: "Kristian Kroman"
    dates: "1846–1925"
    bio: >
      Professor of philosophy at Copenhagen 1884–1922, in the chair he took over
      from Sophus Heegaard, and one of the three professors who between them ran
      the filosofikum for a generation — Høffding and Claudius Wilkens were the
      other two. He came to philosophy sideways: a schoolteacher's training at
      Jonstrup in 1865, then artium read on his own in 1869, and a turn to
      philosophy that Dansk Biografisk Leksikon credits to Kierkegaard's writings
      and to personal acquaintance with Hans Brøchner. His specialism was what we
      would call philosophy of science. »Vor Naturerkjendelse« (1883), which took
      the Academy's gold medal and was translated into German the same year,
      divides the sciences into formal and real, and grounds the certainty of the
      formal ones in a claim about what we can picture: »Al Tankenødvendighed
      beror til syvende og sidst paa Anskuelsesnødvendighed«. That premise is
      what put him at odds with the mathematics of his century — DBL names it as
      the reason for his polemical stance toward both the non-Euclidean
      geometries and Einstein's relativity theory. He is in this collection for
      the second of those quarrels. His 1915 attack on special relativity in
      Fysisk Tidsskrift set off the only sustained critical discussion the theory
      received in Denmark, and Høffding answered him by name in »Relation som
      Kategori« (1921), which we carry in both Danish and English. He also taught
      Bohr filosofikum. Kroman is otherwise best remembered outside philosophy
      altogether, as a school reformer and as the author of the gymnastics
      handbook that put a modified Swedish system into Danish schools.
    works:

      - id: sjaelens-existens
        title: "Den exakte Videnskabs Indlæg i Problemet om Sjælens Existens: en kritisk Undersøgelse"
        year: "1877"
        venue: "J. H. Schubothes Boghandel, Copenhagen"
        note: >
          The doctoral dissertation, arguing that the question of a soul
          substance cannot be settled scientifically, positively or negatively
          — though Kroman held privately, and lifelong, that the hypothesis
          was the more probable one.
        sections:
          - title: "Complete work ([4], 183 pp.)"
            status: to-do
            links:
