      - id: johannesclimacos
        title: "Mag. S. Kierkegaards \"Johannes Climacus\" og Dr. H. Martensens \"Christelige Dogmatik\""
        year: "1849"
        venue: "C.A. Reitzel, Copenhagen"
        note: >
          Nielsen's public response to Kierkegaard's »Afsluttende
          uvidenskabelig Efterskrift«, published 15 October 1849: he reads
          Climacus against Martensen's »Christelige Dogmatik« to argue that
          the dogmatics fails »i dens Princip som i dens Problem«. The
          review-essay turns at p. 42 from its first question, „Har ikke
          »Johannes Climacus« dialektisk skjærpet det christelige Problem?",
          to its second, „Har ikke »den christelige Dogmatik« udialektisk
          omgaaet det christelige Problem?". It opened the Danish
          faith-and-knowledge controversy, and broke Kierkegaard's confidence
          in Nielsen.
        sections:
          - title: "Complete work (pp. 3–132)"
            status: complete
            links:
              - label: "Transcription"
