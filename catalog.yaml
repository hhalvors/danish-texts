                url: "https://books.google.com/books?id=oS5RAAAAYAAJ"
              - label: "Translation (Stewart, Texts from Golden Age Denmark 1, 2005)"
                url: "https://www.jonstewart.dk/goldenagetexts.html"

      - id: indlednings-foredrag
        title: "Indlednings-Foredrag til det i November 1834 begyndte logiske Cursus paa den kongelige militaire Høiskole"
        year: "1835"
        venue: "Kjøbenhavn: Schubothe; 42 pp., Fraktur"
        note: >
          Delivered as a lecture in 1834 and printed the following year; the
          clearest single statement of Heiberg's Hegelian idealism. Arguing from
          a theory of categories, he places philosophical knowing above both
          religious knowing and the natural sciences — the claim that made the
          piece a scandal — and, despite the title, ranges well beyond logic
          into philosophy of language and a taxonomy of poetic forms. It is here
          that the appeal to »Tidens Fordring«, the demand of the age, is made
          in the form Kierkegaard would satirise in »Forord« and »Stadier paa
          Livets Vei«. Martensen's review of it (1836) is his own entry into the
          debate, and Sibbern and Nielsen followed; the resulting exchange, on
          the relation of philosophy to religion, is the direct ancestor of the
          Nielsen–Brøchner controversy catalogued below. The 1835 separate
          printing has NOT been digitised: KB's copy, shelfmark 14,-105-8°
          (»Kan ikke hjemlånes«), is flagged »Digitalisering eller læsesal«,
          i.e. it is eligible for digitisation on demand — the cheapest way to
          get this text is to order that, and it belongs on the KB visit list.
          KB catalogues the printing twice, once under the copy and once as a
          Schubothe imprint; both records are linked. Meanwhile the reprint in
          »Prosaiske Skrifter« vol. 2 (Schubothe) is available in full view and
          is linked below. Note provisional: written from the KB record,
          Stewart's introduction and the standard bibliographies, not from a
          reading of the text.
        sections:
          - title: "Complete work (in »Prosaiske Skrifter« vol. 2; 1835 printing not digitised)"
            status: to-do
            links:
              - label: "Scan, »Prosaiske Skrifter« vol. 2 (Google Books)"
