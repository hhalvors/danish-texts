    # Secondary literature on Bohr (distinct from any primary `works` above).
    secondary-literature:

      - id: norretranders-det-udelelige
        author: "Tor Nørretranders"
        title: "Det udelelige: Niels Bohrs aktualitet i fysik, mystik og politik"
        year: "1985; 3rd ed. 2022"
        venue: "Gyldendal, Copenhagen; 3. udgave 2022, 480 pp., ill."
        note: >
          The best popular treatment of Bohr in Danish, about his continuing
          relevance rather than a biography: Nørretranders, a science
          journalist, follows the three tracks of the subtitle, the second on
          the conceptual difficulties of building a holistic world-picture on
          quantum mechanics and the third on Bohr and the atomic-weapons
          question. It carries a very large note apparatus and an extensive
          bibliography. The 3rd edition (2022) is revised and much enlarged,
          with a new fourth part and an afterword, so page references must
          name the edition.
        sections:
          - title: "Complete book — not held; 1985 pagination to establish"
            status: reference
            links:
              - label: bibliotek.dk
                url: "https://bibliotek.dk/materiale/det-udelelige_tor-noerretranders/work-of:870970-basis:06278728"

      - id: favrholdt-philosophical-background
        author: "David Favrholdt"
        title: "Niels Bohr's Philosophical Background"
        year: "1992"
        venue: "Historisk-filosofiske Meddelelser 63, Det Kongelige Danske Videnskabernes Selskab, Copenhagen"
        note: >
          Favrholdt's book-length study reconstructing the philosophical
          sources of Bohr's thought — the long argument later distilled in
          »Filosoffen Niels Bohr« (2009). Written in English and freely
          available from the Royal Danish Academy.
        sections:
          - title: "Complete monograph (English original)"
            status: reference
            links:
              - label: "Royal Academy"
                url: "http://publ.royalacademy.dk/books/216/1386?lang=da"
              - label: PDF
                url: "http://publ.royalacademy.dk/backend/web/uploads/2019-07-08/AFL%201/H_63_00_00_1992_709/H_63_00_00_1992_709.pdf"

      - id: favrholdt-filosoffen-niels-bohr
        author: "David Favrholdt"
        title: "Filosoffen Niels Bohr"
        year: "2009"
        venue: "Informations Forlag, Copenhagen"
        note: >
          Favrholdt's synthesis of his lifelong study of Bohr as thinker,
          arguing that Bohr was a genuine philosopher whose insight into
          quantum mechanics yielded a modern understanding of the limits of
          thought imposed by our language and concepts. Favrholdt (1931–2012),
          professor at the University of Southern Denmark, heard Bohr lecture
          as a student and became the leading Danish interpreter of
          complementarity.
        sections:
          - title: "Complete work"
            status: skeleton
            links:
              - label: Translation
                url: "https://hhalvors.github.io/danish-texts/texts/favrholdt/niels-bohr/translation.pdf"
              - label: Publisher
                url: "https://butik.information.dk/products/filosoffen-niels-bohr"

# ---------------------------------------------------------------------------
# General reference works on the history of Danish philosophy as a whole
# (not tied to any single author above). Included so that scholars can find
# the standard surveys. These are secondary literature; no transcription or
# translation is planned.
# ---------------------------------------------------------------------------

# Cross-author source dossiers: selected passages in which one word occurs,
# across several authors. Each lives in texts/dossiers/<word>/; you edit its
# selection.txt, and `make` regenerates dossier.tex (via dossier.py) and
# dossier.pdf. Full instructions: texts/dossiers/README.md. Same record shape
# as `references:` below; rendered by DanishTexts.hs as "Source dossiers",
# after the authors. Never generate one with --ebooks into this repo: the
# e-book reissues are in copyright.
dossiers:

  - id: tilegnelse
    title: "Tilegnelse hos Sibbern, Kierkegaard, Brøchner og Høffding"
    authors: "Generated from this collection and Søren Kierkegaards Skrifter"
    year: "2026"
    note: >
      Passages in which Tilegnelse bears on Kierkegaard's use of the word in the
      Postscript, appropriation as a way of knowing: 180 in all, from Sibbern (18),
      Kierkegaard (124), Brøchner (32) and Høffding (6), selected by reading from the
      293 in which the word occurs, grouped by author and work, with printed-page
      citations and the word highlighted.
    links:
      - label: "PDF"
        url: "https://hhalvors.github.io/danish-texts/texts/dossiers/tilegnelse/dossier.pdf"

  - id: entydig
    title: "Entydig hos Niels Bohr"
    authors: "Generated from Bohr's Filosofiske Skrifter, his printed Danish, and this collection"
    year: "2026"
    note: >
      Where Bohr writes entydig, from the Danish manuscript of 1925 (beside the
      German eindeutig and the English unique) to a letter of 1959 that sets
      eentydig against tvetydighed; with the word's near-absence from Danish
      philosophy before him, where only the 1916 relativity debate uses it.
    links:
      - label: "PDF"
        url: "https://hhalvors.github.io/danish-texts/texts/dossiers/entydig/dossier.pdf"

  - id: energibevarelse
    title: "Energiens Bestaaen hos Høffding"
    authors: "Generated from this collection"
    year: "2026"
    note: >
      Høffding on the conservation of energy, which he calls Energiens (earlier
      Kraftens) Bestaaen: its forerunners in Descartes and Leibniz, its discovery
      by Mayer, Colding, Joule and Helmholtz, its standing as a principle, its
      bearing on mind and body, and his analogy of the conservation of value.
      34 passages from 4 transcribed works, selected by reading, grouped by work,
      with printed-page citations and the key terms highlighted; 108 more, in
      e-book reissues still in copyright, are left out.
    links:
      - label: "PDF"
        url: "https://hhalvors.github.io/danish-texts/texts/dossiers/energibevarelse/dossier.pdf"

references:

  - id: ebbesen-koch-ddfh
    title: "Den danske filosofis historie, bind 1–5"
    authors: "Sten Ebbesen & Carl Henrik Koch (red.)"
    year: "2002–2004"
    venue: "Gyldendal, Copenhagen; 5 vols., ~2068 pp."
    note: >
      The standard history of Danish philosophy, from the Middle Ages to the
      mid-twentieth century. Carl Henrik Koch is the principal author (sole
      author of vols. 3–5, co-author of vol. 2); the medievalist Sten Ebbesen
      wrote vol. 1 and co-authored vol. 2.
    volumes:
      - "Bind 1 — Sten Ebbesen, »Dansk middelalderfilosofi ca. 1170–1536« (2002)"
      - "Bind 2 — Sten Ebbesen & Carl Henrik Koch, »Dansk filosofi i renæssancen 1537–1700« (2003)"
      - "Bind 3 — Carl Henrik Koch, »Dansk oplysningsfilosofi 1700–1800« (2003)"
      - "Bind 4 — Carl Henrik Koch, »Den danske idealisme 1800–1880« (2004)"
      - "Bind 5 — Carl Henrik Koch, »Dansk filosofi i positivismens tidsalder 1880–1950« (2004)"
    links:
      - label: "Review / overview (historie-online.dk)"
        url: "https://www.historie-online.dk/boger/anmeldelser-5-5/diverse-84/den-danske-filosofis-historie"
