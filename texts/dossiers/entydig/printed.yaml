# Bohr's Danish in print: passages with entydig/eentydig, each transcribed from
# the page image and checked against it (26 Sept 2026). Chronological.
# Add an item by copying one of these; build.py prints them in this order.
# Where the Collected Works volume number is marked "vol. ?", it still needs
# confirming against the printed volume.

- heading: "1925: Atomteori og Mekanik — the Danish manuscript beside the published versions"
  note: >
    From the Collected Works' table “Examples of variants in the versions A, B,
    D and F”, with the original (uncorrected) Danish manuscript of the address
    given at the Sixth Scandinavian Mathematics Congress, Copenhagen, 31 August
    1925. A = Nature (Suppl.) 116 (1925); B = the congress Beretning (1926),
    English; D = Naturwissenschaften 14 (1926), German; F = Atomteori og
    Naturbeskrivelse (1929), Danish. The Collected Works judges A the later of
    the two English versions. Niels Bohr Collected Works, vol. ?, p. [271].
  columns: ["A (English)", "B (English)", "D (German)", "F (Danish, 1929)", "Danish manuscript (1925)"]
  variants:
    - ["p. 850: which prevents a unique assignment of quantum indices on the basis of mechanical pictures.",
       "p. 64: [As A.]",
       "p. 7: der eine eindeutige Zuordnung von Quantenzahlen in Anlehnung an die Quantisierungsregeln für Periodizitätssysteme ausschließt.",
       "p. 34: der forhindrer en entydig Benyttelse af Kvantetal i Tilknytning til Kvantiseringsreglerne for Periodicitetssystemer.",
       "p. 10: som udelukker en entydig Tildeling af Kvantetal i Tilknytning til Periodicitetssystemernes Teori."]
    - ["p. 851: that the results do not allow of a unique association with mechanical pictures.",
       "p. 65: that the results do not allow of an association with a unique mechanical picture.",
       "p. 7: daß sie keine eindeutige Zuordnung zu mechanischen Bildern zulassen.",
       "p. 35: at de ikke tillader nogen entydig Benyttelse af mekaniske Billeder.",
       "p. 10: saa unddrager disse Resultater sig for det første en entydig Indordning under mekaniske Forestillinger."]

- heading: "1929: Atomteorien og Grundprincipperne for Naturbeskrivelsen"
  note: >
    Address to the 18th Meeting of Scandinavian Scientists, Copenhagen, 26 August
    1929; Beretning om det 18. skandinaviske Naturforskermøde (1929), pp. 71–83.
    Bohr's Danish original.
  passages:
    - text: >
        Men dersom de paagældende fysiologiske Fænomener frembyder en til den
        omhandlede Grænse udviklet Forfining, betyder det jo, at vi samtidig
        nærmer os Grænsen for deres entydige Beskrivelse ved Hjælp af vore
        sædvanlige anskuelige Forestillinger.
      cite: "Beretning om det 18. skandinaviske Naturforskermøde (1929), p. 82; Collected Works p. [234]"

- heading: "1956: Atomerne og den menneskelige erkendelse"
  note: >
    Separate print, København 1956 (in the folder as SP_57_00_00_1956_1761.pdf).
    The same essay stands in Filosofiske Skrifter II, where it has no pages.
  passages:
    - text: >
        Omvendt kræver enhver entydig anvendelse af dynamiske bevarelseslove i
        kvantefysikken, at det omhandlede fænomens beskrivelse for de atomare
        objekters vedkommende indebærer et principielt afkald med hensyn til
        detaljeret rum-tidskoordination.
      cite: "Atomerne og den menneskelige erkendelse (København 1956), p. 9"
    - text: >
        I kvantefysikken er, som vi har set, en redegørelse for
        måleinstrumenternes funktioner uundværlig for definitionen af
        fænomenerne, og vi må så at sige drage skillelinien mellem subjekt og
        objekt på en måde, der i hvert enkelt tilfælde sikrer den entydige
        anvendelse af de i meddelelserne benyttede elementære fysiske begreber.
      cite: "Atomerne og den menneskelige erkendelse (København 1956), p. 10"

- heading: "1959: letter to Max Delbrück, 25 July 1959"
  note: >
    Carbon copy, Tisvilde. Printed in the Collected Works, Part V, Selected
    Correspondence (vol. ?), pp. [479]–[480]; translation p. [481]. Note the
    spelling eentydig, and its pairing with tvetydighed and with "objektiv".
    A letter, not a publication.
  passages:
    - text: >
        Naturligvis rummer enhver brug af ordet “tænke” med dets implicite
        henvisning til et bevidst subjekt en tvetydighed, så længe man ikke
        klargør sig sprogets formål, at meddele sig på eentydig eller måske
        rettere objektiv måde til vore medmennesker.
      cite: "Bohr to Delbrück, 25 July 1959; Collected Works p. [479]"
    - text: >
        Pointen er jo her, at selvom enhver eentydig meddelelse kræver
        distinktion mellem et subjekt og et objekt, kan det subjekt, der
        underforstås i en given situation, helt eller delvis indgå i det
        objektive indhold af en meddelelse om en anden situation.
      cite: "Bohr to Delbrück, 25 July 1959; Collected Works p. [480]"

- heading: "1961: Atomvidenskaben og menneskehedens krise"
  note: >
    Politiken, 20 April 1961. Printed in the Collected Works under TEXT AND
    TRANSLATION (vol. ?), p. [284].
  passages:
    - text: >
        Trods den gennemgribende revision af grundlaget for den entydige
        anvendelse af så elementære begreber som rum og tid, kan
        relativitetsteorien betragtes som en harmonisk afrunding af den såkaldte
        klassiske fysik.
      cite: "Politiken, 20 April 1961; Collected Works p. [284]"
    - text: >
        Derimod skulle opdagelsen af det universelle virkningskvantum afsløre et
        helhedstræk ved de atomare processer, som var ganske fremmed for den
        mekaniske naturopfattelse, der jo antager muligheden af en uindskrænket
        opdeling af fænomenerne og af deres beskrivelse som en kæde, hvis
        enkelte led ligegyldigt hvor langt underdelingen fortsættes kan
        sammenknyttes gennem entydig anvendelse af begreberne årsag og virkning.
      cite: "Politiken, 20 April 1961; Collected Works p. [284]"
